# --- EmuSuNi 00.64: the 3DS at its own resolution, the touchpad as a trackpad
3DS: the console's own resolution only = 3DS: только родное разрешение консоли
Each console's own resolution (the N64, the PlayStation, the PSP and the DS at 1x), no upscaler and no filters. = Родное разрешение каждой консоли (N64, PlayStation, PSP и DS в 1x), без масштабирования и фильтров.
Smooth Edges; the N64, the PlayStation and the PSP at 2x. = Гладкие края; N64, PlayStation и PSP в 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP at 3x. = Естественное HD; N64 и PlayStation в 4x, PSP в 3x.
Natural AI; the N64, the PlayStation and the PSP at 4x. = Естественный ИИ; N64, PlayStation и PSP в 4x.
Trackpad = Трекпад
Direct = Прямой
As a laptop's trackpad: the finger moves the stylus from where it is (putting it down doesn't move it), a short tap touches the screen there. To drag: hold the touchpad's click and move, or tap and touch again at once and move. = Как трекпад ноутбука: палец двигает стилус от текущего места (касание его не сдвигает), короткое касание - нажатие на экран в этом месте. Перетаскивание: удерживайте нажатие сенсорной панели и двигайте или коснитесь, сразу коснитесь снова и двигайте.

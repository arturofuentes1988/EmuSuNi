As on a TV of the time: a little wider than the console's own pixels. = Как на телевизоре тех лет: чуть шире собственных пикселей консоли.
Square pixels, exactly as the console draws them (a little narrower). = Квадратные пиксели, в точности как рисует консоль (чуть уже).
Stretched to a widescreen TV (everything looks wider). = Растянуто на широкий экран (всё выглядит шире).
Fills the whole screen, whatever its shape. = Заполняет весь экран, какой бы ни была его форма.
The console's own 256x224 picture, enlarged by the TV (the fastest). = Собственное изображение консоли 256x224, увеличенное телевизором (быстрее всего).
Redrawn at 512x448 before it is fitted to the TV. = Перерисовано в 512x448 перед подгонкой под телевизор.
Redrawn at 768x672: for 720p TVs. = Перерисовано в 768x672: для телевизоров 720p.
Redrawn at 1024x896. = Перерисовано в 1024x896.
Redrawn at 1280x1120: the closest to a 1080p (Full HD) TV. = Перерисовано в 1280x1120: ближе всего к телевизору 1080p (Full HD).
Redrawn at 1536x1344, then made smaller for the TV (a little smoother). = Перерисовано в 1536x1344, затем уменьшено для телевизора (чуть плавнее).
As big as the TV allows. = Во весь экран.
The biggest whole multiple of the console's lines (4x on a 1080p TV): every pixel the same size, with a black border. = Наибольшее целое кратное строк консоли (4x на телевизоре 1080p): все пиксели одного размера, с чёрной рамкой.
Twice the console's size, small in the middle of the TV. = Вдвое больше размера консоли, небольшое в центре экрана.
Three times the console's size. = Втрое больше размера консоли.
Four times the console's size. = Вчетверо больше размера консоли.
The whole picture. = Изображение целиком.
A little bigger: the edges are cut. = Чуть крупнее: края обрезаются.
Bigger: more of the edges are cut. = Крупнее: края обрезаются сильнее.
Much bigger: fills a widescreen TV more, the edges cut. = Намного крупнее: лучше заполняет широкий экран, края обрезаются.
224 lines: the empty lines at the top and bottom are hidden. = 224 строки: пустые строки сверху и снизу скрыты.
Every line (some games show a black stripe or glitches at the edges). = Все строки (в некоторых играх видна чёрная полоса или ошибки по краям).
Hidden when the game doesn't draw on them. = Скрываются, когда игра на них не рисует.
NTSC games at 60 and PAL games at 50 frames per second. = Игры NTSC - 60, а PAL - 50 кадров в секунду.
Every game at 60 (PAL games run faster than on their console). = Все игры с 60 (игры PAL идут быстрее, чем на своей консоли).
Every game at 50 (NTSC games run slower). = Все игры с 50 (игры NTSC идут медленнее).
As fast as the PS4 can (up to 4x). = Так быстро, как может PS4 (до 4x).
Smooth movement, no tearing. = Плавное движение, без разрывов.
A little less input delay; the picture may tear. = Чуть меньше задержка ввода; возможны разрывы изображения.
Rounded edges and clean lines: the most HD look. = Скруглённые края и чистые линии: самый HD-вид.
Softer edges, closer to the original pixels (up to 4x). = Более мягкие края, ближе к исходным пикселям (до 4x).
Bigger square pixels: crisp and even, like the original. = Более крупные квадратные пиксели: чёткие и ровные, как в оригинале.
Every pixel crisp (at Native some pixels can look wider than others). = Каждый пиксель чёткий (при Родном некоторые пиксели могут выглядеть шире других).
Soft, blended pixels. = Мягкие, смешанные пиксели.
A clean picture. = Чистое изображение.
The yellow video cable: colours bleed, soft details. = Жёлтый видеокабель: цвета расплываются, детали мягкие.
Sharper than composite, a little colour bleeding. = Чётче композитного, цвета немного расплываются.
The best cable of the time: sharp, clean colours. = Лучший кабель тех лет: чёткость и чистые цвета.
The aerial cable: the blurriest, with noise. = Антенный кабель: самый размытый, с шумом.
A black and white TV. = Чёрно-белый телевизор.
No lines. = Без линий.
Faint lines. = Едва заметные линии.
Clear lines. = Заметные линии.
Dark lines, like an arcade monitor. = Тёмные линии, как на аркадном мониторе.
The hi-res mode's columns as they are. = Столбцы режима высокого разрешения как есть.
Pairs of columns averaged: the see-through effects look as on a TV. = Пары столбцов усредняются: прозрачность выглядит как на телевизоре.
The columns softened. = Столбцы смягчены.
As the console: sprites flicker when too many share a line. = Как на консоли: спрайты мерцают, когда их слишком много на строке.
More sprites per line than the console could: less flicker (a few games glitch). = Больше спрайтов на строку, чем могла консоль: меньше мерцания (некоторые игры сбоят).
Water, shadows and fades as on the console. = Вода, тени и затемнения как на консоли.
No colour math (to find graphic glitches). = Без смешивания цветов (для поиска графических ошибок).
The console's own speed. = Собственная скорость консоли.
A little faster: less slowdown, safe in most games. = Чуть быстрее: меньше замедлений, безопасно в большинстве игр.
Faster: removes most slowdown; some games glitch. = Быстрее: убирает большинство замедлений; некоторые игры сбоят.

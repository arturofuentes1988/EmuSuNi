# --- 00.68: the Dreamcast's Quality levels
Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the Dreamcast at 1x), no upscaler and no filters. = Родное разрешение каждой консоли (N64, PlayStation, PSP, DS и Dreamcast в 1x), без масштабирования и фильтров.
Smooth Edges; the N64, the PlayStation, the PSP and the Dreamcast at 2x. = Гладкие края; N64, PlayStation, PSP и Dreamcast в 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP and the Dreamcast at 3x. = Естественное HD; N64 и PlayStation в 4x, PSP и Dreamcast в 3x.
Natural AI; the N64, the PlayStation and the PSP at 4x, the Dreamcast at 3x with the sharpest textures. = Естественный ИИ; N64, PlayStation и PSP в 4x, Dreamcast в 3x с самыми чёткими текстурами.
The Dreamcast's own 640x480 picture: the lightest. = Собственное изображение Dreamcast 640x480: легче всего.
Twice the size (1280x960): sharper 3D. = Вдвое крупнее (1280x960): чётче 3D.
Three times (1920x1440), made smaller for a 1080p TV: the sharpest 3D, the smoothest edges. = Втрое (1920x1440), с уменьшением под телевизор 1080p: самое чёткое 3D, самые гладкие края.
The size the GPU draws Dreamcast, NAOMI and Atomiswave games at: real HD 3D, not an enlarged picture. The size changes at the next start. = Размер, в котором GPU рисует игры Dreamcast, NAOMI и Atomiswave: настоящее 3D в HD, а не увеличенная картинка. Размер меняется при следующем запуске.
How sharp the textures of far, slanted surfaces stay (anisotropic filtering, on the GPU). It changes at the next game start. = Насколько чёткими остаются текстуры дальних наклонных поверхностей (анизотропная фильтрация на GPU). Меняется при следующем запуске игры.
The console's own resolution (640x480), textures 4x sharp far away: the lightest. The size changes at the next start. = Родное разрешение консоли (640x480), дальние текстуры с чёткостью 4x: легче всего. Размер меняется при следующем запуске.

Voices Volume = Громкость голосов
Test Microphone = Проверить микрофон
Stop = Стоп
Open Mic = Открытый микрофон
Push to Talk: L3 = Говорить по кнопке: L3
Push to Talk: R3 = Говорить по кнопке: R3
Push to Talk: L2 = Говорить по кнопке: L2
Talk with your friends in online games: your microphone (a headset on the controller, a USB microphone or the PlayStation Camera) and their voices. = Общайтесь с друзьями в онлайн-играх: ваш микрофон (гарнитура на контроллере, USB-микрофон или PlayStation Camera) и их голоса.

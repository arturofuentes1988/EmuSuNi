# --- EmuSuNi 00.91: Send Log (the logs to EmuSuNi's server)
Send Log = Отправить журнал
Log Sent = Журнал отправлен
Send = Отправить
Try Again = Повторить
Nothing is sent. = Ничего не отправляется.
EmuSuNi's log goes to its creator, to find what went wrong: what the app did this time and the time before (games started, settings, errors), how it closed (crash.log) and its version. = Журнал EmuSuNi уходит автору, чтобы найти причину ошибки: что приложение делало в этот и в прошлый раз (запущенные игры, настройки, ошибки), как оно закрылось (crash.log) и его версия.
Not sent: your games, saves or other files. Your nickname and user names are taken out; the server keeps only the country, never your address, and deletes the log after 90 days. = Не отправляются: ваши игры, сохранения и другие файлы. Ник и имена пользователей удаляются; сервер хранит только страну, никогда не адрес, и удаляет журнал через 90 дней.
You get a code: write it in your report on GitHub (Issues) or Telegram. = Вы получите код: укажите его в своём сообщении на GitHub (Issues) или в Telegram.
Sends the log now (a few seconds). = Отправляет журнал сейчас (несколько секунд).
Sending the log to EmuSuNi's server... = Отправка журнала на сервер EmuSuNi...
This is its code: write it in your report on GitHub (Issues) or Telegram, with what happened. = Вот его код: укажите его в своём сообщении на GitHub (Issues) или в Telegram вместе с описанием того, что произошло.
Closes this. Settings -> Send Log sends a new one. = Закрывает это окно. Настройки -> Отправить журнал отправит новый.
Sends the log again. = Отправляет журнал снова.
EmuSuNi Closed = EmuSuNi закрылся
EmuSuNi closed by itself last time. = В прошлый раз EmuSuNi закрылся сам.
Send its log to its creator, to find why? It has what the app did, how it closed and its version. Your nickname and user names are taken out; the server keeps only the country, never your address, for 90 days. = Отправить журнал автору, чтобы найти причину? В нём - что делало приложение, как оно закрылось и его версия. Ник и имена пользователей удаляются; сервер хранит только страну, никогда не адрес, в течение 90 дней.
Yes, Send It = Да, отправить
Sends it now: you get a code to write in a report on GitHub or Telegram. = Отправляет сейчас: вы получите код, чтобы указать его в сообщении на GitHub или в Telegram.
Nothing is sent. Settings -> Send Log can send it later. = Ничего не отправляется. Отправить позже можно через Настройки -> Отправить журнал.
The server didn't prove it is EmuSuNi's: nothing was sent. = Сервер не подтвердил, что он от EmuSuNi: ничего не отправлено.
Many logs were sent from this connection today: try again tomorrow. = Сегодня с этого подключения отправлено много журналов: попробуйте завтра.
The log is too big to send. = Журнал слишком большой для отправки.
EmuSuNi's server is full right now: try again later. = Сервер EmuSuNi сейчас переполнен: попробуйте позже.
EmuSuNi's server didn't take it. = Сервер EmuSuNi его не принял.
EmuSuNi's server had a problem: try again later. = На сервере EmuSuNi проблема: попробуйте позже.
No internet connection: check the PS4's network. = Нет подключения к интернету: проверьте сеть PS4.
EmuSuNi's server didn't answer: try again later. = Сервер EmuSuNi не ответил: попробуйте позже.
EmuSuNi's server isn't known: check the PS4's internet connection. = Сервер EmuSuNi неизвестен: проверьте подключение PS4 к интернету.


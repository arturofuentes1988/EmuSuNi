What is RetroAchievements? = Что такое RetroAchievements?
How to start (a free account, the login here), what achievements and points are, the consoles and the files it knows. = Как начать (бесплатная учётная запись, вход здесь), что такое достижения и очки, какие консоли и файлы он знает.
What it is = Что это
RetroAchievements (retroachievements.org) adds achievements to classic games: goals inside each game - beat a boss, find a secret, finish a level fast - unlocked as you play, each with its points. It's free, made by its players. = RetroAchievements (retroachievements.org) добавляет достижения в классические игры: цели внутри каждой игры - победить босса, найти секрет, быстро пройти уровень, - которые открываются по ходу игры, каждая со своими очками. Это бесплатно, и всё делают сами игроки.
1. A free account = 1. Бесплатный аккаунт
Make one at retroachievements.org, on a phone or a computer, and confirm the e-mail it sends you: until then it refuses the login. = Создайте её на retroachievements.org с телефона или компьютера и подтвердите присланное письмо: до этого вход не будет работать.
2. Log in here = 2. Войдите здесь
Settings -> RetroAchievements -> Log In: the keyboard asks for your user name, then your password. EmuSuNi keeps only the key the site gives back (never the password) and logs in again by itself at each start. = Настройки -> RetroAchievements -> Войти: клавиатура запросит имя пользователя, затем пароль. EmuSuNi хранит только ключ, выданный сайтом (никогда не пароль), и сам входит снова при каждом запуске.
3. Play = 3. Играйте
A game with achievements says so when it starts; each unlock shows a picture. The in-game menu's Achievements lists them with your progress; My Achievements keeps what you unlocked; Triangle -> Achievements on a game shows them all. = Игра с достижениями сообщает об этом при запуске; каждое открытое достижение показывает картинку. «Достижения» во внутриигровом меню показывают их с вашим прогрессом; «Мои достижения» хранят открытое; Треугольник -> Достижения на игре показывает все.
Casual and points = Casual и очки
EmuSuNi plays in RetroAchievements' Casual mode: save states, cheats and any speed are allowed, and the points go to your account. (Its Hardcore mode waits until RetroAchievements approves EmuSuNi.) = EmuSuNi работает в режиме Casual RetroAchievements: разрешены сохранения состояния, читы и любая скорость, а очки идут в вашу учётную запись. (Режим Hardcore - когда RetroAchievements одобрит EmuSuNi.)
The consoles = Консоли
With achievements: {}. Not yet: Nintendo 3DS. = С достижениями: {}. Пока нет: Nintendo 3DS.
Which files = Какие файлы
RetroAchievements knows certain files of each game - most often the usual dumps of its American, European or Japanese version (No-Intro's for cartridges, Redump's for discs); not translations or hacks. The "RA" mark on a cover says the file is known; Triangle -> Achievements on a game without it shows the files it knows. = RetroAchievements знает определённые файлы каждой игры - чаще всего обычные дампы американской, европейской или японской версии (No-Intro для картриджей, Redump для дисков); не переводы и не хаки. Метка "RA" на обложке значит, что файл известен; Треугольник -> Достижения на игре без неё показывает известные файлы.
Without a connection = Без связи
The game plays as always. Unlocks made offline wait and are sent when the connection comes back, while EmuSuNi stays open; My Achievements shows what this PS4 kept. = Игра работает как обычно. Достижения, открытые без связи, ждут и отправятся, когда связь вернётся, пока EmuSuNi не закрыт; «Мои достижения» показывают сохранённое на этой PS4.
RetroAchievements: every achievement of the game, unlocked or not, with your progress; for a file it doesn't know, the files of the game it knows. = RetroAchievements: все достижения игры, открытые и нет, с вашим прогрессом; для неизвестного файла - известные файлы этой игры.
Not logged in: its achievements show here once you log in (Settings -> RetroAchievements -> Log In) = Вход не выполнен: достижения появятся здесь после входа (Настройки -> RetroAchievements -> Войти)
RetroAchievements knows this file, "{}", as a version of "{}" whose achievements don't work with it. = RetroAchievements знает этот файл, "{}", как версию "{}", с которой её достижения не работают.
RetroAchievements doesn't know this file: "{}". = RetroAchievements не знает этот файл: "{}".
It has no achievements for a game of that name on this console. = Для игры с таким названием на этой консоли достижений нет.
"{}" has {} achievements with these files: = Достижения "{}" ({}) работают с этими файлами:
{} files; their names aren't known here: retroachievements.org lists them (the game's page -> Supported Game Files). = Файлов: {}; их названия здесь неизвестны: список есть на retroachievements.org (страница игры -> Supported Game Files).
And {} more, whose names aren't known here (retroachievements.org: the game's page -> Supported Game Files). = И ещё {}, чьи названия здесь неизвестны (retroachievements.org: страница игры -> Supported Game Files).

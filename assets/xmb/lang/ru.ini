The touchpad is the screen: the finger presses the stylus where it lands, as on the 3DS itself. = Сенсорная панель - это экран: касание там, где палец коснулся, как на самой 3DS.
How the DualShock 4's touchpad is the DS's touch screen. The stylus stays where it was left; the right stick moves it too; the Tap button is set in Controls. = Как сенсорная панель DualShock 4 работает в роли сенсорного экрана DS. Стилус остаётся там, где его оставили; правый стик тоже его двигает; кнопка «Коснуться экрана» назначается в Управлении.

How Resolution redraws the pixels: xBRZ and HQx round the edges for an HD look; Sharp Pixels keeps them square. HQx goes up to 4x. = Как Разрешение перерисовывает пиксели: xBRZ и HQx скругляют края для вида HD; Чёткие пиксели оставляют их квадратными. HQx - до 4x.

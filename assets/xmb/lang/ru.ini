# --- EmuSuNi 00.89: macros (several buttons in one) and the statistics' notice
Several buttons in one (fighting games). Cross: press the macro's button, then hold together the buttons it presses and let them go. Left: none. Its button stops doing what it did. = Несколько кнопок в одной (файтинги). Крест: нажмите кнопку макроса, затем зажмите вместе кнопки, которые он нажимает, и отпустите. Влево: нет. Кнопка макроса перестаёт делать то, что делала.
Now hold together the buttons it presses, then let them go...  (5 s: cancel) = Теперь зажмите вместе кнопки, которые он нажимает, и отпустите...  (5 с: отмена)
Hold its buttons... = Зажмите его кнопки...
EmuSuNi sends anonymous statistics: how many use it and from which countries, its version, the PS4's language, the console and the game played (a checksum or a disc's code, never a file's name). = EmuSuNi отправляет анонимную статистику: сколько людей его используют и из каких стран, его версию, язык PS4, консоль и игру (контрольную сумму или код диска, никогда не имя файла).
Never sent: names, PSN, your list of games, your files. The server keeps no address. = Никогда не отправляются: имена, PSN, ваш список игр, ваши файлы. Сервер не хранит адреса.
Off, nothing at all is sent. Change it any time: Settings -> Anonymous Statistics. = Если выключить, ничего не отправляется. Изменить можно в любой момент: Настройки -> Анонимная статистика.
Turn Them Off = Выключить

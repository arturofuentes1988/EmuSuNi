# --- EmuSuNi 00.40: the GPU Upscaler's steps (Smooth Edges, Natural HD, Natural AI)
Smooth Edges: the GPU smooths the jagged edges and leaves the pixels and textures as they are; the N64, the PlayStation and the PSP at 2x. = Гладкие края: GPU сглаживает зубчатые края, а пиксели и текстуры оставляет как есть; N64, PlayStation и PSP в 2x.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR) that still looks natural; the N64 and the PlayStation at 4x, the PSP at 3x. Heavy N64 games can slow down. = Естественное HD: гладкие края, затем чёткое HD-изображение в разрешении телевизора (AMD FSR), которое выглядит естественно; N64 и PlayStation в 4x, PSP в 3x. Тяжёлые игры N64 могут тормозить.
The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP in Full HD with anti-aliasing. Heavy N64 games can slow down. = Лучшее, на что способна каждая консоль: Естественный ИИ - нейросеть (Anime4K), которая очищает каждый край и сохраняет текстуры (без «восковой» картинки); N64 в 4x с HD 2D; PlayStation в 4x с гладкими текстурами, стабильным 3D и сглаживанием; PSP в Full HD со сглаживанием. Тяжёлые игры N64 могут тормозить.
Smooth Edges = Гладкие края
Only the jagged edges are smoothed (anti-aliasing: MMPX and SMAA); colours, textures and the pixels' shapes stay as they are. Light on the GPU. Quality Medium uses it. = Сглаживаются только зубчатые края (MMPX и SMAA); цвета, текстуры и форма пикселей остаются как есть. Лёгкая нагрузка на GPU. Используется в качестве Среднее.
Natural HD = Естественное HD
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. Quality High uses it. = Гладкие края, затем отрисовка в HD в разрешении телевизора с повышением резкости (AMD FSR): заметно чётче, но естественно, без эффекта рисунка. Используется в качестве Высокое.
Natural AI = Естественный ИИ
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. Quality Ultra uses it. = Чистые края Естественного HD с нейросетью (Anime4K), подмешанной в изображение, поэтому текстуры и дизеринг сохраняются: самый гладкий вид без «воска». Используется в качестве Ультра.
AI (Anime4K) = ИИ (Anime4K)
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest, most painted HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ, затем нейросеть (Anime4K) на полную мощность очищает каждый край и изгиб: самый гладкий, «нарисованный» HD-вид для SNES, NES и Game Boy. N64 получает Гладкое HD.
Draws the picture with the GPU's filters at the TV's resolution. Every filter but HD Sharpen starts from the console's own picture: Resolution and the Upscaling Filter are left out. = Рисует изображение фильтрами GPU в разрешении телевизора. Все фильтры, кроме Резкость HD, берут исходное изображение консоли: Разрешение и Фильтр масштабирования не используются.

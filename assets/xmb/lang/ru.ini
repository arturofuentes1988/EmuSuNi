# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = Сразу задаёт изображение под уровень: разрешение, масштабирование (CPU и GPU), размер изображения, а также размер, синхронизацию и 2D N64. Если изменить что-то из этого, станет Своё. Игра показывает изменение сразу, но размер и синхронизация N64 меняются при следующем запуске игры. Dreamcast всегда работает на Низком (PS4 пока не тянет больше).
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = Сглаживает зубчатые края 3D (мультисэмплинг на GPU). Если изменить во время игры, её 3D настраивается заново: несколько секунд возможны рывки.

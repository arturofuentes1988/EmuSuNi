Zooms in a little to fill more of the TV (the edges are cut). = Немного увеличивает изображение, чтобы заполнить больше экрана (края обрезаются).
Crop Overscan = Обрезать overscan
Hides the lines at the top and bottom that TVs hid (224 lines are shown). = Скрывает строки сверху и снизу, которые скрывали телевизоры (видно 224 строки).
Auto (game speed) = Авто (скорость игры)
Auto runs NTSC games at 60 and PAL games at 50 frames per second, as on the console. = Авто: игры NTSC идут с 60, а PAL - с 50 кадрами в секунду, как на консоли.
Waits for the TV's refresh (no tearing). Off can lower the input delay a little. = Ждёт обновления телевизора (без разрывов). Выкл. может немного уменьшить задержку ввода.
Sharp keeps the pixels crisp; Smooth softens them. = Чёткая сохраняет пиксели резкими; Сглаженная смягчает их.
NTSC Filter = Фильтр NTSC
Composite = Композитный
Monochrome = Монохромный
The look of an old TV cable (blargg's NTSC filter). Costs CPU time. = Как через старый ТВ-кабель (фильтр NTSC от blargg). Нагружает CPU.
Scanlines = Линии развёртки
Light = Слабые
Medium = Средние

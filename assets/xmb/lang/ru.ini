# --- EmuSuNi 00.80: the DS's and the 3DS's screens, one set of settings (Screen Layout, Swap Screens, Small Screen Size and Position, Gap Between Screens)
Screen Layout = Расположение экранов
The top screen over the touch screen, as on the console. = Верхний экран над сенсорным, как на консоли.
The two screens next to each other, the top screen on the left. = Два экрана рядом, верхний слева.
Large Screen + Small = Большой экран + малый
The top screen big, the touch screen small beside it or in a corner: Small Screen Size and Small Screen Position say how. = Верхний экран крупно, сенсорный - маленький рядом или в углу: как именно, задают «Размер малого экрана» и «Положение малого экрана».
Only the top screen, as big as the TV allows. The touchpad still touches the touch screen, unseen. = Только верхний экран, настолько крупно, насколько позволяет телевизор. Сенсорная панель по-прежнему касается сенсорного экрана, хотя его не видно.
Only the touch screen, as big as the TV allows. = Только сенсорный экран, настолько крупно, насколько позволяет телевизор.
How the two screens are shown. Swap Screens (or R3 in the game) trades their places. The DualShock 4's touchpad is always the touch screen, wherever it is. = Как показываются два экрана. «Поменять экраны» (или R3 в игре) меняет их местами. Сенсорная панель DualShock 4 - всегда сенсорный экран, где бы он ни был.
The top screen first: above, on the left or big. = Сначала верхний экран: сверху, слева или крупно.
The touch screen first: above, on the left or big (with one screen only, the other one is shown). = Сначала сенсорный экран: сверху, слева или крупно (при одном экране показывается другой).
Trades the two screens' places. R3 swaps them in the game too, for as long as it runs. = Меняет экраны местами. R3 тоже меняет их в игре, пока она запущена.
Small Screen Size = Размер малого экрана
Half (1/2) = Половина (1/2)
A Third (1/3) = Треть (1/3)
A Quarter (1/4) = Четверть (1/4)
The small screen half the size of the big one. = Малый экран вдвое меньше большого.
The small screen a third of the size of the big one. = Малый экран размером в треть большого.
The small screen a quarter of the size of the big one. = Малый экран размером в четверть большого.
Large Screen + Small: how big the small screen is next to the big one. = Большой экран + малый: размер малого экрана рядом с большим.
Small Screen Position = Положение малого экрана
Right = Справа
Bottom Right = Справа внизу
Top Right = Справа вверху
Left = Слева
Bottom Left = Слева внизу
Top Left = Слева вверху
Below = Снизу
Above = Сверху
Beside the big screen, on its right, in the middle. = Рядом с большим экраном, справа, посередине.
On the big screen's right, in the bottom corner. = Справа от большого экрана, в нижнем углу.
On the big screen's right, in the top corner. = Справа от большого экрана, в верхнем углу.
Beside the big screen, on its left, in the middle. = Рядом с большим экраном, слева, посередине.
On the big screen's left, in the bottom corner. = Слева от большого экрана, в нижнем углу.
On the big screen's left, in the top corner. = Слева от большого экрана, в верхнем углу.
Under the big screen, in the middle. = Под большим экраном, посередине.
Over the big screen, in the middle. = Над большим экраном, посередине.
Large Screen + Small: where the small screen goes, beside the big one - in the middle of a side, in a corner, below or above it. = Большой экран + малый: где малый экран стоит рядом с большим - посередине стороны, в углу, под ним или над ним.
Gap Between Screens = Зазор между экранами
The screens touch each other. = Экраны соприкасаются.
Thin (1/16) = Тонкий (1/16)
A thin black line between them: a sixteenth of a screen's height. = Тонкая чёрная линия между ними: одна шестнадцатая высоты экрана.
Small (1/8) = Малый (1/8)
A little black space between them: an eighth of a screen's height. = Небольшой чёрный промежуток между ними: одна восьмая высоты экрана.
Medium (1/4) = Средний (1/4)
A quarter of a screen's height between them. = Четверть высоты экрана между ними.

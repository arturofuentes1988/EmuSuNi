Everything exactly, recompiled: slower. For a game whose sound is wrong with Fast. = Всё точно, с рекомпиляцией: медленнее. Для игр, у которых с Быстро неправильный звук.
# --- EmuSuNi 00.26: the N64's picture
N64 Anti-Aliasing = Сглаживание N64
On (the N64's) = Вкл. (как на N64)
Smooth 3D edges, as the N64's video chip made them. = Гладкие края 3D, как их делал видеочип N64.
Jagged 3D edges, a little sharper: the picture before the N64's filter. = Зубчатые края 3D, чуть чётче: изображение до фильтра N64.
The N64's own edge smoothing (its video chip). Costs almost nothing. = Собственное сглаживание краёв N64 (её видеочип). Почти не нагружает.
N64 Dither Filter = Фильтр дизеринга N64
Smooth colours: the N64's filter hides the dots of its 16-bit colours. = Гладкие цвета: фильтр N64 скрывает точки её 16-битных цветов.
The dots stay: grainy skies, fog and shadows. = Точки остаются: зернистое небо, туман и тени.
The N64 drew its 16-bit colours with a pattern of dots; its video chip blended them away. = N64 рисовала 16-битные цвета узором из точек; её видеочип их сглаживал.
N64 2D Graphics = 2D-графика N64
Exact = Точная
Text, icons and 2D backgrounds as the N64 drew them: blocky, without seams. = Текст, значки и 2D-фоны, как их рисовала N64: пиксельные, без швов.
Smooth (HD) = Гладкая (HD)
Text, icons and 2D backgrounds at the N64 Resolution: smoother; some games show thin lines between their pieces. = Текст, значки и 2D-фоны в Разрешении N64: глаже; в некоторых играх видны тонкие линии между частями.
How the HUD, text and 2D pictures are drawn above Native resolution. = Как рисуются HUD, текст и 2D-картинки при разрешении выше родного.
N64 Distant Textures = Дальние текстуры N64
Sharp (HD) = Чёткие (HD)
Far textures as sharp as the N64 Resolution allows. = Дальние текстуры настолько чёткие, насколько позволяет Разрешение N64.
As the N64 = Как на N64
Far textures as blurry as on the N64: for the few games that swap textures with the distance. = Дальние текстуры такие же размытые, как на N64: для немногих игр, которые меняют текстуры с расстоянием.
The texture detail of far surfaces above Native resolution. = Детализация текстур дальних поверхностей при разрешении выше родного.
N64 Screen Effects = Экранные эффекты N64
Blurs, pause screens and photos made from the game's own picture, at the N64's size. = Размытие, экраны паузы и фото из изображения самой игры - в размере N64.
Smooth (SSAA) = Гладкие (SSAA)
Those effects made from the sharp picture: smoother; a few games glitch. = Эти эффекты из чёткого изображения: глаже; некоторые игры сбоят.
Effects some games make from their own picture (pause backgrounds, motion blur), above Native resolution. = Эффекты, которые некоторые игры делают из своего изображения (фоны паузы, размытие движения), при разрешении выше родного.
Four times (about Full HD): the sharpest; heavy games can slow down. = Вчетверо (почти Full HD): чётче всего; тяжёлые игры могут тормозить.
Sharper: SNES and NES redrawn at 3x (xBRZ); the N64 at 2x. = Чётче: SNES и NES перерисованы в 3x (xBRZ); N64 в 2x.
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 4x; heavy N64 games can slow down. = Чётче всего: SNES и NES в 6x (xBRZ), N64 в 4x; тяжёлые игры N64 могут тормозить.
# --- EmuSuNi 00.27: Ultra and the GPU's filters
Ultra (maximum) = Ультра (максимум)
The best each console can do: SNES and NES redrawn by the GPU with xBRZ and an AI network (Anime4K); the N64 at 4x with HD 2D, sharpened. Heavy N64 games can slow down. = Лучшее, на что способна каждая консоль: SNES и NES перерисовывает GPU с xBRZ и нейросетью (Anime4K); N64 в 4x с HD 2D и повышенной чёткостью. Тяжёлые игры N64 могут тормозить.
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = Сразу задаёт изображение под уровень: разрешение, масштабирование (CPU и GPU), размер изображения, а также размер, синхронизацию и 2D N64. Если изменить что-то из этого, станет Своё.
GPU Upscaler = Масштабирование GPU
The picture as Resolution and the Upscaling Filter make it. = Изображение таким, как его делают Разрешение и Фильтр масштабирования.
Pixel Art HD (xBRZ) = Pixel Art HD (xBRZ)
SNES and NES redrawn by the GPU at the TV's full resolution: rounded, clean edges without blur; frees the CPU. The N64 gets Smooth HD. = SNES и NES перерисовывает GPU в полном разрешении телевизора: скруглённые чистые края без размытия; разгружает CPU. N64 получает Гладкое HD.
AI (xBRZ + Anime4K) = ИИ (xBRZ + Anime4K)
xBRZ, then a neural network (Anime4K) cleans every edge and curve: the smoothest HD look for SNES and NES. The N64 gets Smooth HD. = xBRZ, затем нейросеть (Anime4K) очищает каждый край и изгиб: самый гладкий HD-вид для SNES и NES. N64 получает Гладкое HD.
Smooth HD (AMD FSR) = Гладкое HD (AMD FSR)
AMD FidelityFX Super Resolution: smooth upscaling with sharp edges, made for 3D (the N64 at Native and 2x; at 4x it sharpens). = AMD FidelityFX Super Resolution: плавное масштабирование с чёткими краями, создано для 3D (N64 в Родном и 2x; в 4x только повышает резкость).
HD Sharpen (AMD RCAS) = Резкость HD (AMD RCAS)
The picture as it is, made crisper by AMD's sharpening (RCAS): for the N64 at 4x and pictures already made bigger. = Изображение как есть, но чётче благодаря повышению резкости от AMD (RCAS): для N64 в 4x и уже увеличенных изображений.
Draws the picture with the GPU's filters at the TV's resolution. Pixel Art HD, AI and Smooth HD start from the console's own picture: Resolution and the Upscaling Filter are left out. = Рисует изображение фильтрами GPU в разрешении телевизора. Pixel Art HD, ИИ и Гладкое HD берут исходное изображение консоли: Разрешение и Фильтр масштабирования не используются.
N64 CPU Cores = Ядра CPU для N64
Fixed = Постоянные
Each N64 thread on a PS4 core of its own: the emulation on core 2, its graphics commands on core 3. = Каждый поток N64 на своём ядре PS4: эмуляция на ядре 2, её графические команды на ядре 3.
PS4's Choice = Выбор PS4
The PS4 moves the threads between its cores, as before 00.27. = PS4 перемещает потоки между своими ядрами, как до 00.27.
Which PS4 cores run an N64 game's threads. Fixed gives the emulation and its graphics thread a core each, so they run at the same time. = Какие ядра PS4 выполняют потоки игры N64. Постоянные дают эмуляции и её графическому потоку по своему ядру, чтобы они работали одновременно.
N64 Frame Pacing = Темп кадров N64
Even (V-Sync) = Равномерный (V-Sync)
Each refresh shows the frame the game should be at when the TV shows it: PAL's 50 frames come out even on the TV's 60, and a heavy frame doesn't make the next refresh jump two frames. = Каждое обновление показывает кадр, на котором игра должна быть в момент показа: 50 кадров PAL ровно ложатся на 60 телевизора, а тяжёлый кадр не заставляет следующее обновление перескочить на два кадра.
By the Clock = По часам
By the time each pass of the emulator took, as 00.27: it catches up with two frames in one refresh. = По времени каждого прохода эмулятора, как в 00.27: догоняет двумя кадрами за одно обновление.
How the N64's frames are spread over the TV's refreshes with V-Sync on. = Как кадры N64 распределяются по обновлениям телевизора при включённом V-Sync.
# --- EmuSuNi 00.28: the N64's picture one frame later
N64 Picture Timing = Вывод изображения N64
One Frame Later = На кадр позже
The graphics thread makes each picture while the N64 runs on: at 4x up to 3 ms less per frame; the picture is shown one frame (17-20 ms) later. = Графический поток делает каждое изображение, пока N64 работает дальше: в 4x до 3 мс меньше на кадр; изображение показывается на кадр (17-20 мс) позже.
At Once = Сразу
The N64 waits at every frame until its picture is made, as before. = N64 на каждом кадре ждёт, пока изображение будет готово, как раньше.
When the N64's picture is made: by the graphics thread one frame later (faster), or at once. = Когда создаётся изображение N64: графическим потоком на кадр позже (быстрее) или сразу.

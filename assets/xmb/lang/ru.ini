# --- EmuSuNi 00.30: GoldenEye 007 smoother
N64 CPU Timing = Темп CPU N64
Light for GoldenEye 007; Normal for the other games. = Лёгкий для GoldenEye 007; Обычный для остальных игр.
Normal = Обычный
The emulator's own timing: the most frames the game can draw. = Собственный темп эмулятора: столько кадров, сколько игра может нарисовать.
Light (as the N64) = Лёгкий (как на N64)
The N64's processor a little slower against its clock: a game that drew few frames on the console draws about as few, and the PS4 has much less to do (GoldenEye: about a third less). The game keeps its speed; loading takes longer. = Процессор N64 чуть медленнее относительно своей частоты: игра, которая рисовала мало кадров на консоли, рисует примерно столько же, а у PS4 намного меньше работы (GoldenEye: примерно на треть меньше). Скорость игры сохраняется; загрузки идут дольше.
How much the N64's processor does between two pictures. Light keeps heavy games (GoldenEye 007) smooth on the PS4. = Сколько работы делает процессор N64 между двумя изображениями. Лёгкий сохраняет плавность тяжёлых игр (GoldenEye 007) на PS4.

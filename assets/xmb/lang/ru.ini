Transparency Effects = Эффекты прозрачности
Colour math: water, shadows, fades. Off only to diagnose glitches. = Смешивание цветов: вода, тени, затемнения. Выключайте только для поиска ошибок.
Light Overclock = Лёгкий разгон
Max Overclock = Макс. разгон

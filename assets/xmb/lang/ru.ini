# --- EmuSuNi 01.23: online, back to the room after a match (Back to the Room; a guest who leaves or is removed no longer closes the host's room), Entry With Permission during a match too; the library's Players filter without 3 and 4
Back to the Room = Вернуться в комнату
Ends this match for every player: all back in the room (its chat, its players), where the host can start again. You stay in the room. = Завершает матч для всех игроков: все возвращаются в комнату (её чат, её игроки), где хост может начать снова. Вы остаётесь в комнате.
A player has an older EmuSuNi: the match can't go back to the room = У одного из игроков старая версия EmuSuNi: матч не может вернуться в комнату
The match ended: you watch the next one here = Матч окончен: следующий вы увидите здесь
Closes the room: the match ends for everyone. = Закрывает комнату: матч заканчивается для всех.
Leaves the room: the match ends, the others go back to the room. = Выход из комнаты: матч заканчивается, остальные возвращаются в комнату.
1 Player Only, 2 Players or More (at once), or Cooperative play. = Только 1 игрок, 2 игрока и больше (одновременно) или кооператив.
{} wants to join the match: open the menu to answer = {} хочет присоединиться к матчу: откройте меню, чтобы ответить
{} joins the match in a moment = {} сейчас присоединится к матчу
Lets this player into your room: they join the match under way (everyone stops a moment). = Впускает игрока в вашу комнату: он присоединится к идущему матчу (все на миг остановятся).
Removes this player from the room: they can't join it again. The match ends, the others back in the room (it stays open). = Исключает игрока из комнаты: он не сможет войти снова. Матч заканчивается, остальные возвращаются в комнату (она остаётся открытой).


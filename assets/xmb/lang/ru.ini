Which DualShock 4 button does what, for this console's games or only this one: back in the game they apply. = Какая кнопка DualShock 4 что делает - для игр этой консоли или только для этой игры: применяется по возвращении в игру.
Press a button... = Нажмите кнопку...
Controls for this game only = Управление только для этой игры
This game uses this console's controls = Эта игра использует управление этой консоли
Controls back to the default = Управление снова по умолчанию
Left / Right: which DualShock 4 controls move it. = Влево / Вправо: чем на DualShock 4 это двигать.
No button pressed: nothing changed = Кнопка не нажата: ничего не изменено
CONTROLS - THIS GAME = УПРАВЛЕНИЕ - ЭТА ИГРА
CONTROLS - ALL GAMES = УПРАВЛЕНИЕ - ВСЕ ИГРЫ
Speed while the Fast Forward button is held. Each console has its own button: see it in Controls. = Скорость, пока удерживается кнопка ускорения. У каждой консоли своя кнопка: смотрите в Управлении.
Speed while {} is held (change the button in Controls). = Скорость, пока удерживается {} (кнопку можно сменить в Управлении).
the touchpad = сенсорная панель
How fast the game runs while the Fast Forward button is held. No button does it on this console yet: choose one in Controls. = Как быстро идёт игра, пока удерживается кнопка ускорения. На этой консоли такой кнопки пока нет: выберите её в Управлении.
How fast the game runs while the Fast Forward button is held. No button does it in this game's own controls yet: choose one in Controls. = Как быстро идёт игра, пока удерживается кнопка ускорения. В собственном управлении этой игры такой кнопки пока нет: выберите её в Управлении.
Cross: press a new button. Left: none. Held, the game runs faster (how fast: Fast Forward in the game's settings). A button the console uses too does both. = Крест: нажмите новую кнопку. Влево: нет. При удержании игра идёт быстрее (насколько - Ускорение в настройках игры). Кнопка, которую использует и консоль, делает и то и другое.
Dreamcast: Standard quality only = Dreamcast: только качество Стандартное
NAOMI: Standard quality only = NAOMI: только качество Стандартное
Atomiswave: Standard quality only = Atomiswave: только качество Стандартное
3DS: no GPU filters yet = 3DS: пока без фильтров GPU
Your own choices (they match none of the four levels). = Ваши настройки (не совпадают ни с одним из четырёх уровней).
Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the 3DS at 1x), no upscaler and no filters. = Родное разрешение каждой консоли (N64, PlayStation, PSP, DS и 3DS в 1x), без масштабирования и фильтров.
Smooth Edges; the N64, the PlayStation, the PSP and the 3DS at 2x. = Гладкие края; N64, PlayStation, PSP и 3DS в 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP and the 3DS at 3x. = Естественное HD; N64 и PlayStation в 4x, PSP и 3DS в 3x.
Natural AI; the N64, the PlayStation and the PSP at 4x, the 3DS at 3x. = Естественный ИИ; N64, PlayStation и PSP в 4x, 3DS в 3x.
The picture in one choice: Low is the console's own; each level above is sharper and more work for the PS4. Changing one of its settings makes it Custom. = Изображение одним выбором: Низкое - как у самой консоли; каждый уровень выше чётче и тяжелее для PS4. Если изменить одну из его настроек, станет Своё.
The console's own resolution: its picture as it made it, made bigger for the TV, with no filters. = Родное разрешение консоли: её изображение как есть, увеличенное для телевизора, без фильтров.
Smooth Edges: the GPU smooths the jagged edges; the pixels stay as they are. = Гладкие края: GPU сглаживает зубчатые края; пиксели остаются как есть.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR). = Естественное HD: гладкие края, затем чёткое HD-изображение в разрешении телевизора (AMD FSR).
Natural AI: Natural HD with an AI network (Anime4K) that cleans every edge; the textures stay. = Естественный ИИ: Естественное HD с нейросетью (Anime4K), которая очищает каждый край; текстуры сохраняются.
The console's own resolution: both screens as the DS made them (256x192), with no filters. = Родное разрешение консоли: оба экрана как на DS (256x192), без фильтров.
Smooth Edges on both screens: the GPU smooths the jagged edges. = Гладкие края на обоих экранах: GPU сглаживает зубчатые края.
Natural HD on both screens: smooth edges, then a sharp HD picture (AMD FSR). = Естественное HD на обоих экранах: гладкие края, затем чёткое HD-изображение (AMD FSR).
Natural AI on both screens: Natural HD with an AI network (Anime4K) that cleans every edge. = Естественный ИИ на обоих экранах: Естественное HD с нейросетью (Anime4K), которая очищает каждый край.
The console's own resolution, with no filters: the lightest. The size changes at the next start. = Родное разрешение консоли без фильтров: легче всего. Размер меняется при следующем запуске.
2x (480p) with Smooth Edges. The size changes at the next start. = 2x (480p) с Гладкими краями. Размер меняется при следующем запуске.
4x (960p) with Natural HD. The size changes at the next start. = 4x (960p) с Естественным HD. Размер меняется при следующем запуске.
4x (960p) with Natural AI, and smooth HD text and icons. The size changes at the next start. = 4x (960p) с Естественным ИИ и гладкими HD-текстом и значками. Размер меняется при следующем запуске.
The console's own resolution (1x), its own textures and colours, with no filters. = Родное разрешение консоли (1x), её собственные текстуры и цвета, без фильтров.
2x (480p), smooth textures (xBR) and true colour, with Smooth Edges. = 2x (480p), гладкие текстуры (xBR) и истинный цвет, с Гладкими краями.
4x (960p), smooth textures, true colour and steady 3D (PGXP), with Natural HD. = 4x (960p), гладкие текстуры, истинный цвет и стабильное 3D (PGXP), с Естественным HD.
4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA) and Natural AI. = 4x (960p), гладкие текстуры, стабильное 3D, сглаживание 4x (MSAA) и Естественный ИИ.
The console's own resolution (480x272), with no filters. = Родное разрешение консоли (480x272), без фильтров.
2x (960x544), sharper textures far away, with Smooth Edges. = 2x (960x544), более чёткие текстуры вдали, с Гладкими краями.
3x (1440x816), the sharpest textures far away, with Natural HD. = 3x (1440x816), самые чёткие текстуры вдали, с Естественным HD.
4x (1920x1088, Full HD), the sharpest textures far away, made crisper (Natural HD). = 4x (1920x1088, Full HD), самые чёткие текстуры вдали, с дополнительной резкостью (Естественное HD).
The console's own resolution (400x240 and 320x240): the lightest. The size changes at the next start. = Родное разрешение консоли (400x240 и 320x240): легче всего. Размер меняется при следующем запуске.
2x (800x480): sharper 3D, more work for the GPU. The size changes at the next start. = 2x (800x480): чётче 3D, больше работы для GPU. Размер меняется при следующем запуске.
3x (1200x720): the sharpest, for the lighter games. The size changes at the next start. = 3x (1200x720): чётче всего, для более лёгких игр. Размер меняется при следующем запуске.
3x, as High: the most the 3DS has for now (no GPU filters for it yet). The size changes at the next start. = 3x, как Высокое: пока это максимум для 3DS (фильтров GPU для неё ещё нет). Размер меняется при следующем запуске.

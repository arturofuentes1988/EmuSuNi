Black space between the two screens, as the hinge left between them on the console (not with one screen only). = Чёрный промежуток между двумя экранами, как от шарнира на консоли (не при одном экране).

# --- EmuSuNi 00.81: the 3DS's graphics errors (Accurate Shader Multiplication and 3DS Right Eye, per game)
Accurate Shader Multiplication = Точное умножение в шейдерах
On in the games known to need it (the Pokémon games from X and Y to Ultra Sun and Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Off in the others. = Вкл. в играх, которым это точно нужно (Pokémon от X и Y до Ultra Sun и Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), выкл. в остальных.
Multiplies in the shaders exactly as the 3DS does: models, lights and effects drawn right. A little more work for the GPU. = Умножает в шейдерах точно как 3DS: модели, свет и эффекты рисуются правильно. Чуть больше работы для GPU.
The faster multiplication: most games look the same with it. = Более быстрое умножение: большинство игр с ним выглядят так же.
How the GPU's shaders multiply: exactly as the 3DS does, or faster. Without it a few games draw white, too bright or black models and effects. (Ocarina of Time 3D and the Mario & Luigi games always use it.) = Как умножают шейдеры GPU: точно как 3DS или быстрее. Без точного умножения некоторые игры рисуют белые, слишком яркие или чёрные модели и эффекты. (Ocarina of Time 3D и игры Mario & Luigi всегда его используют.)
3DS Right Eye = Правый глаз 3DS
Not drawn, but drawn in the games known to need it (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition). = Не рисуется, кроме игр, которым это точно нужно (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition).
Not Drawn (faster) = Не рисуется (быстрее)
The PS4 shows no 3D, so the right eye's picture is left out: less work in the games that draw both eyes. = PS4 не показывает 3D, поэтому изображение для правого глаза пропускается: меньше работы в играх, которые рисуют оба глаза.
Drawn = Рисуется
As on the 3DS: for a game whose screen stays black, freezes on an effect or is out of place. Slower in the games that draw both eyes. = Как на 3DS: для игры, у которой экран остаётся чёрным, зависает на эффекте или смещён. Медленнее в играх, которые рисуют оба глаза.
3DS games draw a second picture for the 3D effect, the right eye's, which the PS4 never shows. Leaving it out is faster (Super Mario 3D Land then draws half as much), but a few games show a black, frozen or misplaced screen. = Игры 3DS рисуют второе изображение для 3D-эффекта - для правого глаза, которое PS4 никогда не показывает. Без него быстрее (Super Mario 3D Land тогда рисует вдвое меньше), но некоторые игры показывают чёрный, застывший или смещённый экран.


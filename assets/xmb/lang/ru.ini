# --- EmuSuNi 00.85: fixes (the in-game menu's buttons pressed without the hold, Menu Size)
The right stick pressed: the menu opens at once. A game that uses R3 doesn't get it any more; on the DS and the 3DS, R3 then opens the menu instead of swapping the screens. = Нажатие правого стика сразу открывает меню. Игра, использующая R3, больше его не получает; на DS и 3DS R3 тогда открывает меню вместо смены экранов.
Both pressed together: the menu opens at once. One held and the other pressed later is the game's; a game that presses both at the same moment opens the menu. = Обе нажаты вместе - меню открывается сразу. Если одну удерживать, а другую нажать позже, это уходит в игру; если в игре обе нажимаются одновременно, откроется меню.
Both pressed together: the menu opens at once. One held and the other pressed later is the game's (a racing game's accelerator and brake); a game that presses both at the same moment opens the menu. = Обе нажаты вместе - меню открывается сразу. Если одну удерживать, а другую нажать позже, это уходит в игру (газ и тормоз в гонках); если в игре обе нажимаются одновременно, откроется меню.

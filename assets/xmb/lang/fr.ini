N64 CPU Cores = Cœurs CPU N64
Fixed = Fixes
Each N64 thread on a PS4 core of its own: the emulation on core 2, its graphics commands on core 3. = Chaque thread de la N64 sur son propre cœur de la PS4 : l'émulation sur le cœur 2, ses commandes graphiques sur le cœur 3.
PS4's Choice = Choix de la PS4
The PS4 moves the threads between its cores, as before 00.27. = La PS4 déplace les threads entre ses cœurs, comme avant la 00.27.
Which PS4 cores run an N64 game's threads. Fixed gives the emulation and its graphics thread a core each, so they run at the same time. = Quels cœurs de la PS4 exécutent les threads d'un jeu N64. Fixes donne un cœur à l'émulation et un autre à son thread graphique, pour qu'ils tournent en même temps.
N64 Frame Pacing = Cadence d'images N64
Even (V-Sync) = Régulière (V-Sync)
Each refresh shows the frame the game should be at when the TV shows it: PAL's 50 frames come out even on the TV's 60, and a heavy frame doesn't make the next refresh jump two frames. = Chaque rafraîchissement montre l'image où le jeu doit en être quand la TV l'affiche : les 50 images du PAL sortent régulières sur les 60 de la TV, et une image lourde ne fait pas sauter deux images au rafraîchissement suivant.
By the Clock = Selon l'horloge
By the time each pass of the emulator took, as 00.27: it catches up with two frames in one refresh. = Selon le temps qu'a pris chaque passe de l'émulateur, comme la 00.27 : il rattrape avec deux images en un rafraîchissement.

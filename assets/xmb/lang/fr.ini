# --- EmuSuNi 00.81: the 3DS's graphics errors (Accurate Shader Multiplication and 3DS Right Eye, per game)
Accurate Shader Multiplication = Multiplication exacte des shaders
On in the games known to need it (the Pokémon games from X and Y to Ultra Sun and Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Off in the others. = Activée dans les jeux connus pour en avoir besoin (les Pokémon de X et Y jusqu'à Ultra-Soleil et Ultra-Lune, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), désactivée dans les autres.
Multiplies in the shaders exactly as the 3DS does: models, lights and effects drawn right. A little more work for the GPU. = Multiplie dans les shaders exactement comme la 3DS : modèles, lumières et effets bien dessinés. Un peu plus de travail pour le GPU.
The faster multiplication: most games look the same with it. = La multiplication plus rapide : la plupart des jeux ont le même rendu avec elle.
How the GPU's shaders multiply: exactly as the 3DS does, or faster. Without it a few games draw white, too bright or black models and effects. (Ocarina of Time 3D and the Mario & Luigi games always use it.) = Comment les shaders du GPU multiplient : exactement comme la 3DS, ou plus vite. Sans elle, quelques jeux dessinent des modèles et des effets blancs, trop lumineux ou noirs. (Ocarina of Time 3D et les jeux Mario & Luigi l'utilisent toujours.)
3DS Right Eye = Œil droit de la 3DS
Not drawn, but drawn in the games known to need it (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition). = Non dessiné, sauf dans les jeux connus pour en avoir besoin (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Méga Donjon Mystère, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition).
Not Drawn (faster) = Non dessiné (plus rapide)
The PS4 shows no 3D, so the right eye's picture is left out: less work in the games that draw both eyes. = La PS4 n'affiche pas la 3D, donc l'image de l'œil droit est omise : moins de travail dans les jeux qui dessinent les deux yeux.
Drawn = Dessiné
As on the 3DS: for a game whose screen stays black, freezes on an effect or is out of place. Slower in the games that draw both eyes. = Comme sur la 3DS : pour un jeu dont l'écran reste noir, se fige sur un effet ou est décalé. Plus lent dans les jeux qui dessinent les deux yeux.
3DS games draw a second picture for the 3D effect, the right eye's, which the PS4 never shows. Leaving it out is faster (Super Mario 3D Land then draws half as much), but a few games show a black, frozen or misplaced screen. = Les jeux 3DS dessinent une seconde image pour l'effet 3D, celle de l'œil droit, que la PS4 n'affiche jamais. L'omettre est plus rapide (Super Mario 3D Land dessine alors moitié moins), mais quelques jeux affichent un écran noir, figé ou décalé.


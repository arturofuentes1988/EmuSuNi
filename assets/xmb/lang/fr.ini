# --- EmuSuNi 00.89: macros (several buttons in one) and the statistics' notice
Several buttons in one (fighting games). Cross: press the macro's button, then hold together the buttons it presses and let them go. Left: none. Its button stops doing what it did. = Plusieurs boutons en un (jeux de combat). Croix : appuyez sur le bouton de la macro, puis maintenez ensemble les boutons qu'elle presse et relâchez-les. Gauche : aucun. Son bouton cesse de faire ce qu'il faisait.
Now hold together the buttons it presses, then let them go...  (5 s: cancel) = Maintenez maintenant ensemble les boutons qu'elle presse, puis relâchez-les...  (5 s : annuler)
Hold its buttons... = Maintenez ses boutons...
EmuSuNi sends anonymous statistics: how many use it and from which countries, its version, the PS4's language, the console and the game played (a checksum or a disc's code, never a file's name). = EmuSuNi envoie des statistiques anonymes : combien l'utilisent et depuis quels pays, sa version, la langue de la PS4, la console et le jeu joué (une somme de contrôle ou le code d'un disque, jamais un nom de fichier).
Never sent: names, PSN, your list of games, your files. The server keeps no address. = Jamais envoyés : noms, PSN, votre liste de jeux, vos fichiers. Le serveur ne garde aucune adresse.
Off, nothing at all is sent. Change it any time: Settings -> Anonymous Statistics. = Désactivées, rien du tout n'est envoyé. Modifiable à tout moment : Paramètres -> Statistiques anonymes.
Turn Them Off = Les désactiver
They stay as they are. They show which consoles and games to improve first. = Elles restent telles quelles. Elles montrent quelles consoles et quels jeux améliorer en premier.
Nothing is sent. Online play still works; the online profile needs them. = Rien n'est envoyé. Le jeu en ligne fonctionne toujours ; le profil en ligne en a besoin.

# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = Règle d'un coup l'image pour un niveau : résolution, agrandissement (CPU et GPU), taille de l'image, et taille, synchro et 2D de la N64. En changer un la fait passer en Personnalisée. Le jeu montre le changement tout de suite, mais la taille et la synchro de la N64 changent au prochain lancement d'un jeu. La Dreamcast joue toujours en Basse (la PS4 ne peut pas encore faire mieux).
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = Lisse les bords crénelés de la 3D (multiéchantillonnage, sur le GPU). Si vous le changez en cours de jeu, sa 3D est reconfigurée : il peut saccader quelques secondes.

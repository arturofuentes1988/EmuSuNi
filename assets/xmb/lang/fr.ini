# --- EmuSuNi 00.91: Send Log (the logs to EmuSuNi's server)
Send Log = Envoyer le journal
Log Sent = Journal envoyé
Send = Envoyer
Try Again = Réessayer
Nothing is sent. = Rien n'est envoyé.
EmuSuNi's log goes to its creator, to find what went wrong: what the app did this time and the time before (games started, settings, errors), how it closed (crash.log) and its version. = Le journal d'EmuSuNi part chez son créateur pour trouver ce qui n'a pas marché : ce que l'appli a fait cette fois et la précédente (jeux lancés, paramètres, erreurs), comment elle s'est fermée (crash.log) et sa version.
Not sent: your games, saves or other files. Your nickname and user names are taken out; the server keeps only the country, never your address, and deletes the log after 90 days. = Non envoyés : vos jeux, sauvegardes ou autres fichiers. Votre pseudo et vos noms d'utilisateur sont retirés ; le serveur ne garde que le pays, jamais votre adresse, et supprime le journal après 90 jours.
You get a code: write it in your report on GitHub (Issues) or Telegram. = Vous recevez un code : écrivez-le dans votre signalement sur GitHub (Issues) ou Telegram.
Sends the log now (a few seconds). = Envoie le journal maintenant (quelques secondes).
Sending the log to EmuSuNi's server... = Envoi du journal au serveur d'EmuSuNi...
This is its code: write it in your report on GitHub (Issues) or Telegram, with what happened. = Voici son code : écrivez-le dans votre signalement sur GitHub (Issues) ou Telegram, avec ce qui s'est passé.
Closes this. Settings -> Send Log sends a new one. = Ferme ceci. Paramètres -> Envoyer le journal en envoie un nouveau.
Sends the log again. = Renvoie le journal.
EmuSuNi Closed = EmuSuNi s'est fermé
EmuSuNi closed by itself last time. = EmuSuNi s'est fermé tout seul la dernière fois.
Send its log to its creator, to find why? It has what the app did, how it closed and its version. Your nickname and user names are taken out; the server keeps only the country, never your address, for 90 days. = Envoyer son journal à son créateur pour trouver pourquoi ? Il contient ce que l'appli a fait, comment elle s'est fermée et sa version. Votre pseudo et vos noms d'utilisateur sont retirés ; le serveur ne garde que le pays, jamais votre adresse, pendant 90 jours.
Yes, Send It = Oui, l'envoyer
Sends it now: you get a code to write in a report on GitHub or Telegram. = L'envoie maintenant : vous recevez un code à écrire dans un signalement sur GitHub ou Telegram.

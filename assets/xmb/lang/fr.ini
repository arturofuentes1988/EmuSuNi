# --- EmuSuNi 00.70: the 3DS CPU Clock's texts (a lower clock seldom saves the PS4 any work)
The game sees a slower 3DS. Less work for the PS4 only in a game that keeps the processor busy without a break; most wait for their next picture and cost the same. = Le jeu voit une 3DS plus lente. Moins de travail pour la PS4 seulement dans un jeu qui occupe le processeur sans pause ; la plupart attendent leur image suivante et coûtent autant.
The game sees a 3DS at half speed: a game that needs the speed slows down or stutters. = Le jeu voit une 3DS à mi-vitesse : un jeu qui a besoin de la vitesse ralentit ou saccade.
How fast the emulated 3DS's processor runs. Most games wait for their next picture, so a lower clock seldom saves the PS4 any work (none in the games tried); a game that needs the speed slows down or freezes. = La vitesse du processeur de la 3DS émulée. La plupart des jeux attendent leur image suivante, donc une horloge plus basse fait rarement gagner du travail à la PS4 (aucun gain dans les jeux essayés) ; un jeu qui a besoin de la vitesse ralentit ou se fige.

# --- EmuSuNi 00.71: the 3DS's Quality levels (3DS Resolution 1x to 4x on its pages, the GPU Upscaler's steps)
Each console's own resolution (the N64, the PlayStation, the PSP, the DS, the 3DS and the Dreamcast at 1x), no upscaler and no filters. = La résolution d'origine de chaque console (la N64, la PlayStation, la PSP, la DS, la 3DS et la Dreamcast en 1x), sans agrandissement ni filtres.
Smooth Edges; the N64, the PlayStation, the PSP, the 3DS and the Dreamcast at 2x. = Bords lisses ; la N64, la PlayStation, la PSP, la 3DS et la Dreamcast en 2x.
Pixel Art HD (the 3D consoles: Smooth Edges); the N64 at 4x, the PlayStation, the PSP, the 3DS and the Dreamcast at 3x. = Pixel Art HD (les consoles 3D : Bords lisses) ; la N64 en 4x, la PlayStation, la PSP, la 3DS et la Dreamcast en 3x.
AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation, the PSP and the 3DS at 4x, the Dreamcast at 3x with the sharpest textures. = IA (les consoles 3D : plus nettes, HD naturelle) ; la N64, la PlayStation, la PSP et la 3DS en 4x, la Dreamcast en 3x avec les textures les plus nettes.
Twice the size (800x480): sharper 3D. = Deux fois la taille (800x480) : 3D plus nette.
Three times (1200x720): sharper 3D still. = Trois fois (1200x720) : 3D encore plus nette.
Four times (1600x960, about Full HD): the sharpest 3D. = Quatre fois (1600x960, presque Full HD) : la 3D la plus nette.
The size the GPU draws 3DS games at: real HD 3D, not an enlarged picture. A bigger size is more work for the GPU only, but a game that reads its picture back (a few do, for effects) waits for it and can slow down. = La taille à laquelle le GPU dessine les jeux 3DS : une vraie 3D en HD, pas une image agrandie. Une taille plus grande ne donne du travail qu'au GPU, mais un jeu qui relit son image (quelques-uns le font, pour des effets) l'attend et peut ralentir.
The console's own resolution (400x240 and 320x240), with no filters: the lightest. The size changes at the next start. = La résolution d'origine de la console (400x240 et 320x240), sans filtres : le plus léger. La taille change au prochain lancement.
2x (800x480) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 2x (800x480) avec Bords lisses. La taille change au prochain lancement ; un jeu qui relit son image peut ralentir.
3x (1200x720) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 3x (1200x720) avec Bords lisses. La taille change au prochain lancement ; un jeu qui relit son image peut ralentir.
4x (1600x960), made crisper by AMD's sharpening (Natural HD). The size changes at the next start; a game that reads its picture back can slow down. = 4x (1600x960), rendue plus nette par l'accentuation d'AMD (HD naturelle). La taille change au prochain lancement ; un jeu qui relit son image peut ralentir.

# --- EmuSuNi 00.72: the N64 (Ogre Battle 64 plays with N64 Graphics Sync Accurate too)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA, Resident Evil 2 and Ogre Battle 64 play Accurate anyway (with Fast the first two stay on a black screen and Ogre Battle's backgrounds break). = Le GPU dessine pendant que la N64 tourne : beaucoup plus fluide sur la PS4. Cruis'n USA, Resident Evil 2 et Ogre Battle 64 jouent en Précise de toute façon (en Rapide, les deux premiers restent sur un écran noir et les fonds d'Ogre Battle se cassent).


AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation and the PSP at 4x, the Dreamcast at 3x with the sharpest textures. = IA (les consoles 3D : plus nettes, HD naturelle) ; la N64, la PlayStation et la PSP en 4x, la Dreamcast en 3x avec les textures les plus nettes.
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. = Bords lisses, puis dessiné en HD à la résolution de la TV et rendu plus net (AMD FSR) : nettement plus net, toujours naturel, jamais peint.
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. = Les bords propres de HD naturelle avec un réseau d'IA (Anime4K) mélangé à l'image, pour garder textures et tramage : l'aspect le plus lisse sans effet cireux.
Pixel art redrawn by the GPU at the TV's resolution: rounded, clean edges without blur. Quality High uses it; a 3D picture drawn by the GPU gets Smooth Edges. = Le pixel art redessiné par le GPU à la résolution de la TV : bords arrondis et propres, sans flou. Utilisé par la qualité Haute ; une image 3D dessinée par le GPU reçoit Bords lisses.
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest HD look for pixel art. Quality Ultra uses it; a 3D picture drawn by the GPU gets Natural HD (the network would only make it smaller). = xBRZ, puis un réseau neuronal (Anime4K) à pleine puissance nettoie chaque bord et chaque courbe : la HD la plus lisse pour le pixel art. Utilisé par la qualité Ultra ; une image 3D dessinée par le GPU reçoit HD naturelle (le réseau ne ferait que la réduire).
Pixel Art HD: the GPU redraws the pixels as clean HD shapes at the TV's resolution (xBRZ). = Pixel Art HD : le GPU redessine les pixels en formes HD propres à la résolution de la TV (xBRZ).
AI: Pixel Art HD, then an AI network (Anime4K) smooths every edge and curve: the smoothest HD. = IA : Pixel Art HD, puis un réseau d'IA (Anime4K) lisse chaque bord et chaque courbe : la HD la plus lisse.
Pixel Art HD on both screens: redrawn as clean HD shapes at the TV's resolution (xBRZ). = Pixel Art HD sur les deux écrans : redessinés en formes HD propres à la résolution de la TV (xBRZ).
AI on both screens: Pixel Art HD, then an AI network (Anime4K) smooths every edge: the smoothest HD. = IA sur les deux écrans : Pixel Art HD, puis un réseau d'IA (Anime4K) lisse chaque bord : la HD la plus lisse.
4x (960p) with Smooth Edges. The size changes at the next start. = 4x (960p) avec Bords lisses. La taille change au prochain lancement.
4x (960p), made crisper by AMD's sharpening (Natural HD). The size changes at the next start. = 4x (960p), rendue plus nette par l'accentuation d'AMD (HD naturelle). La taille change au prochain lancement.
3x (720p), smooth textures, true colour and steady 3D (PGXP), with Smooth Edges. = 3x (720p), textures lisses, vraies couleurs et 3D stable (PGXP), avec Bords lisses.
4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA), made crisper (Natural HD). = 4x (960p), textures lisses, 3D stable, anticrénelage 4x (MSAA), rendue plus nette (HD naturelle).
3x (1440x816), the sharpest textures far away, with Smooth Edges. = 3x (1440x816), les textures les plus nettes au loin, avec Bords lisses.
2x (1280x960), textures 8x sharp far away, with Smooth Edges. The size changes at the next start. = 2x (1280x960), textures lointaines nettes en 8x, avec Bords lisses. La taille change au prochain lancement.
3x (1920x1440, made smaller for the TV), textures 8x sharp far away, with Smooth Edges. The size changes at the next start. = 3x (1920x1440, réduite pour la TV), textures lointaines nettes en 8x, avec Bords lisses. La taille change au prochain lancement.
3x (1920x1440), the sharpest textures far away (16x), made crisper (Natural HD). The size changes at the next start. = 3x (1920x1440), les textures lointaines les plus nettes (16x), rendue plus nette (HD naturelle). La taille change au prochain lancement.


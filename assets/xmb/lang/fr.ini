Copy them, under any names, to Roms/psvita (or its firmware folder) on the USB drive, or to {} on the PS4. = Copiez-les, sous n'importe quel nom, dans Roms/psvita (ou son dossier firmware) sur la clé USB, ou dans {} sur la PS4.

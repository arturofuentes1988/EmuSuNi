Not copied: your RetroAchievements login, online profile and statistics. BIOS files neither: put yours in EmuSuNi-Portable/system on the drive. = Non copiés : votre connexion RetroAchievements, votre profil en ligne et vos statistiques. Les fichiers BIOS non plus : mettez les vôtres dans EmuSuNi-Portable/system sur la clé.

# --- EmuSuNi 00.27: Ultra and the GPU's filters
Ultra (maximum) = Ultra (maximale)
The best each console can do: SNES and NES redrawn by the GPU with xBRZ and an AI network (Anime4K); the N64 at 4x with HD 2D, sharpened. Heavy N64 games can slow down. = Le meilleur de chaque console : SNES et NES redessinées par le GPU avec xBRZ et un réseau d'IA (Anime4K) ; la N64 en 4x avec 2D en HD, plus nette. Les jeux N64 lourds peuvent ralentir.
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = Règle d'un coup l'image pour un niveau : résolution, agrandissement (CPU et GPU), taille de l'image, et taille, synchro et 2D de la N64. En changer un la fait passer en Personnalisée.
GPU Upscaler = Agrandissement GPU
The picture as Resolution and the Upscaling Filter make it. = L'image telle que la font Résolution et le Filtre d'agrandissement.
Pixel Art HD (xBRZ) = Pixel Art HD (xBRZ)
SNES and NES redrawn by the GPU at the TV's full resolution: rounded, clean edges without blur; frees the CPU. The N64 gets Smooth HD. = SNES et NES redessinées par le GPU à la pleine résolution de la TV : bords arrondis et propres, sans flou ; libère le CPU. La N64 utilise HD lisse.
AI (xBRZ + Anime4K) = IA (xBRZ puis Anime4K)
xBRZ, then a neural network (Anime4K) cleans every edge and curve: the smoothest HD look for SNES and NES. The N64 gets Smooth HD. = xBRZ, puis un réseau neuronal (Anime4K) nettoie chaque bord et chaque courbe : l'aspect HD le plus lisse pour SNES et NES. La N64 utilise HD lisse.
Smooth HD (AMD FSR) = HD lisse (AMD FSR)
AMD FidelityFX Super Resolution: smooth upscaling with sharp edges, made for 3D (the N64 at Native and 2x; at 4x it sharpens). = AMD FidelityFX Super Resolution : agrandissement lisse aux bords nets, conçu pour la 3D (la N64 en Native et 2x ; en 4x il accentue seulement la netteté).
HD Sharpen (AMD RCAS) = Netteté HD (AMD RCAS)
The picture as it is, made crisper by AMD's sharpening (RCAS): for the N64 at 4x and pictures already made bigger. = L'image telle quelle, rendue plus nette par l'accentuation d'AMD (RCAS) : pour la N64 en 4x et les images déjà agrandies.

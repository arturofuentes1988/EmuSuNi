# --- EmuSuNi 00.40: the GPU Upscaler's steps (Smooth Edges, Natural HD, Natural AI)
Smooth Edges: the GPU smooths the jagged edges and leaves the pixels and textures as they are; the N64, the PlayStation and the PSP at 2x. = Bords lisses : le GPU lisse les bords crénelés et laisse les pixels et les textures tels quels ; la N64, la PlayStation et la PSP en 2x.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR) that still looks natural; the N64 and the PlayStation at 4x, the PSP at 3x. Heavy N64 games can slow down. = HD naturelle : bords lisses, puis une image HD nette à la résolution de la TV (AMD FSR) qui reste naturelle ; la N64 et la PlayStation en 4x, la PSP en 3x. Les jeux N64 lourds peuvent ralentir.
The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP in Full HD with anti-aliasing. Heavy N64 games can slow down. = Le meilleur de chaque console : IA naturelle, un réseau d'IA (Anime4K) qui nettoie chaque bord et garde les textures (sans aspect cireux) ; la N64 en 4x avec 2D en HD ; la PlayStation en 4x avec textures lisses, 3D stable et anticrénelage ; la PSP en Full HD avec anticrénelage. Les jeux N64 lourds peuvent ralentir.
Smooth Edges = Bords lisses
Only the jagged edges are smoothed (anti-aliasing: MMPX and SMAA); colours, textures and the pixels' shapes stay as they are. Light on the GPU. Quality Medium uses it. = Seuls les bords crénelés sont lissés (anticrénelage : MMPX et SMAA) ; couleurs, textures et forme des pixels restent tels quels. Léger pour le GPU. Utilisé par la qualité Moyenne.
Natural HD = HD naturelle
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. Quality High uses it. = Bords lisses, puis dessiné en HD à la résolution de la TV et rendu plus net (AMD FSR) : nettement plus net, toujours naturel, jamais peint. Utilisé par la qualité Haute.
Natural AI = IA naturelle
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. Quality Ultra uses it. = Les bords propres de HD naturelle avec un réseau d'IA (Anime4K) mélangé à l'image, pour garder textures et tramage : l'aspect le plus lisse sans effet cireux. Utilisé par la qualité Ultra.
AI (Anime4K) = IA (Anime4K)
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest, most painted HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ, puis un réseau neuronal (Anime4K) à pleine puissance nettoie chaque bord et chaque courbe : l'aspect HD le plus lisse et le plus peint pour SNES, NES et les Game Boy. La N64 utilise HD lisse.
Draws the picture with the GPU's filters at the TV's resolution. Every filter but HD Sharpen starts from the console's own picture: Resolution and the Upscaling Filter are left out. = Dessine l'image avec les filtres du GPU à la résolution de la TV. Tous les filtres sauf Netteté HD partent de l'image d'origine de la console : Résolution et le Filtre d'agrandissement ne servent pas.

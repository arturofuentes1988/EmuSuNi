# --- EmuSuNi 00.21: the N64's speed
N64 Graphics Sync = Synchro graphique N64
Fast (asynchronous) = Rapide (asynchrone)
The GPU draws while the N64 runs: much smoother on the PS4. = Le GPU dessine pendant que la N64 tourne : beaucoup plus fluide sur la PS4.
Accurate (synchronous) = Précise (synchrone)

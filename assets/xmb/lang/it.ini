# --- EmuSuNi 00.81: the 3DS's graphics errors (Accurate Shader Multiplication and 3DS Right Eye, per game)
Accurate Shader Multiplication = Moltiplicazione shader precisa
On in the games known to need it (the Pokémon games from X and Y to Ultra Sun and Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Off in the others. = Attiva nei giochi che notoriamente ne hanno bisogno (i Pokémon da X e Y fino a Ultrasole e Ultraluna, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), disattivata negli altri.
Multiplies in the shaders exactly as the 3DS does: models, lights and effects drawn right. A little more work for the GPU. = Moltiplica negli shader esattamente come il 3DS: modelli, luci ed effetti disegnati bene. Un po' più di lavoro per la GPU.
The faster multiplication: most games look the same with it. = La moltiplicazione più veloce: con essa la maggior parte dei giochi appare uguale.
How the GPU's shaders multiply: exactly as the 3DS does, or faster. Without it a few games draw white, too bright or black models and effects. (Ocarina of Time 3D and the Mario & Luigi games always use it.) = Come moltiplicano gli shader della GPU: esattamente come il 3DS, o più in fretta. Senza, alcuni giochi disegnano modelli ed effetti bianchi, troppo luminosi o neri. (Ocarina of Time 3D e i giochi di Mario & Luigi la usano sempre.)
3DS Right Eye = Occhio destro del 3DS
Not drawn, but drawn in the games known to need it (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition). = Non disegnato, tranne nei giochi che notoriamente ne hanno bisogno (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition).
Not Drawn (faster) = Non disegnato (più veloce)
The PS4 shows no 3D, so the right eye's picture is left out: less work in the games that draw both eyes. = La PS4 non mostra il 3D, quindi l'immagine dell'occhio destro viene omessa: meno lavoro nei giochi che disegnano entrambi gli occhi.
Drawn = Disegnato
As on the 3DS: for a game whose screen stays black, freezes on an effect or is out of place. Slower in the games that draw both eyes. = Come sul 3DS: per un gioco il cui schermo resta nero, si blocca su un effetto o è fuori posto. Più lento nei giochi che disegnano entrambi gli occhi.
3DS games draw a second picture for the 3D effect, the right eye's, which the PS4 never shows. Leaving it out is faster (Super Mario 3D Land then draws half as much), but a few games show a black, frozen or misplaced screen. = I giochi 3DS disegnano una seconda immagine per l'effetto 3D, quella dell'occhio destro, che la PS4 non mostra mai. Ometterla è più veloce (Super Mario 3D Land disegna così la metà), ma alcuni giochi mostrano uno schermo nero, bloccato o fuori posto.


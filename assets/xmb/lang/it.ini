# --- EmuSuNi 00.91: Send Log (the logs to EmuSuNi's server)
Send Log = Invia registro
Log Sent = Registro inviato
Send = Invia
Try Again = Riprova
Nothing is sent. = Non si invia nulla.
EmuSuNi's log goes to its creator, to find what went wrong: what the app did this time and the time before (games started, settings, errors), how it closed (crash.log) and its version. = Il registro di EmuSuNi va al suo creatore, per trovare cosa non ha funzionato: cosa ha fatto l'app questa volta e quella precedente (giochi avviati, impostazioni, errori), come si è chiusa (crash.log) e la sua versione.
Not sent: your games, saves or other files. Your nickname and user names are taken out; the server keeps only the country, never your address, and deletes the log after 90 days. = Non vengono inviati: i tuoi giochi, salvataggi o altri file. Il tuo nickname e i nomi utente vengono tolti; il server tiene solo il paese, mai il tuo indirizzo, ed elimina il registro dopo 90 giorni.
You get a code: write it in your report on GitHub (Issues) or Telegram. = Riceverai un codice: scrivilo nella tua segnalazione su GitHub (Issues) o Telegram.
Sends the log now (a few seconds). = Invia il registro ora (pochi secondi).
Sending the log to EmuSuNi's server... = Invio del registro al server di EmuSuNi...
This is its code: write it in your report on GitHub (Issues) or Telegram, with what happened. = Questo è il suo codice: scrivilo nella tua segnalazione su GitHub (Issues) o Telegram, con ciò che è successo.
Closes this. Settings -> Send Log sends a new one. = Chiude questo. Impostazioni -> Invia registro ne invia uno nuovo.
Sends the log again. = Invia di nuovo il registro.
EmuSuNi Closed = EmuSuNi si è chiuso
EmuSuNi closed by itself last time. = L'ultima volta EmuSuNi si è chiuso da solo.
Send its log to its creator, to find why? It has what the app did, how it closed and its version. Your nickname and user names are taken out; the server keeps only the country, never your address, for 90 days. = Inviare il suo registro al creatore, per scoprire il perché? Contiene cosa ha fatto l'app, come si è chiusa e la sua versione. Il tuo nickname e i nomi utente vengono tolti; il server tiene solo il paese, mai il tuo indirizzo, per 90 giorni.
Yes, Send It = Sì, invialo
Sends it now: you get a code to write in a report on GitHub or Telegram. = Lo invia ora: riceverai un codice da scrivere in una segnalazione su GitHub o Telegram.
Nothing is sent. Settings -> Send Log can send it later. = Non si invia nulla. Impostazioni -> Invia registro può inviarlo più tardi.

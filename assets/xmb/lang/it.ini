Both pressed together: the menu opens at once. One held and the other pressed later is the game's; a game that presses both at the same moment opens the menu. = Entrambi premuti insieme: il menu si apre subito. Se ne tieni premuto uno e premi l'altro dopo, va al gioco; un gioco che li preme entrambi nello stesso momento apre il menu.
Both pressed together: the menu opens at once. One held and the other pressed later is the game's (a racing game's accelerator and brake); a game that presses both at the same moment opens the menu. = Entrambi premuti insieme: il menu si apre subito. Se ne tieni premuto uno e premi l'altro dopo, va al gioco (acceleratore e freno di un gioco di corse); un gioco che li preme entrambi nello stesso momento apre il menu.
Menu Size = Dimensione menu
The usual size. = La dimensione abituale.
A little smaller: a few more games in view. = Un po' più piccolo: qualche gioco in più in vista.
Smaller: more games in view. = Più piccolo: più giochi in vista.
The smallest: the most games in view (the Library's row: about 11 covers instead of 7). = Il più piccolo: il maggior numero di giochi in vista (la fila della Libreria: circa 11 copertine invece di 7).
How big the games are drawn in the menu (the XMB's list, the Library's covers): smaller shows more of them at once. = Quanto grandi vengono disegnati i giochi nel menu (la lista dell'XMB, le copertine della Libreria): più piccolo ne mostra di più alla volta.
Smaller games in the menu: = Giochi più piccoli nel menu:
more of them on the screen at once, = più giochi sullo schermo alla volta,
in the XMB's list and the = nella lista dell'XMB e nella
Library's row of covers. = fila di copertine della Libreria.
It changes at once. = Cambia subito.
No picture = Nessuna immagine


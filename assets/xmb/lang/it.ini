Medium (balanced) = Media (equilibrata)
Sharper: SNES and NES redrawn at 3x (xBRZ); the N64 at its own size. = Più nitida: SNES e NES ridisegnati a 3x (xBRZ); l'N64 alla sua dimensione.
High (sharpest) = Alta (la più nitida)
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 2x; heavy N64 games can slow down. = La più nitida: SNES e NES a 6x (xBRZ), l'N64 a 2x; i giochi N64 pesanti possono rallentare.
Sets the picture for a level at once: resolution, upscaling, picture size, and the N64's size and sync. Changing one of them makes it Custom. = Imposta in un colpo l'immagine per un livello: risoluzione, upscaling, dimensione dell'immagine, e dimensione e sincronia dell'N64. Se ne cambi uno, diventa Personalizzata.

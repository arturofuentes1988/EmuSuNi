Both held for a second; the game sees them meanwhile (on the DS and the 3DS, its L and R). It can clash with a game that holds both together. = Entrambi tenuti premuti per un secondo; il gioco li riceve nel frattempo (sul DS e sul 3DS, i suoi L e R). Può creare conflitto con un gioco che li tiene premuti insieme.
Both held for a second; the game sees them meanwhile. It can clash with a game that holds both together (a racing game's L2 and R2), or with R2's Fast Forward. = Entrambi tenuti premuti per un secondo; il gioco li riceve nel frattempo. Può creare conflitto con un gioco che li tiene premuti insieme (L2 e R2 di un gioco di corse) o con l'Avanti veloce su R2.
Charcoal black with the round lid, the pad's round D-pad and its six buttons. = Nero antracite con il coperchio rotondo, la croce direzionale rotonda del pad e i suoi sei tasti.
Your own 1920x1080 PNG, see-through where the game goes: /data/EmuSuNi/bezels/saturn/ with the game's name, or bezels/saturn.png for every game. = Il tuo PNG 1920x1080, trasparente dove va il gioco: /data/EmuSuNi/bezels/saturn/ con il nome del gioco, o bezels/saturn.png per tutti i giochi.
High (HD) = Alta (HD)
Pixel Art HD (the 3D consoles: Smooth Edges); the N64 at 4x, the PlayStation, the PSP and the Dreamcast at 3x. = Pixel Art HD (le console 3D: Bordi morbidi); l'N64 a 4x, la PlayStation, la PSP e il Dreamcast a 3x.
AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation and the PSP at 4x, the Dreamcast at 3x with the sharpest textures. = IA (le console 3D: più nitidezza, HD naturale); l'N64, la PlayStation e la PSP a 4x, il Dreamcast a 3x con le texture più nitide.
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. = Bordi morbidi, poi disegnata in HD alla risoluzione della TV e resa più nitida (AMD FSR): chiaramente più nitida, sempre naturale, mai dipinta.
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. = I bordi puliti di HD naturale con una rete di IA (Anime4K) mescolata all'immagine, così texture e dithering restano: l'aspetto più morbido senza effetto cera.
Pixel art redrawn by the GPU at the TV's resolution: rounded, clean edges without blur. Quality High uses it; a 3D picture drawn by the GPU gets Smooth Edges. = La pixel art ridisegnata dalla GPU alla risoluzione della TV: bordi arrotondati e puliti, senza sfocatura. Lo usa la qualità Alta; un'immagine 3D disegnata dalla GPU usa Bordi morbidi.
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest HD look for pixel art. Quality Ultra uses it; a 3D picture drawn by the GPU gets Natural HD (the network would only make it smaller). = xBRZ, poi una rete neurale (Anime4K) a piena potenza pulisce ogni bordo e curva: l'HD più morbido per la pixel art. Lo usa la qualità Ultra; un'immagine 3D disegnata dalla GPU usa HD naturale (la rete la rimpicciolirebbe soltanto).
Pixel Art HD: the GPU redraws the pixels as clean HD shapes at the TV's resolution (xBRZ). = Pixel Art HD: la GPU ridisegna i pixel come forme HD pulite alla risoluzione della TV (xBRZ).
AI: Pixel Art HD, then an AI network (Anime4K) smooths every edge and curve: the smoothest HD. = IA: Pixel Art HD, poi una rete di IA (Anime4K) ammorbidisce ogni bordo e curva: l'HD più morbido.
Pixel Art HD on both screens: redrawn as clean HD shapes at the TV's resolution (xBRZ). = Pixel Art HD su entrambi gli schermi: ridisegnati come forme HD pulite alla risoluzione della TV (xBRZ).
AI on both screens: Pixel Art HD, then an AI network (Anime4K) smooths every edge: the smoothest HD. = IA su entrambi gli schermi: Pixel Art HD, poi una rete di IA (Anime4K) ammorbidisce ogni bordo: l'HD più morbido.
4x (960p) with Smooth Edges. The size changes at the next start. = 4x (960p) con Bordi morbidi. La dimensione cambia al prossimo avvio.
4x (960p), made crisper by AMD's sharpening (Natural HD). The size changes at the next start. = 4x (960p), resa più definita dal filtro di nitidezza AMD (HD naturale). La dimensione cambia al prossimo avvio.
3x (720p), smooth textures, true colour and steady 3D (PGXP), with Smooth Edges. = 3x (720p), texture morbide, colore reale e 3D stabile (PGXP), con Bordi morbidi.
4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA), made crisper (Natural HD). = 4x (960p), texture morbide, 3D stabile, anti-aliasing 4x (MSAA), resa più definita (HD naturale).
3x (1440x816), the sharpest textures far away, with Smooth Edges. = 3x (1440x816), le texture più nitide in lontananza, con Bordi morbidi.
2x (1280x960), textures 8x sharp far away, with Smooth Edges. The size changes at the next start. = 2x (1280x960), texture lontane nitide a 8x, con Bordi morbidi. La dimensione cambia al prossimo avvio.
3x (1920x1440, made smaller for the TV), textures 8x sharp far away, with Smooth Edges. The size changes at the next start. = 3x (1920x1440, rimpicciolita per la TV), texture lontane nitide a 8x, con Bordi morbidi. La dimensione cambia al prossimo avvio.
3x (1920x1440), the sharpest textures far away (16x), made crisper (Natural HD). The size changes at the next start. = 3x (1920x1440), le texture lontane più nitide (16x), resa più definita (HD naturale). La dimensione cambia al prossimo avvio.


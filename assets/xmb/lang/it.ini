# --- EmuSuNi 00.40: the GPU Upscaler's steps (Smooth Edges, Natural HD, Natural AI)
Smooth Edges: the GPU smooths the jagged edges and leaves the pixels and textures as they are; the N64, the PlayStation and the PSP at 2x. = Bordi morbidi: la GPU ammorbidisce i bordi seghettati e lascia pixel e texture come sono; l'N64, la PlayStation e la PSP a 2x.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR) that still looks natural; the N64 and the PlayStation at 4x, the PSP at 3x. Heavy N64 games can slow down. = HD naturale: bordi morbidi, poi un'immagine HD nitida alla risoluzione della TV (AMD FSR) che resta naturale; l'N64 e la PlayStation a 4x, la PSP a 3x. I giochi N64 pesanti possono rallentare.
The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP in Full HD with anti-aliasing. Heavy N64 games can slow down. = Il meglio di ogni console: IA naturale, una rete di IA (Anime4K) che pulisce ogni bordo e conserva le texture (senza effetto cera); l'N64 a 4x con 2D in HD; la PlayStation a 4x con texture morbide, 3D stabile e anti-aliasing; la PSP in Full HD con anti-aliasing. I giochi N64 pesanti possono rallentare.
Smooth Edges = Bordi morbidi
Only the jagged edges are smoothed (anti-aliasing: MMPX and SMAA); colours, textures and the pixels' shapes stay as they are. Light on the GPU. Quality Medium uses it. = Vengono ammorbiditi solo i bordi seghettati (anti-aliasing: MMPX e SMAA); colori, texture e forma dei pixel restano come sono. Leggero per la GPU. Lo usa la qualità Media.
Natural HD = HD naturale
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. Quality High uses it. = Bordi morbidi, poi disegnata in HD alla risoluzione della TV e resa più nitida (AMD FSR): chiaramente più nitida, sempre naturale, mai dipinta. Lo usa la qualità Alta.
Natural AI = IA naturale
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. Quality Ultra uses it. = I bordi puliti di HD naturale con una rete di IA (Anime4K) mescolata all'immagine, così texture e dithering restano: l'aspetto più morbido senza effetto cera. Lo usa la qualità Ultra.
AI (Anime4K) = IA (Anime4K)
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest, most painted HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ, poi una rete neurale (Anime4K) a piena potenza pulisce ogni bordo e curva: l'aspetto HD più morbido e dipinto per SNES, NES e i Game Boy. L'N64 usa HD morbido.
Draws the picture with the GPU's filters at the TV's resolution. Every filter but HD Sharpen starts from the console's own picture: Resolution and the Upscaling Filter are left out. = Disegna l'immagine con i filtri della GPU alla risoluzione della TV. Tutti i filtri tranne Nitidezza HD partono dall'immagine originale della console: Risoluzione e Filtro di upscaling non vengono usati.

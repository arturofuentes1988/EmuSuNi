# --- EmuSuNi 00.26: the N64's picture
N64 Anti-Aliasing = Anti-aliasing N64
On (the N64's) = Sì (quello dell'N64)
Smooth 3D edges, as the N64's video chip made them. = Bordi 3D morbidi, come li faceva il chip video dell'N64.
Jagged 3D edges, a little sharper: the picture before the N64's filter. = Bordi 3D seghettati, un po' più nitidi: l'immagine prima del filtro dell'N64.
The N64's own edge smoothing (its video chip). Costs almost nothing. = L'ammorbidimento dei bordi proprio dell'N64 (il suo chip video). Non costa quasi nulla.
N64 Dither Filter = Filtro dithering N64
Smooth colours: the N64's filter hides the dots of its 16-bit colours. = Colori morbidi: il filtro dell'N64 nasconde i puntini dei suoi colori a 16 bit.
The dots stay: grainy skies, fog and shadows. = I puntini restano: cieli, nebbia e ombre granulosi.
The N64 drew its 16-bit colours with a pattern of dots; its video chip blended them away. = L'N64 disegnava i suoi colori a 16 bit con un motivo di puntini; il suo chip video li sfumava.
N64 2D Graphics = Grafica 2D N64
Exact = Esatta
Text, icons and 2D backgrounds as the N64 drew them: blocky, without seams. = Testi, icone e sfondi 2D come li disegnava l'N64: squadrati, senza giunture.
Smooth (HD) = Morbida (HD)
Text, icons and 2D backgrounds at the N64 Resolution: smoother; some games show thin lines between their pieces. = Testi, icone e sfondi 2D alla Risoluzione N64: più morbidi; alcuni giochi mostrano linee sottili tra i loro pezzi.
How the HUD, text and 2D pictures are drawn above Native resolution. = Come vengono disegnati l'HUD, i testi e le immagini 2D sopra la risoluzione nativa.
N64 Distant Textures = Texture lontane N64
Sharp (HD) = Nitide (HD)
Far textures as sharp as the N64 Resolution allows. = Texture lontane nitide quanto permette la Risoluzione N64.
As the N64 = Come sull'N64
Far textures as blurry as on the N64: for the few games that swap textures with the distance. = Texture lontane sfocate come sull'N64: per i pochi giochi che cambiano texture con la distanza.
The texture detail of far surfaces above Native resolution. = Il dettaglio delle texture delle superfici lontane sopra la risoluzione nativa.
N64 Screen Effects = Effetti schermo N64
Blurs, pause screens and photos made from the game's own picture, at the N64's size. = Sfocature, schermate di pausa e foto fatte con l'immagine del gioco stesso, alla dimensione dell'N64.
Smooth (SSAA) = Morbidi (SSAA)
Those effects made from the sharp picture: smoother; a few games glitch. = Quegli effetti fatti con l'immagine nitida: più morbidi; alcuni giochi hanno difetti.
Effects some games make from their own picture (pause backgrounds, motion blur), above Native resolution. = Effetti che alcuni giochi fanno con la loro immagine (sfondi di pausa, scia di movimento), sopra la risoluzione nativa.
Four times (about Full HD): the sharpest; heavy games can slow down. = Quattro volte (circa Full HD): la più nitida; i giochi pesanti possono rallentare.
Sharper: SNES and NES redrawn at 3x (xBRZ); the N64 at 2x. = Più nitida: SNES e NES ridisegnati a 3x (xBRZ); l'N64 a 2x.
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 4x; heavy N64 games can slow down. = La più nitida: SNES e NES a 6x (xBRZ), l'N64 a 4x; i giochi N64 pesanti possono rallentare.
# --- EmuSuNi 00.27: Ultra and the GPU's filters
Ultra (maximum) = Ultra (massima)
The best each console can do: SNES and NES redrawn by the GPU with xBRZ and an AI network (Anime4K); the N64 at 4x with HD 2D, sharpened. Heavy N64 games can slow down. = Il meglio di ogni console: SNES e NES ridisegnati dalla GPU con xBRZ e una rete di IA (Anime4K); l'N64 a 4x con 2D in HD e più nitidezza. I giochi N64 pesanti possono rallentare.
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = Imposta in un colpo l'immagine per un livello: risoluzione, upscaling (CPU e GPU), dimensione dell'immagine, e dimensione, sincronia e 2D dell'N64. Se ne cambi uno, diventa Personalizzata.
GPU Upscaler = Upscaling GPU
The picture as Resolution and the Upscaling Filter make it. = L'immagine come la fanno Risoluzione e Filtro di upscaling.
Pixel Art HD (xBRZ) = Pixel Art HD (xBRZ)
SNES and NES redrawn by the GPU at the TV's full resolution: rounded, clean edges without blur; frees the CPU. The N64 gets Smooth HD. = SNES e NES ridisegnati dalla GPU alla risoluzione piena della TV: bordi arrotondati e puliti, senza sfocatura; libera la CPU. L'N64 usa HD morbido.
AI (xBRZ + Anime4K) = IA (xBRZ + Anime4K)
xBRZ, then a neural network (Anime4K) cleans every edge and curve: the smoothest HD look for SNES and NES. The N64 gets Smooth HD. = xBRZ, poi una rete neurale (Anime4K) pulisce ogni bordo e curva: l'aspetto HD più morbido per SNES e NES. L'N64 usa HD morbido.
Smooth HD (AMD FSR) = HD morbido (AMD FSR)
AMD FidelityFX Super Resolution: smooth upscaling with sharp edges, made for 3D (the N64 at Native and 2x; at 4x it sharpens). = AMD FidelityFX Super Resolution: upscaling morbido con bordi nitidi, fatto per il 3D (l'N64 a Nativa e 2x; a 4x aumenta solo la nitidezza).
HD Sharpen (AMD RCAS) = Nitidezza HD (AMD RCAS)
The picture as it is, made crisper by AMD's sharpening (RCAS): for the N64 at 4x and pictures already made bigger. = L'immagine così com'è, resa più nitida dal filtro di nitidezza AMD (RCAS): per l'N64 a 4x e per immagini già ingrandite.
Draws the picture with the GPU's filters at the TV's resolution. Pixel Art HD, AI and Smooth HD start from the console's own picture: Resolution and the Upscaling Filter are left out. = Disegna l'immagine con i filtri della GPU alla risoluzione della TV. Pixel Art HD, IA e HD morbido partono dall'immagine originale della console: Risoluzione e Filtro di upscaling non vengono usati.
N64 CPU Cores = Core CPU N64
Fixed = Fissi
Each N64 thread on a PS4 core of its own: the emulation on core 2, its graphics commands on core 3. = Ogni thread dell'N64 su un core della PS4 tutto suo: l'emulazione sul core 2, i suoi comandi grafici sul core 3.
PS4's Choice = Sceglie la PS4
The PS4 moves the threads between its cores, as before 00.27. = La PS4 sposta i thread tra i suoi core, come prima della 00.27.
Which PS4 cores run an N64 game's threads. Fixed gives the emulation and its graphics thread a core each, so they run at the same time. = Quali core della PS4 eseguono i thread di un gioco N64. Fissi dà un core all'emulazione e uno al suo thread grafico, così lavorano insieme.
N64 Frame Pacing = Ritmo fotogrammi N64
Even (V-Sync) = Regolare (V-Sync)
Each refresh shows the frame the game should be at when the TV shows it: PAL's 50 frames come out even on the TV's 60, and a heavy frame doesn't make the next refresh jump two frames. = Ogni aggiornamento mostra il fotogramma in cui il gioco dovrebbe essere quando la TV lo mostra: i 50 fotogrammi del PAL escono uniformi sui 60 della TV, e un fotogramma pesante non fa saltare due fotogrammi all'aggiornamento successivo.
By the Clock = Secondo l'orologio
By the time each pass of the emulator took, as 00.27: it catches up with two frames in one refresh. = In base al tempo di ogni giro dell'emulatore, come la 00.27: recupera con due fotogrammi in un aggiornamento.
How the N64's frames are spread over the TV's refreshes with V-Sync on. = Come vengono distribuiti i fotogrammi dell'N64 sugli aggiornamenti della TV con V-Sync attivo.
# --- EmuSuNi 00.28: the N64's picture one frame later
N64 Picture Timing = Tempismo immagine N64
One Frame Later = Un fotogramma dopo
The graphics thread makes each picture while the N64 runs on: at 4x up to 3 ms less per frame; the picture is shown one frame (17-20 ms) later. = Il thread grafico crea ogni immagine mentre l'N64 continua: a 4x fino a 3 ms in meno per fotogramma; l'immagine si vede un fotogramma (17-20 ms) dopo.
At Once = Subito
The N64 waits at every frame until its picture is made, as before. = L'N64 attende a ogni fotogramma che la sua immagine sia pronta, come prima.
When the N64's picture is made: by the graphics thread one frame later (faster), or at once. = Quando viene creata l'immagine dell'N64: dal thread grafico un fotogramma dopo (più veloce) o subito.

# --- EmuSuNi 00.70: the 3DS CPU Clock's texts (a lower clock seldom saves the PS4 any work)
The game sees a slower 3DS. Less work for the PS4 only in a game that keeps the processor busy without a break; most wait for their next picture and cost the same. = Il gioco vede un 3DS più lento. Meno lavoro per la PS4 solo in un gioco che tiene il processore occupato senza pause; la maggior parte attende la prossima immagine e costa uguale.
The game sees a 3DS at half speed: a game that needs the speed slows down or stutters. = Il gioco vede un 3DS a metà velocità: un gioco che ha bisogno della velocità rallenta o scatta.
How fast the emulated 3DS's processor runs. Most games wait for their next picture, so a lower clock seldom saves the PS4 any work (none in the games tried); a game that needs the speed slows down or freezes. = Quanto va veloce il processore del 3DS emulato. La maggior parte dei giochi attende la prossima immagine, quindi un clock più basso raramente fa risparmiare lavoro alla PS4 (nessun risparmio nei giochi provati); un gioco che ha bisogno della velocità rallenta o si blocca.

# --- EmuSuNi 00.71: the 3DS's Quality levels (3DS Resolution 1x to 4x on its pages, the GPU Upscaler's steps)
Each console's own resolution (the N64, the PlayStation, the PSP, the DS, the 3DS and the Dreamcast at 1x), no upscaler and no filters. = La risoluzione originale di ogni console (l'N64, la PlayStation, la PSP, il DS, il 3DS e il Dreamcast a 1x), senza upscaling né filtri.
Smooth Edges; the N64, the PlayStation, the PSP, the 3DS and the Dreamcast at 2x. = Bordi morbidi; l'N64, la PlayStation, la PSP, il 3DS e il Dreamcast a 2x.
Pixel Art HD (the 3D consoles: Smooth Edges); the N64 at 4x, the PlayStation, the PSP, the 3DS and the Dreamcast at 3x. = Pixel Art HD (le console 3D: Bordi morbidi); l'N64 a 4x, la PlayStation, la PSP, il 3DS e il Dreamcast a 3x.
AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation, the PSP and the 3DS at 4x, the Dreamcast at 3x with the sharpest textures. = IA (le console 3D: più nitidezza, HD naturale); l'N64, la PlayStation, la PSP e il 3DS a 4x, il Dreamcast a 3x con le texture più nitide.
Twice the size (800x480): sharper 3D. = Il doppio della dimensione (800x480): 3D più nitido.
Three times (1200x720): sharper 3D still. = Tre volte (1200x720): 3D ancora più nitido.
Four times (1600x960, about Full HD): the sharpest 3D. = Quattro volte (1600x960, circa Full HD): il 3D più nitido.
The size the GPU draws 3DS games at: real HD 3D, not an enlarged picture. A bigger size is more work for the GPU only, but a game that reads its picture back (a few do, for effects) waits for it and can slow down. = La dimensione a cui la GPU disegna i giochi 3DS: vero 3D in HD, non un'immagine ingrandita. Una dimensione maggiore dà più lavoro solo alla GPU, ma un gioco che rilegge la sua immagine (pochi lo fanno, per gli effetti) la attende e può rallentare.
The console's own resolution (400x240 and 320x240), with no filters: the lightest. The size changes at the next start. = La risoluzione originale della console (400x240 e 320x240), senza filtri: la più leggera. La dimensione cambia al prossimo avvio.
2x (800x480) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 2x (800x480) con Bordi morbidi. La dimensione cambia al prossimo avvio; un gioco che rilegge la sua immagine può rallentare.
3x (1200x720) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 3x (1200x720) con Bordi morbidi. La dimensione cambia al prossimo avvio; un gioco che rilegge la sua immagine può rallentare.
4x (1600x960), made crisper by AMD's sharpening (Natural HD). The size changes at the next start; a game that reads its picture back can slow down. = 4x (1600x960), resa più definita dal filtro di nitidezza AMD (HD naturale). La dimensione cambia al prossimo avvio; un gioco che rilegge la sua immagine può rallentare.

# --- EmuSuNi 00.72: the N64 (Ogre Battle 64 plays with N64 Graphics Sync Accurate too)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA, Resident Evil 2 and Ogre Battle 64 play Accurate anyway (with Fast the first two stay on a black screen and Ogre Battle's backgrounds break). = La GPU disegna mentre l'N64 continua: molto più fluido sulla PS4. Cruis'n USA, Resident Evil 2 e Ogre Battle 64 vanno comunque in Precisa (con Veloce i primi due restano su uno schermo nero e gli sfondi di Ogre Battle si rompono).


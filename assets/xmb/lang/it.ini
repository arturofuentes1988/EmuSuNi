# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = Imposta in un colpo l'immagine per un livello: risoluzione, upscaling (CPU e GPU), dimensione dell'immagine, e dimensione, sincronia e 2D dell'N64. Se ne cambi uno, diventa Personalizzata. Il gioco mostra subito il cambio, ma dimensione e sincronia dell'N64 cambiano al prossimo avvio di un gioco. Il Dreamcast gioca sempre in Bassa (la PS4 non può ancora fare di più).
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = Ammorbidisce i bordi seghettati del 3D (multisampling, sulla GPU). Se lo cambi durante il gioco, il 3D viene preparato di nuovo: può scattare per qualche secondo.

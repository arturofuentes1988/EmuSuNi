# --- EmuSuNi 00.89: macros (several buttons in one) and the statistics' notice
Several buttons in one (fighting games). Cross: press the macro's button, then hold together the buttons it presses and let them go. Left: none. Its button stops doing what it did. = Più tasti in uno (picchiaduro). Croce: premi il tasto della macro, poi tieni premuti insieme i tasti che preme e rilasciali. Sinistra: nessuno. Il suo tasto smette di fare ciò che faceva.
Now hold together the buttons it presses, then let them go...  (5 s: cancel) = Ora tieni premuti insieme i tasti che preme, poi rilasciali...  (5 s: annulla)
Hold its buttons... = Tieni premuti i tasti...
EmuSuNi sends anonymous statistics: how many use it and from which countries, its version, the PS4's language, the console and the game played (a checksum or a disc's code, never a file's name). = EmuSuNi invia statistiche anonime: quanti lo usano e da quali paesi, la sua versione, la lingua della PS4, la console e il gioco giocato (un checksum o il codice di un disco, mai il nome di un file).
Never sent: names, PSN, your list of games, your files. The server keeps no address. = Mai inviati: nomi, PSN, la tua lista di giochi, i tuoi file. Il server non tiene nessun indirizzo.
Off, nothing at all is sent. Change it any time: Settings -> Anonymous Statistics. = Se disattivate, non viene inviato proprio nulla. Puoi cambiarlo quando vuoi: Impostazioni -> Statistiche anonime.
Turn Them Off = Disattivale
They stay as they are. They show which consoles and games to improve first. = Restano come sono. Mostrano quali console e giochi migliorare per primi.
Nothing is sent. Online play still works; the online profile needs them. = Non si invia nulla. Il gioco online funziona comunque; il profilo online ne ha bisogno.

# --- 00.68: the Dreamcast's Quality levels
Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the Dreamcast at 1x), no upscaler and no filters. = La risoluzione originale di ogni console (l'N64, la PlayStation, la PSP, il DS e il Dreamcast a 1x), senza upscaling né filtri.
Smooth Edges; the N64, the PlayStation, the PSP and the Dreamcast at 2x. = Bordi morbidi; l'N64, la PlayStation, la PSP e il Dreamcast a 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP and the Dreamcast at 3x. = HD naturale; l'N64 e la PlayStation a 4x, la PSP e il Dreamcast a 3x.
Natural AI; the N64, the PlayStation and the PSP at 4x, the Dreamcast at 3x with the sharpest textures. = IA naturale; l'N64, la PlayStation e la PSP a 4x, il Dreamcast a 3x con le texture più nitide.
The Dreamcast's own 640x480 picture: the lightest. = L'immagine originale del Dreamcast, 640x480: la più leggera.
Twice the size (1280x960): sharper 3D. = Il doppio della dimensione (1280x960): 3D più nitido.
Three times (1920x1440), made smaller for a 1080p TV: the sharpest 3D, the smoothest edges. = Tre volte (1920x1440), rimpicciolita per una TV 1080p: il 3D più nitido, i bordi più morbidi.
The size the GPU draws Dreamcast, NAOMI and Atomiswave games at: real HD 3D, not an enlarged picture. The size changes at the next start. = La dimensione a cui la GPU disegna i giochi Dreamcast, NAOMI e Atomiswave: vero 3D in HD, non un'immagine ingrandita. La dimensione cambia al prossimo avvio.
How sharp the textures of far, slanted surfaces stay (anisotropic filtering, on the GPU). It changes at the next game start. = Quanto restano nitide le texture delle superfici lontane e inclinate (filtro anisotropico, sulla GPU). Cambia al prossimo avvio di un gioco.
The console's own resolution (640x480), textures 4x sharp far away: the lightest. The size changes at the next start. = La risoluzione originale della console (640x480), texture lontane nitide a 4x: la più leggera. La dimensione cambia al prossimo avvio.
2x (1280x960), textures 8x sharp far away. The size changes at the next start. = 2x (1280x960), texture lontane nitide a 8x. La dimensione cambia al prossimo avvio.
3x (1920x1440, made smaller for the TV), textures 8x sharp far away. The size changes at the next start. = 3x (1920x1440, rimpicciolita per la TV), texture lontane nitide a 8x. La dimensione cambia al prossimo avvio.
3x (1920x1440), the sharpest textures far away (16x). The size changes at the next start. = 3x (1920x1440), le texture lontane più nitide (16x). La dimensione cambia al prossimo avvio.
# --- 00.68: the N64 (Graphics Sync for Cruis'n USA and Resident Evil 2, Ultra's 2D Exact)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA and Resident Evil 2 play Accurate anyway (with Fast they stay on a black screen). = La GPU disegna mentre l'N64 continua: molto più fluido sulla PS4. Cruis'n USA e Resident Evil 2 vanno comunque in Precisa (con Veloce restano su uno schermo nero).
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens), or a game that goes black with Fast. = L'N64 attende ogni immagine: più lento. Per i pochi giochi i cui effetti rileggono lo schermo (foto della fotocamera, alcune schermate di pausa), o un gioco che diventa nero con Veloce.
Text, icons and 2D backgrounds at the N64 Resolution: smoother, but many games show lines or squares where their pieces meet (Zelda's pre-drawn rooms, ISS 64's intro). = Testi, icone e sfondi 2D alla Risoluzione N64: più morbidi, ma molti giochi mostrano linee o quadrati dove i pezzi si uniscono (le stanze predisegnate di Zelda, l'intro di ISS 64).
4x (960p) with Natural AI. The size changes at the next start. = 4x (960p) con IA naturale. La dimensione cambia al prossimo avvio.


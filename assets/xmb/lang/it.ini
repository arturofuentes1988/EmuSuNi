# --- EmuSuNi 00.21: the N64's speed
N64 Graphics Sync = Sincronia grafica N64
Fast (asynchronous) = Veloce (asincrona)
The GPU draws while the N64 runs: much smoother on the PS4. = La GPU disegna mentre l'N64 continua: molto più fluido sulla PS4.
Accurate (synchronous) = Precisa (sincrona)
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens). = L'N64 attende ogni immagine: più lento. Per i pochi giochi i cui effetti rileggono lo schermo (foto della fotocamera, alcune schermate di pausa).
Whether the N64 waits for the GPU's pictures (ParaLLEl-RDP's Synchronous RDP). = Se l'N64 attende le immagini della GPU (Synchronous RDP di ParaLLEl-RDP).
The N64's own picture: the smoothest. = L'immagine originale dell'N64: la più fluida.
Twice the size: sharper 3D; heavy scenes can slow down. = Il doppio della dimensione: 3D più nitido; le scene pesanti possono rallentare.
Four times: the sharpest; too heavy for most games on the PS4. = Quattro volte: la più nitida; troppo pesante per la maggior parte dei giochi sulla PS4.
The size the GPU draws N64 games at (ParaLLEl-RDP). Native is the smoothest. = La dimensione a cui la GPU disegna i giochi N64 (ParaLLEl-RDP). Nativa è la più fluida.
Quality = Qualità
Custom Quality = Personalizzata
Your own choices (they match none of the three levels). = Le tue scelte (non corrispondono a nessuno dei tre livelli).
Low (fastest) = Bassa (la più veloce)

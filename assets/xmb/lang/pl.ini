Tube TV (CRT) = Kineskop (CRT)
The picture as the other settings make it. = Obraz taki, jak tworzą go pozostałe ustawienia.
TV = TV
A living-room tube TV: curved glass, soft lines, dots of colour and a little glow. = Kineskopowy telewizor z salonu: wypukłe szkło, miękkie linie, kolorowe punkty i lekka poświata.
Arcade Monitor = Monitor automatu
An arcade cabinet's monitor: sharper and darker lines, a slot mask, less curved. = Monitor automatu arcade: ostrzejsze i ciemniejsze linie, maska szczelinowa, mniej wypukły.
Studio Monitor = Monitor studyjny
A flat professional monitor: crisp, thin lines and a fine aperture grille. = Płaski monitor profesjonalny: wyraźne, cienkie linie i drobna siatka aperturowa.
Intense = Intensywny
Everything stronger: very curved glass, dark lines, a clear mask and more glow. = Wszystko mocniej: bardzo wypukłe szkło, ciemne linie, wyraźna maska i więcej poświaty.
An old tube TV's look on the console's own picture, drawn by the GPU (about 1 ms a frame). It takes the place of the GPU Upscaler and of Scanlines; the NTSC Filter's picture goes through it; a bezel frames it. = Wygląd starego kineskopowego telewizora na własnym obrazie konsoli, rysowany przez GPU (około 1 ms na klatkę). Zastępuje Skalowanie GPU i Linie skanowania; obraz z Filtra NTSC przechodzi przez niego; ramka go otacza.
Arcade Cabinet = Automat arcade
An arcade cabinet's sides: their art and trim, the stick and the buttons. = Boki automatu arcade: ich grafiki i listwy, drążek i przyciski.
Dark Minimal = Ciemny minimalizm
A plain dark frame with a thin edge: nothing but the game. = Prosta ciemna ramka z cienką krawędzią: tylko gra.
Neon = Neon
Glowing neon tubes and a retro grid on black. = Świecące neony i retro siatka na czarnym tle.
Wood Panel = Panel drewniany
Dark wood and black ribs, as on the consoles of the 1970s. = Ciemne drewno i czarne żebrowanie, jak na konsolach z lat 70.
Carbon = Karbon
Carbon fibre with a brushed metal edge. = Włókno węglowe z krawędzią ze szczotkowanego metalu.
Starfield = Gwiezdne pole
Deep space: stars and a faint nebula. = Głęboki kosmos: gwiazdy i słaba mgławica.
Black with red and white lines, the joystick and buttons 1 and 2. = Czarny z czerwonymi i białymi liniami, joystickiem i przyciskami 1 i 2.
Black with red lines and the ribs on top, the pad and buttons 1 and 2. = Czarny z czerwonymi liniami i żebrowaniem na górze, padem i przyciskami 1 i 2.
The handheld in black around its screen: the D-pad, START and buttons 1 and 2. = Czarna konsola przenośna wokół ekranu: krzyżak, START i przyciski 1 i 2.
Genesis = Genesis
Black with the round grooves, the D-pad and the A, B and C buttons. = Czarny z okrągłymi rowkami, krzyżakiem i przyciskami A, B i C.
The handheld in glossy black around its wide screen: the D-pad, the stick, the four symbols. = Konsola przenośna w błyszczącej czerni wokół szerokiego ekranu: krzyżak, gałka, cztery symbole.
Your own 1920x1080 PNG, see-through where the game goes: /data/EmuSuNi/bezels/psp/ with the game's name, or bezels/psp.png for every game. = Własny PNG 1920x1080, przezroczysty tam, gdzie jest gra: /data/EmuSuNi/bezels/psp/ z nazwą gry lub bezels/psp.png dla wszystkich gier.
A frame around the picture, see-through where the game goes. The PSP's picture is as wide as the TV: in a frame it is made smaller (about 83%). = Ramka wokół obrazu, przezroczysta tam, gdzie jest gra. Obraz PSP jest tak szeroki jak telewizor: w ramce zostaje zmniejszony (do około 83%).
The DS in white around its screens, made for each way DS Screens shows them. = Biała konsola DS wokół ekranów, przygotowana dla każdego układu z opcji Ekrany DS.
Your own 1920x1080 PNG, see-through where the game goes: /data/EmuSuNi/bezels/nds/ with the game's name, or bezels/nds.png for every game. = Własny PNG 1920x1080, przezroczysty tam, gdzie jest gra: /data/EmuSuNi/bezels/nds/ z nazwą gry lub bezels/nds.png dla wszystkich gier.
A frame around the screens, see-through where they go. Side by side or with the big screen, the picture is made smaller to fit in it. = Ramka wokół ekranów, przezroczysta tam, gdzie są ekrany. Przy układzie obok siebie lub z dużym ekranem obraz jest zmniejszany, aby się zmieścił.
Nintendo 3DS = Nintendo 3DS
The 3DS in aqua blue around its screens, made for each way 3DS Screens shows them. = Konsola 3DS w kolorze akwamaryny wokół ekranów, przygotowana dla każdego układu z opcji Ekrany 3DS.
Your own 1920x1080 PNG, see-through where the game goes: /data/EmuSuNi/bezels/3ds/ with the game's name, or bezels/3ds.png for every game. = Własny PNG 1920x1080, przezroczysty tam, gdzie jest gra: /data/EmuSuNi/bezels/3ds/ z nazwą gry lub bezels/3ds.png dla wszystkich gier.
A frame around the screens, see-through where they go. Side by side, with the big top screen or the top screen only, the picture is made smaller to fit in it. = Ramka wokół ekranów, przezroczysta tam, gdzie są ekrany. Przy układzie obok siebie, z dużym górnym ekranem lub tylko z górnym ekranem obraz jest zmniejszany, aby się zmieścił.
The console's white, its round lid and the controller's four coloured buttons. = Biel konsoli, jej okrągła klapa i cztery kolorowe przyciski kontrolera.
Your own 1920x1080 PNG, see-through where the game goes: /data/EmuSuNi/bezels/dc/ with the game's name, or bezels/dc.png for every game. = Własny PNG 1920x1080, przezroczysty tam, gdzie jest gra: /data/EmuSuNi/bezels/dc/ z nazwą gry lub bezels/dc.png dla wszystkich gier.
NAOMI Cabinet = Automat NAOMI
A white arcade cabinet with gold trim, its stick and six buttons. = Biały automat arcade ze złotymi listwami, drążkiem i sześcioma przyciskami.
Your own 1920x1080 PNG, see-through where the game goes: /data/EmuSuNi/bezels/naomi/ with the romset's name (mvsc2.png), or bezels/naomi.png for every game. = Własny PNG 1920x1080, przezroczysty tam, gdzie jest gra: /data/EmuSuNi/bezels/naomi/ z nazwą romsetu (mvsc2.png) lub bezels/naomi.png dla wszystkich gier.
Atomiswave Cabinet = Automat Atomiswave
A black arcade cabinet with green lights, its stick, buttons and cartridge. = Czarny automat arcade z zielonymi światłami, drążkiem, przyciskami i kartridżem.
Your own 1920x1080 PNG, see-through where the game goes: /data/EmuSuNi/bezels/atomiswave/ with the romset's name (kofxi.png), or bezels/atomiswave.png for every game. = Własny PNG 1920x1080, przezroczysty tam, gdzie jest gra: /data/EmuSuNi/bezels/atomiswave/ z nazwą romsetu (kofxi.png) lub bezels/atomiswave.png dla wszystkich gier.


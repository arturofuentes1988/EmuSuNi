Smooth colours: the N64's filter hides the dots of its 16-bit colours. = Gładkie kolory: filtr N64 ukrywa kropki 16-bitowych kolorów.
The dots stay: grainy skies, fog and shadows. = Kropki zostają: ziarniste niebo, mgła i cienie.
The N64 drew its 16-bit colours with a pattern of dots; its video chip blended them away. = N64 rysowała 16-bitowe kolory wzorem kropek; jej układ wideo je rozmywał.
N64 2D Graphics = Grafika 2D N64
Exact = Dokładna
Text, icons and 2D backgrounds as the N64 drew them: blocky, without seams. = Teksty, ikony i tła 2D tak, jak rysowała je N64: kanciaste, bez szwów.
Smooth (HD) = Gładka (HD)

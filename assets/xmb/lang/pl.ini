# --- EmuSuNi 00.85: fixes (the in-game menu's buttons pressed without the hold, Menu Size)
The right stick pressed: the menu opens at once. A game that uses R3 doesn't get it any more; on the DS and the 3DS, R3 then opens the menu instead of swapping the screens. = Wciśnięcie prawej gałki: menu otwiera się od razu. Gra, która używa R3, już go nie dostaje; w DS i 3DS R3 otwiera wtedy menu zamiast zamieniać ekrany.
Both pressed together: the menu opens at once. One held and the other pressed later is the game's; a game that presses both at the same moment opens the menu. = Oba wciśnięte razem: menu otwiera się od razu. Jeśli przytrzymasz jeden, a drugi wciśniesz później, trafia to do gry; gra, w której oba wciska się w tej samej chwili, otwiera menu.
Both pressed together: the menu opens at once. One held and the other pressed later is the game's (a racing game's accelerator and brake); a game that presses both at the same moment opens the menu. = Oba wciśnięte razem: menu otwiera się od razu. Jeśli przytrzymasz jeden, a drugi wciśniesz później, trafia to do gry (gaz i hamulec w grze wyścigowej); gra, w której oba wciska się w tej samej chwili, otwiera menu.

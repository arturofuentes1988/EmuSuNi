# --- EmuSuNi 00.40: the GPU Upscaler's steps (Smooth Edges, Natural HD, Natural AI)
Smooth Edges: the GPU smooths the jagged edges and leaves the pixels and textures as they are; the N64, the PlayStation and the PSP at 2x. = Gładkie krawędzie: GPU wygładza poszarpane krawędzie i zostawia piksele i tekstury bez zmian; N64, PlayStation i PSP w 2x.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR) that still looks natural; the N64 and the PlayStation at 4x, the PSP at 3x. Heavy N64 games can slow down. = Naturalne HD: gładkie krawędzie, a potem ostry obraz HD w rozdzielczości telewizora (AMD FSR), który nadal wygląda naturalnie; N64 i PlayStation w 4x, PSP w 3x. Ciężkie gry N64 mogą zwalniać.
The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP in Full HD with anti-aliasing. Heavy N64 games can slow down. = Najlepsze, co potrafi każda konsola: Naturalne AI, sieć AI (Anime4K), która czyści każdą krawędź i zachowuje tekstury (bez efektu wosku); N64 w 4x z 2D w HD; PlayStation w 4x z gładkimi teksturami, stabilnym 3D i antyaliasingiem; PSP w Full HD z antyaliasingiem. Ciężkie gry N64 mogą zwalniać.
Smooth Edges = Gładkie krawędzie
Only the jagged edges are smoothed (anti-aliasing: MMPX and SMAA); colours, textures and the pixels' shapes stay as they are. Light on the GPU. Quality Medium uses it. = Wygładzane są tylko poszarpane krawędzie (antyaliasing: MMPX i SMAA); kolory, tekstury i kształt pikseli zostają bez zmian. Lekkie dla GPU. Używa go jakość Średnia.
Natural HD = Naturalne HD
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. Quality High uses it. = Gładkie krawędzie, a potem rysowanie w HD w rozdzielczości telewizora z wyostrzeniem (AMD FSR): wyraźnie ostrzej, wciąż naturalnie, nigdy jak malowane. Używa go jakość Wysoka.
Natural AI = Naturalne AI
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. Quality Ultra uses it. = Czyste krawędzie Naturalnego HD z siecią AI (Anime4K) wmieszaną w obraz, więc tekstury i dithering zostają: najgładszy wygląd bez efektu wosku. Używa go jakość Ultra.
AI (Anime4K) = AI (Anime4K)
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest, most painted HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ, a potem sieć neuronowa (Anime4K) z pełną mocą czyści każdą krawędź i krzywą: najgładszy, najbardziej malarski wygląd HD dla SNES, NES i konsol Game Boy. N64 dostaje Gładkie HD.
Draws the picture with the GPU's filters at the TV's resolution. Every filter but HD Sharpen starts from the console's own picture: Resolution and the Upscaling Filter are left out. = Rysuje obraz filtrami GPU w rozdzielczości telewizora. Każdy filtr poza Wyostrzaniem HD zaczyna od własnego obrazu konsoli: Rozdzielczość i Filtr skalowania są pomijane.

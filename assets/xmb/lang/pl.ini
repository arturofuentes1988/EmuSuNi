No microphone could be opened (error {}). Plug a headset into the controller, or connect a USB microphone or the PlayStation Camera. = Nie udało się otworzyć żadnego mikrofonu (błąd {}). Podłącz słuchawki z mikrofonem do kontrolera albo mikrofon USB lub PlayStation Camera.

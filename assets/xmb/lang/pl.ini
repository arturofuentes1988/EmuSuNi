# --- EmuSuNi 00.81: the 3DS's graphics errors (Accurate Shader Multiplication and 3DS Right Eye, per game)
Accurate Shader Multiplication = Dokładne mnożenie w shaderach
On in the games known to need it (the Pokémon games from X and Y to Ultra Sun and Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Off in the others. = Włączone w grach, o których wiadomo, że tego wymagają (gry Pokémon od X i Y do Ultra Sun i Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), wyłączone w pozostałych.
Multiplies in the shaders exactly as the 3DS does: models, lights and effects drawn right. A little more work for the GPU. = Mnoży w shaderach dokładnie tak jak 3DS: modele, światła i efekty rysowane poprawnie. Trochę więcej pracy dla GPU.
The faster multiplication: most games look the same with it. = Szybsze mnożenie: większość gier wygląda z nim tak samo.
How the GPU's shaders multiply: exactly as the 3DS does, or faster. Without it a few games draw white, too bright or black models and effects. (Ocarina of Time 3D and the Mario & Luigi games always use it.) = Jak mnożą shadery GPU: dokładnie tak jak 3DS albo szybciej. Bez tego kilka gier rysuje białe, zbyt jasne lub czarne modele i efekty. (Ocarina of Time 3D i gry Mario & Luigi zawsze tego używają.)
3DS Right Eye = Prawe oko 3DS
Not drawn, but drawn in the games known to need it (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition). = Nierysowane, poza grami, o których wiadomo, że tego wymagają (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition).
Not Drawn (faster) = Nierysowane (szybciej)
The PS4 shows no 3D, so the right eye's picture is left out: less work in the games that draw both eyes. = PS4 nie pokazuje 3D, więc obraz prawego oka jest pomijany: mniej pracy w grach rysujących oba oczy.
Drawn = Rysowane
As on the 3DS: for a game whose screen stays black, freezes on an effect or is out of place. Slower in the games that draw both eyes. = Jak w 3DS: dla gry, której ekran pozostaje czarny, zawiesza się na efekcie lub jest przesunięty. Wolniej w grach rysujących oba oczy.
3DS games draw a second picture for the 3D effect, the right eye's, which the PS4 never shows. Leaving it out is faster (Super Mario 3D Land then draws half as much), but a few games show a black, frozen or misplaced screen. = Gry 3DS rysują drugi obraz dla efektu 3D, dla prawego oka, którego PS4 nigdy nie pokazuje. Pominięcie go jest szybsze (Super Mario 3D Land rysuje wtedy o połowę mniej), ale kilka gier pokazuje czarny, zamrożony lub przesunięty ekran.


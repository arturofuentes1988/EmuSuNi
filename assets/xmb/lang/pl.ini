AI (xBRZ + Anime4K) = AI (xBRZ + Anime4K)
xBRZ, then a neural network (Anime4K) cleans every edge and curve: the smoothest HD look for SNES and NES. The N64 gets Smooth HD. = xBRZ, a potem sieć neuronowa (Anime4K) czyści każdą krawędź i krzywą: najgładszy wygląd HD dla SNES i NES. N64 dostaje Gładkie HD.
Smooth HD (AMD FSR) = Gładkie HD (AMD FSR)
AMD FidelityFX Super Resolution: smooth upscaling with sharp edges, made for 3D (the N64 at Native and 2x; at 4x it sharpens). = AMD FidelityFX Super Resolution: gładkie skalowanie z ostrymi krawędziami, stworzone dla 3D (N64 w Natywnej i 2x; w 4x tylko wyostrza).
HD Sharpen (AMD RCAS) = Wyostrzanie HD (AMD RCAS)
The picture as it is, made crisper by AMD's sharpening (RCAS): for the N64 at 4x and pictures already made bigger. = Obraz bez zmian, wyostrzony przez AMD (RCAS): dla N64 w 4x i obrazów już powiększonych.
Draws the picture with the GPU's filters at the TV's resolution. Pixel Art HD, AI and Smooth HD start from the console's own picture: Resolution and the Upscaling Filter are left out. = Rysuje obraz filtrami GPU w rozdzielczości telewizora. Pixel Art HD, AI i Gładkie HD zaczynają od własnego obrazu konsoli: Rozdzielczość i Filtr skalowania są pomijane.
N64 CPU Cores = Rdzenie CPU dla N64
Fixed = Stałe
Each N64 thread on a PS4 core of its own: the emulation on core 2, its graphics commands on core 3. = Każdy wątek N64 na własnym rdzeniu PS4: emulacja na rdzeniu 2, jej polecenia grafiki na rdzeniu 3.
PS4's Choice = Wybór PS4
The PS4 moves the threads between its cores, as before 00.27. = PS4 przenosi wątki między rdzeniami, jak przed 00.27.
Which PS4 cores run an N64 game's threads. Fixed gives the emulation and its graphics thread a core each, so they run at the same time. = Które rdzenie PS4 wykonują wątki gry N64. Stałe daje emulacji i jej wątkowi grafiki osobne rdzenie, więc działają jednocześnie.
N64 Frame Pacing = Tempo klatek N64
Even (V-Sync) = Równe (V-Sync)
Each refresh shows the frame the game should be at when the TV shows it: PAL's 50 frames come out even on the TV's 60, and a heavy frame doesn't make the next refresh jump two frames. = Każde odświeżenie pokazuje klatkę, na której gra powinna być, gdy telewizor ją wyświetla: 50 klatek PAL wychodzi równo na 60 Hz telewizora, a ciężka klatka nie powoduje skoku o dwie klatki przy następnym odświeżeniu.
By the Clock = Według zegara
By the time each pass of the emulator took, as 00.27: it catches up with two frames in one refresh. = Według czasu każdego przebiegu emulatora, jak w 00.27: nadrabia dwiema klatkami w jednym odświeżeniu.
How the N64's frames are spread over the TV's refreshes with V-Sync on. = Jak klatki N64 rozkładają się na odświeżenia telewizora przy włączonym V-Sync.

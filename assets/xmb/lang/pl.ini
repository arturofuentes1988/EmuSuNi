# --- EmuSuNi 00.23: local multiplayer (Multiplayer Adapter; a controller that comes or goes during a game)
Multiplayer Adapter = Adapter wielu graczy
Plugged in for the games known to use it (the emulator's own list, the game's header or the adapter's list of games); every other game has the console's two ports, as before. = Podłączony w grach, o których wiadomo, że go używają (własna lista emulatora, nagłówek gry lub lista gier adaptera); pozostałe gry mają dwa porty konsoli, jak dotąd.
Never plugged in: two players. = Nigdy niepodłączony: dwóch graczy.
Always plugged in, also for a game Auto doesn't know (a game made without it may not read the pads right). = Zawsze podłączony, także w grze, której Automatycznie nie zna (gra stworzona bez niego może źle odczytywać pady).
The adapter for 3 or more players each console had: the Super Multitap (Super Nintendo), the Four Score or the Famicom's 4 player adapter (NES), the Team Player or EA's 4 Way Play (Genesis), the Multitap (PlayStation), the 6 Player Adaptor (Saturn). Each player needs a DualShock 4 signed in to a PS4 user. = Adapter dla 3 lub więcej graczy, który miała każda konsola: Super Multitap (Super Nintendo), Four Score lub adapter 4 graczy Famicoma (NES), Team Player lub 4 Way Play od EA (Genesis), Multitap (PlayStation), 6 Player Adaptor (Saturn). Każdy gracz potrzebuje DualShock 4 zalogowanego na użytkownika PS4.
Controller {} connected: Player {} = Kontroler {} podłączony: gracz {}
Controller {} disconnected: Player {} = Kontroler {} odłączony: gracz {}

# --- EmuSuNi 00.23: voice chat (Settings -> Voice Chat, Test Microphone)
Voice Chat = Czat głosowy
Microphone = Mikrofon
Mic Volume = Głośność mikrofonu
Voices Volume = Głośność głosów
Test Microphone = Testuj mikrofon
Stop = Zatrzymaj
Open Mic = Otwarty mikrofon
Push to Talk: L3 = Naciśnij i mów: L3
Push to Talk: R3 = Naciśnij i mów: R3
Push to Talk: L2 = Naciśnij i mów: L2
Talk with your friends in online games: your microphone (a headset on the controller, a USB microphone or the PlayStation Camera) and their voices. = Rozmawiaj ze znajomymi w grach online: twój mikrofon (słuchawki z mikrofonem w kontrolerze, mikrofon USB lub PlayStation Camera) i ich głosy.
Your voice is sent whenever you talk; the room's noise is left out (a noise gate). = Twój głos jest wysyłany, gdy tylko mówisz; hałas z pokoju jest pomijany (bramka szumów).
Hold L3 (press the left stick) while you talk. No console's pad has it; on the DS it also blows into the DS's microphone. = Przytrzymaj L3 (wciśnij lewą gałkę), gdy mówisz. Żaden pad konsoli go nie ma; w DS dmucha też w mikrofon DS.
Hold R3 (press the right stick) while you talk. On the DS and the 3DS it also swaps the screens. = Przytrzymaj R3 (wciśnij prawą gałkę), gdy mówisz. W DS i 3DS zamienia też ekrany.
Hold L2 while you talk. A game that uses L2 (the N64's Z, the PlayStation's L2) gets it too. = Przytrzymaj L2, gdy mówisz. Gra, która używa L2 (Z w N64, L2 w PlayStation), też go otrzyma.
How loud your voice is sent. Test Microphone tells you whether to raise or lower it. = Jak głośno wysyłany jest twój głos. Testuj mikrofon podpowie, czy go zwiększyć, czy zmniejszyć.
How loud your friends' voices are, over the game's sound. = Jak głośno słychać głosy znajomych ponad dźwiękiem gry.
Records 5 seconds and plays them back as your friends will hear them, with a level meter: try it before playing online. = Nagrywa 5 sekund i odtwarza je tak, jak usłyszą je znajomi, ze wskaźnikiem poziomu: wypróbuj przed grą online.
Test Microphone: 5 seconds recorded, then played back. = Testuj mikrofon: nagranie 5 sekund, potem odtworzenie.
Recording: talk now ({} s) = Nagrywanie: mów teraz ({} s)
Recording: hold {} and talk ({} s) = Nagrywanie: przytrzymaj {} i mów ({} s)
Playing back what your friends will hear ({} s) = Odtwarzanie tego, co usłyszą znajomi ({} s)
Voice: {} dB = Głos: {} dB
No microphone found: plug a headset into the controller, or connect a USB microphone or the PlayStation Camera. = Nie znaleziono mikrofonu: podłącz słuchawki z mikrofonem do kontrolera albo mikrofon USB lub PlayStation Camera.
Only silence came from the microphone (loudest {} dB): is it plugged in, and not muted on the PS4 (Settings -> Devices -> Audio Devices)? = Z mikrofonu dochodziła tylko cisza (najgłośniej {} dB): czy jest podłączony i niewyciszony w PS4 (Ustawienia -> Urządzenia -> Urządzenia audio)?
The microphone works (loudest {} dB), but nothing was sent: hold {} while you talk. = Mikrofon działa (najgłośniej {} dB), ale nic nie wysłano: przytrzymaj {}, gdy mówisz.
Sound came (loudest {} dB), but not loud enough to be sent: raise Mic Volume, or talk closer to the microphone. = Dźwięk dotarł (najgłośniej {} dB), ale za cichy, by go wysłać: zwiększ Głośność mikrofonu lub mów bliżej mikrofonu.
Your voice was sent for {} s of 5 (loudest {} dB), but it clipped: lower Mic Volume. Played back as your friends will hear it. = Twój głos był wysyłany przez {} s z 5 (najgłośniej {} dB), ale przesterowany: zmniejsz Głośność mikrofonu. Odtwarzany tak, jak usłyszą go znajomi.
Your voice was sent for {} s of 5 (loudest {} dB), but quietly: raise Mic Volume. Played back as your friends will hear it. = Twój głos był wysyłany przez {} s z 5 (najgłośniej {} dB), ale cicho: zwiększ Głośność mikrofonu. Odtwarzany tak, jak usłyszą go znajomi.
Your voice was sent for {} s of 5 (loudest {} dB). Played back as your friends will hear it. = Twój głos był wysyłany przez {} s z 5 (najgłośniej {} dB). Odtwarzany tak, jak usłyszą go znajomi.

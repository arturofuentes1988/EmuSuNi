# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = Ustawia naraz obraz na dany poziom: rozdzielczość, skalowanie (CPU i GPU), rozmiar obrazu oraz rozmiar, synchronizację i 2D N64. Zmiana któregoś z nich przełącza na Własną. Gra pokazuje zmianę od razu, ale rozmiar i synchronizacja N64 zmieniają się przy następnym uruchomieniu gry. Dreamcast zawsze działa na Niskiej (PS4 nie da jeszcze rady więcej).
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = Wygładza poszarpane krawędzie 3D (multisampling, na GPU). Po zmianie w trakcie gry jej 3D jest przygotowywane od nowa: może się przycinać przez kilka sekund.

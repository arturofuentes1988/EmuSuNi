High (sharpest) = Wysoka (najostrzejsza)
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 2x; heavy N64 games can slow down. = Najostrzejsza: SNES i NES w 6x (xBRZ), N64 w 2x; ciężkie gry N64 mogą zwalniać.

Redraws the game bigger with the Upscaling Filter (Graphics) before it is fitted to the TV: 3x for 720p, 5x for 1080p. Uses CPU time: lower it if a game slows down. = Rysuje grę w większym rozmiarze Filtrem skalowania (Grafika), zanim zostanie dopasowana do telewizora: 3x dla 720p, 5x dla 1080p. Obciąża CPU: zmniejsz, jeśli gra zwalnia.
How Resolution redraws the pixels: xBRZ and HQx round the edges for an HD look; Sharp Pixels keeps them square. HQx goes up to 4x. = Jak Rozdzielczość rysuje piksele: xBRZ i HQx zaokrąglają krawędzie dla wyglądu HD; Ostre piksele zostawiają je kwadratowe. HQx sięga do 4x.
Sharp keeps the pixels crisp; Smooth softens them. Above Native resolution the picture is always smooth. = Ostre zachowuje wyraźne piksele; Gładkie je zmiękcza. Powyżej rozdzielczości natywnej obraz jest zawsze gładki.

# --- EmuSuNi 00.91: Send Log (the logs to EmuSuNi's server)
Send Log = Wyślij dziennik
Log Sent = Dziennik wysłany
Send = Wyślij
Try Again = Spróbuj ponownie
Nothing is sent. = Nic nie jest wysyłane.

# --- 00.68: the N64 (Graphics Sync for Cruis'n USA and Resident Evil 2, Ultra's 2D Exact)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA and Resident Evil 2 play Accurate anyway (with Fast they stay on a black screen). = GPU rysuje, gdy N64 działa dalej: dużo płynniej na PS4. Cruis'n USA i Resident Evil 2 i tak używają opcji Dokładna (przy opcji Szybka zostają na czarnym ekranie).
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens), or a game that goes black with Fast. = N64 czeka na każdy obraz: wolniej. Dla nielicznych gier, których efekty odczytują ekran (zdjęcia z aparatu, niektóre ekrany pauzy), lub gry, która przy opcji Szybka robi się czarna.
Text, icons and 2D backgrounds at the N64 Resolution: smoother, but many games show lines or squares where their pieces meet (Zelda's pre-drawn rooms, ISS 64's intro). = Teksty, ikony i tła 2D w Rozdzielczości N64: gładsze, ale wiele gier pokazuje linie lub kwadraty tam, gdzie łączą się ich elementy (gotowe pomieszczenia w Zelda, intro ISS 64).
4x (960p) with Natural AI. The size changes at the next start. = 4x (960p) z Naturalnym AI. Rozmiar zmienia się przy następnym uruchomieniu.


What it is = Co to jest
RetroAchievements (retroachievements.org) adds achievements to classic games: goals inside each game - beat a boss, find a secret, finish a level fast - unlocked as you play, each with its points. It's free, made by its players. = RetroAchievements (retroachievements.org) dodaje osiągnięcia do klasycznych gier: cele w każdej grze - pokonaj bossa, znajdź sekret, szybko przejdź poziom - odblokowywane podczas gry, każdy z punktami. Jest bezpłatne i tworzone przez graczy.
1. A free account = 1. Bezpłatne konto
Make one at retroachievements.org, on a phone or a computer, and confirm the e-mail it sends you: until then it refuses the login. = Załóż je na retroachievements.org, na telefonie lub komputerze, i potwierdź otrzymany e-mail: do tego czasu logowanie jest odrzucane.
2. Log in here = 2. Zaloguj się tutaj
Settings -> RetroAchievements -> Log In: the keyboard asks for your user name, then your password. EmuSuNi keeps only the key the site gives back (never the password) and logs in again by itself at each start. = Ustawienia -> RetroAchievements -> Zaloguj: klawiatura prosi o nazwę użytkownika, potem o hasło. EmuSuNi zachowuje tylko klucz zwrócony przez stronę (nigdy hasła) i sam loguje się przy każdym uruchomieniu.
3. Play = 3. Graj
A game with achievements says so when it starts; each unlock shows a picture. The in-game menu's Achievements lists them with your progress; My Achievements keeps what you unlocked; Triangle -> Achievements on a game shows them all. = Gra z osiągnięciami informuje o tym na starcie; każde odblokowanie pokazuje obrazek. Osiągnięcia w menu w grze pokazują je z twoim postępem; Moje osiągnięcia przechowują to, co odblokowano; Trójkąt -> Osiągnięcia na grze pokazuje wszystkie.
Casual and points = Casual i punkty
EmuSuNi plays in RetroAchievements' Casual mode: save states, cheats and any speed are allowed, and the points go to your account. (Its Hardcore mode waits until RetroAchievements approves EmuSuNi.) = EmuSuNi działa w trybie Casual RetroAchievements: dozwolone są zapisane stany, kody i dowolna szybkość, a punkty trafiają na twoje konto. (Tryb Hardcore poczeka, aż RetroAchievements zatwierdzi EmuSuNi.)
The consoles = Konsole
With achievements: {}. Not yet: Nintendo 3DS. = Z osiągnięciami: {}. Jeszcze nie: Nintendo 3DS.
Which files = Jakie pliki
RetroAchievements knows certain files of each game - most often the usual dumps of its American, European or Japanese version (No-Intro's for cartridges, Redump's for discs); not translations or hacks. The "RA" mark on a cover says the file is known; Triangle -> Achievements on a game without it shows the files it knows. = RetroAchievements zna określone pliki każdej gry - najczęściej typowe zrzuty jej wersji amerykańskiej, europejskiej lub japońskiej (z No-Intro dla kartridży, z Redump dla płyt); nie tłumaczenia ani hacki. Znak "RA" na okładce oznacza, że plik jest znany; Trójkąt -> Osiągnięcia na grze bez niego pokazuje znane pliki.
Without a connection = Bez połączenia
The game plays as always. Unlocks made offline wait and are sent when the connection comes back, while EmuSuNi stays open; My Achievements shows what this PS4 kept. = Gra działa jak zawsze. Odblokowania bez połączenia czekają i zostaną wysłane po jego powrocie, dopóki EmuSuNi jest otwarty; Moje osiągnięcia pokazują to, co zachowała ta PS4.
RetroAchievements: every achievement of the game, unlocked or not, with your progress; for a file it doesn't know, the files of the game it knows. = RetroAchievements: wszystkie osiągnięcia gry, odblokowane lub nie, z twoim postępem; dla nieznanego pliku - pliki gry, które zna.
Not logged in: its achievements show here once you log in (Settings -> RetroAchievements -> Log In) = Nie zalogowano: jej osiągnięcia pojawią się tu po zalogowaniu (Ustawienia -> RetroAchievements -> Zaloguj)
RetroAchievements knows this file, "{}", as a version of "{}" whose achievements don't work with it. = RetroAchievements zna ten plik, "{}", jako wersję "{}", z którą jej osiągnięcia nie działają.
RetroAchievements doesn't know this file: "{}". = RetroAchievements nie zna tego pliku: "{}".
It has no achievements for a game of that name on this console. = Nie ma osiągnięć dla gry o tej nazwie na tej konsoli.
"{}" has {} achievements with these files: = Osiągnięcia gry "{}" ({}) działają z tymi plikami:
{} files; their names aren't known here: retroachievements.org lists them (the game's page -> Supported Game Files). = Pliki: {}; ich nazwy nie są tu znane: retroachievements.org je podaje (strona gry -> Supported Game Files).
And {} more, whose names aren't known here (retroachievements.org: the game's page -> Supported Game Files). = I jeszcze {}, których nazwy nie są tu znane (retroachievements.org: strona gry -> Supported Game Files).
In your games already (they have the "RA" mark): = Już wśród twoich gier (mają znak "RA"):
A file of one of those (the same dump: a translation or a hack isn't) gets the "RA" mark once it is with your games. = Plik jednej z nich (ten sam zrzut: tłumaczenie lub hack nim nie jest) dostaje znak "RA", gdy znajdzie się wśród twoich gier.
A file's name in No-Intro's list (the usual dump): the same file, renamed as you like, works. = Nazwa pliku z listy No-Intro (typowy zrzut): ten sam plik działa pod dowolną nazwą.
One of your files RetroAchievements has achievements for: start it from your games. = Jeden z twoich plików z osiągnięciami w RetroAchievements: uruchom go z listy gier.


# --- EmuSuNi 00.30: GoldenEye 007 smoother
N64 CPU Timing = Tempo CPU N64
Light for GoldenEye 007; Normal for the other games. = Lekkie dla GoldenEye 007; Normalne dla pozostałych gier.

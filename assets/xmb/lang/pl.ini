The picture's shape on the TV. 4:3 is how the consoles looked on a TV. = Kształt obrazu na telewizorze. W 4:3 konsole wyglądały na telewizorze.
Fit to Screen = Dopasuj do ekranu
Integer Scale (sharpest) = Skala całkowita (najostrzejsza)
How big the picture is drawn. Integer Scale keeps every pixel the same size (no uneven rows). = Wielkość rysowanego obrazu. Skala całkowita zachowuje jednakowy rozmiar każdego piksela (bez nierównych rzędów).
Zooms in a little to fill more of the TV (the edges are cut). = Lekko powiększa, aby wypełnić więcej ekranu telewizora (krawędzie są przycinane).
Crop Overscan = Przytnij overscan
Hides the lines at the top and bottom that TVs hid (224 lines are shown). = Ukrywa linie na górze i na dole, które telewizory ukrywały (widać 224 linie).
Auto (game speed) = Automatycznie (szybkość gry)
Auto runs NTSC games at 60 and PAL games at 50 frames per second, as on the console. = Automatycznie: gry NTSC działają w 60, a PAL w 50 klatkach na sekundę, jak na konsoli.
Waits for the TV's refresh (no tearing). Off can lower the input delay a little. = Czeka na odświeżenie telewizora (bez rozrywania obrazu). Wył. może trochę zmniejszyć opóźnienie sterowania.
Sharp keeps the pixels crisp; Smooth softens them. = Ostre zachowuje wyraźne piksele; Gładkie je zmiękcza.
NTSC Filter = Filtr NTSC
Composite = Kompozytowy
Monochrome = Monochromatyczny
The look of an old TV cable (blargg's NTSC filter). Costs CPU time. = Wygląd starego kabla telewizyjnego (filtr NTSC blargga). Obciąża CPU.

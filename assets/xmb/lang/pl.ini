As on a TV of the time: a little wider than the console's own pixels. = Jak na ówczesnym telewizorze: nieco szerzej niż własne piksele konsoli.
Square pixels, exactly as the console draws them (a little narrower). = Kwadratowe piksele, dokładnie tak, jak rysuje je konsola (nieco węziej).
Stretched to a widescreen TV (everything looks wider). = Rozciągnięty na panoramiczny telewizor (wszystko wygląda szerzej).
Fills the whole screen, whatever its shape. = Wypełnia cały ekran, niezależnie od jego kształtu.
The console's own 256x224 picture, enlarged by the TV (the fastest). = Własny obraz konsoli 256x224, powiększany przez telewizor (najszybciej).
Redrawn at 512x448 before it is fitted to the TV. = Rysowany w 512x448 przed dopasowaniem do telewizora.
Redrawn at 768x672: for 720p TVs. = Rysowany w 768x672: dla telewizorów 720p.
Redrawn at 1024x896. = Rysowany w 1024x896.
Redrawn at 1280x1120: the closest to a 1080p (Full HD) TV. = Rysowany w 1280x1120: najbliżej telewizora 1080p (Full HD).
Redrawn at 1536x1344, then made smaller for the TV (a little smoother). = Rysowany w 1536x1344, potem zmniejszany dla telewizora (nieco gładszy).
As big as the TV allows. = Tak duży, jak pozwala telewizor.
The biggest whole multiple of the console's lines (4x on a 1080p TV): every pixel the same size, with a black border. = Największa całkowita wielokrotność linii konsoli (4x na telewizorze 1080p): każdy piksel tej samej wielkości, z czarną ramką.
Twice the console's size, small in the middle of the TV. = Dwa razy większy niż obraz konsoli, mały na środku telewizora.
Three times the console's size. = Trzy razy większy niż obraz konsoli.
Four times the console's size. = Cztery razy większy niż obraz konsoli.
The whole picture. = Cały obraz.
A little bigger: the edges are cut. = Nieco większy: krawędzie są przycinane.
Bigger: more of the edges are cut. = Większy: przycinana jest większa część krawędzi.
Much bigger: fills a widescreen TV more, the edges cut. = Dużo większy: lepiej wypełnia panoramiczny telewizor, krawędzie przycięte.
224 lines: the empty lines at the top and bottom are hidden. = 224 linie: puste linie na górze i na dole są ukryte.
Every line (some games show a black stripe or glitches at the edges). = Wszystkie linie (niektóre gry pokazują czarny pasek lub błędy przy krawędziach).
Hidden when the game doesn't draw on them. = Ukryte, gdy gra po nich nie rysuje.
NTSC games at 60 and PAL games at 50 frames per second. = Gry NTSC w 60, a gry PAL w 50 klatkach na sekundę.
Every game at 60 (PAL games run faster than on their console). = Każda gra w 60 (gry PAL działają szybciej niż na swojej konsoli).
Every game at 50 (NTSC games run slower). = Każda gra w 50 (gry NTSC działają wolniej).
As fast as the PS4 can (up to 4x). = Tak szybko, jak pozwala PS4 (do 4x).
Smooth movement, no tearing. = Płynny ruch, bez rozrywania obrazu.
A little less input delay; the picture may tear. = Nieco mniejsze opóźnienie sterowania; obraz może się rozrywać.
Rounded edges and clean lines: the most HD look. = Zaokrąglone krawędzie i czyste linie: wygląd najbardziej HD.
Softer edges, closer to the original pixels (up to 4x). = Łagodniejsze krawędzie, bliżej oryginalnych pikseli (do 4x).
Bigger square pixels: crisp and even, like the original. = Większe kwadratowe piksele: wyraźne i równe, jak w oryginale.
Every pixel crisp (at Native some pixels can look wider than others). = Każdy piksel wyraźny (przy Natywnej niektóre piksele mogą wyglądać na szersze od innych).
Soft, blended pixels. = Miękkie, zmieszane piksele.
A clean picture. = Czysty obraz.
The yellow video cable: colours bleed, soft details. = Żółty kabel wideo: rozlane kolory, miękkie szczegóły.
Sharper than composite, a little colour bleeding. = Ostrzejszy niż kompozytowy, kolory lekko się rozlewają.
The best cable of the time: sharp, clean colours. = Najlepszy kabel tamtych czasów: ostry obraz, czyste kolory.
The aerial cable: the blurriest, with noise. = Kabel antenowy: najbardziej rozmyty, z szumem.
A black and white TV. = Czarno-biały telewizor.
No lines. = Bez linii.
Faint lines. = Słabe linie.
Clear lines. = Wyraźne linie.
Dark lines, like an arcade monitor. = Ciemne linie, jak na monitorze automatu arcade.
The hi-res mode's columns as they are. = Kolumny trybu hi-res bez zmian.
Pairs of columns averaged: the see-through effects look as on a TV. = Uśrednione pary kolumn: przezroczystości wyglądają jak na telewizorze.
The columns softened. = Zmiękczone kolumny.
As the console: sprites flicker when too many share a line. = Jak konsola: sprite'y migoczą, gdy zbyt wiele jest w jednej linii.
More sprites per line than the console could: less flicker (a few games glitch). = Więcej sprite'ów na linię, niż mogła konsola: mniej migotania (kilka gier ma błędy).
Water, shadows and fades as on the console. = Woda, cienie i przejścia jak na konsoli.
No colour math (to find graphic glitches). = Bez mieszania kolorów (do szukania błędów grafiki).
The console's own speed. = Własna szybkość konsoli.
A little faster: less slowdown, safe in most games. = Nieco szybciej: mniej spowolnień, bezpieczne w większości gier.
Faster: removes most slowdown; some games glitch. = Szybciej: usuwa większość spowolnień; niektóre gry mają błędy.
Much faster; more games glitch. = Dużo szybciej; więcej gier ma błędy.
The chip's own speed. = Własna szybkość układu.
A faster chip: smoother 3D. = Szybszy układ: płynniejsze 3D.
Twice as fast: much smoother 3D. = Dwa razy szybciej: dużo płynniejsze 3D.
Three times as fast (some scenes may run too fast). = Trzy razy szybciej (niektóre sceny mogą działać zbyt szybko).
Four times as fast (some scenes may run too fast). = Cztery razy szybciej (niektóre sceny mogą działać zbyt szybko).
R2 does nothing in the game. = R2 nic nie robi w grze.
Every frame drawn. = Rysowana jest każda klatka.
Skips drawing a frame only when the PS4 falls behind. = Pomija klatkę tylko wtedy, gdy PS4 nie nadąża.
Draws every other frame. = Rysuje co drugą klatkę.
Draws one frame in three. = Rysuje jedną klatkę na trzy.
As the game's own cartridge. = Jak w kartridżu gry.
As an American or Japanese console. = Jak konsola amerykańska lub japońska.
As a European console: the game and its music run slower. = Jak konsola europejska: gra i jej muzyka działają wolniej.
As the console. = Jak konsola.
For hacks and translations that need it. = Dla hacków i tłumaczeń, które tego wymagają.
The console's own sound filter: warm, a little muffled. = Własny filtr dźwięku konsoli: ciepły, nieco stłumiony.
Crisper high notes. = Czystsze wysokie tony.
The crispest and cleanest (more CPU time). = Najczystszy i najwyraźniejszy dźwięk (bardziej obciąża CPU).
Simple, a little harsh. = Prosty, nieco szorstki.
The raw samples: sharp and noisy. = Surowe próbki: ostry dźwięk z szumem.
The usual balance. = Zwykła równowaga.
Less delay; may crackle when the PS4 is busy. = Mniejsze opóźnienie; może trzeszczeć, gdy PS4 jest zajęta.
Smoother sound in heavy games, a little more delay. = Płynniejszy dźwięk w wymagających grach, nieco większe opóźnienie.
The smoothest sound, the most delay. = Najpłynniejszy dźwięk, największe opóźnienie.
Two players. = Dwóch graczy.
Up to five players with more DualShock 4s. = Do pięciu graczy z dodatkowymi kontrolerami DualShock 4.
Each start begins from the game's own start (or its battery save). = Każde uruchomienie zaczyna od początku gry (lub od jej zapisu z baterii).
Quit Game keeps the moment you left; the next start goes on from there. = Opcja Wyjdź z gry zapamiętuje moment wyjścia; następne uruchomienie wznawia grę od tego miejsca.

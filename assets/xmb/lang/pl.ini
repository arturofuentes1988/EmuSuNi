# --- EmuSuNi 00.70: the 3DS CPU Clock's texts (a lower clock seldom saves the PS4 any work)
The game sees a slower 3DS. Less work for the PS4 only in a game that keeps the processor busy without a break; most wait for their next picture and cost the same. = Gra widzi wolniejszą 3DS. Mniej pracy dla PS4 tylko w grze, która zajmuje procesor bez przerwy; większość czeka na kolejny obraz i kosztuje tyle samo.
The game sees a 3DS at half speed: a game that needs the speed slows down or stutters. = Gra widzi 3DS z połową szybkości: gra, która potrzebuje szybkości, zwalnia lub się przycina.
How fast the emulated 3DS's processor runs. Most games wait for their next picture, so a lower clock seldom saves the PS4 any work (none in the games tried); a game that needs the speed slows down or freezes. = Jak szybko działa procesor emulowanej 3DS. Większość gier czeka na kolejny obraz, więc niższy zegar rzadko oszczędza PS4 pracę (w testowanych grach wcale); gra, która potrzebuje szybkości, zwalnia lub się zawiesza.

# --- EmuSuNi 00.71: the 3DS's Quality levels (3DS Resolution 1x to 4x on its pages, the GPU Upscaler's steps)
Each console's own resolution (the N64, the PlayStation, the PSP, the DS, the 3DS and the Dreamcast at 1x), no upscaler and no filters. = Własna rozdzielczość każdej konsoli (N64, PlayStation, PSP, DS, 3DS i Dreamcast w 1x), bez skalowania i bez filtrów.
Smooth Edges; the N64, the PlayStation, the PSP, the 3DS and the Dreamcast at 2x. = Gładkie krawędzie; N64, PlayStation, PSP, 3DS i Dreamcast w 2x.
Pixel Art HD (the 3D consoles: Smooth Edges); the N64 at 4x, the PlayStation, the PSP, the 3DS and the Dreamcast at 3x. = Pixel Art HD (konsole 3D: Gładkie krawędzie); N64 w 4x, PlayStation, PSP, 3DS i Dreamcast w 3x.
AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation, the PSP and the 3DS at 4x, the Dreamcast at 3x with the sharpest textures. = AI (konsole 3D: wyostrzone, Naturalne HD); N64, PlayStation, PSP i 3DS w 4x, Dreamcast w 3x z najostrzejszymi teksturami.
Twice the size (800x480): sharper 3D. = Podwójny rozmiar (800x480): ostrzejsze 3D.
Three times (1200x720): sharper 3D still. = Trzy razy (1200x720): jeszcze ostrzejsze 3D.
Four times (1600x960, about Full HD): the sharpest 3D. = Cztery razy (1600x960, około Full HD): najostrzejsze 3D.
The size the GPU draws 3DS games at: real HD 3D, not an enlarged picture. A bigger size is more work for the GPU only, but a game that reads its picture back (a few do, for effects) waits for it and can slow down. = Rozmiar, w jakim GPU rysuje gry 3DS: prawdziwe 3D w HD, a nie powiększony obraz. Większy rozmiar to więcej pracy tylko dla GPU, ale gra, która odczytuje swój obraz z powrotem (robi to kilka gier, dla efektów), czeka na niego i może zwolnić.
The console's own resolution (400x240 and 320x240), with no filters: the lightest. The size changes at the next start. = Własna rozdzielczość konsoli (400x240 i 320x240), bez filtrów: najlżej. Rozmiar zmienia się przy następnym uruchomieniu.
2x (800x480) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 2x (800x480) z Gładkimi krawędziami. Rozmiar zmienia się przy następnym uruchomieniu; gra, która odczytuje swój obraz, może zwolnić.
3x (1200x720) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 3x (1200x720) z Gładkimi krawędziami. Rozmiar zmienia się przy następnym uruchomieniu; gra, która odczytuje swój obraz, może zwolnić.
4x (1600x960), made crisper by AMD's sharpening (Natural HD). The size changes at the next start; a game that reads its picture back can slow down. = 4x (1600x960), wyostrzony przez AMD (Naturalne HD). Rozmiar zmienia się przy następnym uruchomieniu; gra, która odczytuje swój obraz, może zwolnić.

# --- EmuSuNi 00.72: the N64 (Ogre Battle 64 plays with N64 Graphics Sync Accurate too)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA, Resident Evil 2 and Ogre Battle 64 play Accurate anyway (with Fast the first two stay on a black screen and Ogre Battle's backgrounds break). = GPU rysuje, gdy N64 działa dalej: dużo płynniej na PS4. Cruis'n USA, Resident Evil 2 i Ogre Battle 64 i tak używają opcji Dokładna (przy opcji Szybka dwie pierwsze zostają na czarnym ekranie, a tła Ogre Battle się psują).


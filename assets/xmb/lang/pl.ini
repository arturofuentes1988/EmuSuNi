Light (as the N64) = Lekkie (jak N64)
The N64's processor a little slower against its clock: a game that drew few frames on the console draws about as few, and the PS4 has much less to do (GoldenEye: about a third less). The game keeps its speed; loading takes longer. = Procesor N64 nieco wolniejszy względem swojego zegara: gra, która rysowała mało klatek na konsoli, rysuje ich mniej więcej tyle samo, a PS4 ma dużo mniej pracy (GoldenEye: około jednej trzeciej mniej). Gra zachowuje szybkość; wczytywanie trwa dłużej.

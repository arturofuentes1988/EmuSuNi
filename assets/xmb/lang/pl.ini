On the big screen's right, in the bottom corner. = Po prawej od dużego ekranu, w dolnym rogu.
On the big screen's right, in the top corner. = Po prawej od dużego ekranu, w górnym rogu.
Beside the big screen, on its left, in the middle. = Obok dużego ekranu, po jego lewej, na środku.
On the big screen's left, in the bottom corner. = Po lewej od dużego ekranu, w dolnym rogu.
On the big screen's left, in the top corner. = Po lewej od dużego ekranu, w górnym rogu.

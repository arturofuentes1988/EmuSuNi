How sharp the textures of far, slanted surfaces stay (anisotropic filtering, on the GPU). It changes at the next game start. = Jak ostre pozostają tekstury dalekich, ukośnych powierzchni (filtrowanie anizotropowe, na GPU). Zmienia się przy następnym uruchomieniu gry.

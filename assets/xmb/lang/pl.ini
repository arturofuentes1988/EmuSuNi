Export = Eksport
Taiwan = Tajwan
The American board: English. = Płyta amerykańska: angielski.
The board sold outside Japan and the USA: English. = Płyta sprzedawana poza Japonią i USA: angielski.
The Japanese board: Japanese text where the game has it. = Płyta japońska: japońskie teksty, gdzie gra je ma.
The region of the NAOMI board the games run on (its BIOS, in naomi.zip). A game made only for another region runs on that one. = Region płyty NAOMI, na której działają gry (jej BIOS, w naomi.zip). Gra stworzona tylko dla innego regionu działa na tamtym.
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast, the NAOMI and the Atomiswave always play at Low (the PS4 can't do more yet). = Ustawia naraz obraz na dany poziom: rozdzielczość, skalowanie (CPU i GPU), rozmiar obrazu oraz rozmiar, synchronizację i 2D N64. Zmiana któregoś z nich przełącza na Własną. Gra pokazuje zmianę od razu, ale rozmiar i synchronizacja N64 zmieniają się przy następnym uruchomieniu gry. Dreamcast, NAOMI i Atomiswave zawsze działają na Niskiej (PS4 nie da jeszcze rady więcej).
How fast the emulated Dreamcast's processor runs (the NAOMI's and the Atomiswave's is the same one). Lower is lighter for the PS4, but some games then slow down. = Jak szybko działa procesor emulowanej Dreamcast (NAOMI i Atomiswave mają ten sam). Niżej to lżej dla PS4, ale niektóre gry wtedy zwalniają.
The Dreamcast's sound effects processor (DSP; the NAOMI and the Atomiswave have it too). Some games' echo and reverb need it; Off is lighter for the PS4. = Procesor efektów dźwiękowych Dreamcast (DSP; NAOMI i Atomiswave też go mają). Echo i pogłos niektórych gier go wymagają; Wył. to mniej pracy dla PS4.
NAOMI: Low quality only = NAOMI: tylko jakość Niska
Atomiswave: Low quality only = Atomiswave: tylko jakość Niska
Gun Reload = Przeładowanie broni
Arcade Button = Przycisk arcade
Press = Naciśnij
The arcade board's emulator takes no cheat codes = Emulator płyty arcade nie obsługuje kodów
Cross presses TEST (the operator menu: coins, difficulty, the game's settings) or SERVICE back in the game; the menu opens on this line again. Left / Right: TEST or SERVICE. In the operator menu SERVICE goes down a line, TEST chooses it. = Krzyżyk naciska TEST (menu operatora: monety, poziom trudności, ustawienia gry) lub SERVICE już w grze; menu znów otwiera się na tej linii. Lewo / Prawo: TEST lub SERVICE. W menu operatora SERVICE przechodzi linię niżej, a TEST ją wybiera.
Touchpad: Coin. Options: Start. TEST and SERVICE: Arcade Button in the L3+R3 menu. = Panel dotykowy: moneta. Opcje: Start. TEST i SERVICE: Przycisk arcade w menu L3+R3.
Cross: press a new button. Left: none. TEST opens the board's operator menu (coins, difficulty, the game's settings); the Arcade Button of the L3+R3 menu presses it too. = Krzyżyk: naciśnij nowy przycisk. Lewo: brak. TEST otwiera menu operatora płyty (monety, poziom trudności, ustawienia gry); naciska go też Przycisk arcade z menu L3+R3.
Cross: press a new button. Left: none. SERVICE gives a credit; in the operator menu it moves to the next line (TEST chooses it). = Krzyżyk: naciśnij nowy przycisk. Lewo: brak. SERVICE daje kredyt; w menu operatora przechodzi do następnej linii (TEST ją wybiera).
Cross: press a new button. Left: none. A light gun game's reload (the gun shot off the screen); the left stick aims. = Krzyżyk: naciśnij nowy przycisk. Lewo: brak. Przeładowanie w grze z pistoletem świetlnym (strzał poza ekran); lewa gałka celuje.
D-Pad: Left/Right to choose. A game with a wheel, a flight stick or a gun has that on the left stick, not the D-pad (unless Left Stick is chosen). = Krzyżak: Lewo/Prawo, aby wybrać. Gra z kierownicą, drążkiem lotniczym lub pistoletem ma go na lewej gałce, nie na krzyżaku (chyba że wybrano Lewa gałka).
Cross: press a new button. Left: none. Fighting games: punches 1, 2, 3, kicks 4, 5, 6 (as on a cabinet: punches on Square, Triangle, R1, kicks on Cross, Circle, R2). = Krzyżyk: naciśnij nowy przycisk. Lewo: brak. Bijatyki: ciosy 1, 2, 3, kopnięcia 4, 5, 6 (jak na automacie: ciosy na Kwadracie, Trójkącie, R1, kopnięcia na Krzyżyku, Kółku, R2).
Cross: press a new button. Left: none. Fighting games: punches 1 and 2, kicks 4 and 5, 3 their special move. = Krzyżyk: naciśnij nowy przycisk. Lewo: brak. Bijatyki: ciosy 1 i 2, kopnięcia 4 i 5, 3 to ruch specjalny.
Nintendo's consoles, then Sony's, then Sega's, each from the most basic to the most powerful, then the arcade boards: the Arcade, the NAOMI and the Atomiswave. = Konsole Nintendo, potem Sony, potem Sega, w każdej grupie od najprostszej do najmocniejszej, a potem płyty arcade: Arcade, NAOMI i Atomiswave.
From the most basic console to the most powerful, whoever made it (the Arcade's boards, from the 1970s to the 2000s, after the Dreamcast, then the NAOMI and the Atomiswave; the Nintendo 3DS last). = Od najprostszej konsoli do najmocniejszej, bez względu na producenta (płyty Arcade, od lat 70. do 2000., po Dreamcast, potem NAOMI i Atomiswave; Nintendo 3DS na końcu).
In the order they came out in Japan: NES and SG-1000 1983, Master System 1985, Mega Drive 1988, Game Boy 1989, Game Gear, the Arcade (by the Neo Geo) and Super Nintendo 1990, PlayStation 1994, Nintendo 64 1996, Game Boy Color, Dreamcast and NAOMI 1998, Game Boy Advance 2001, Atomiswave 2003, Nintendo DS and PSP 2004, Nintendo 3DS 2011. = W kolejności premier w Japonii: NES i SG-1000 1983, Master System 1985, Mega Drive 1988, Game Boy 1989, Game Gear, Arcade (według Neo Geo) i Super Nintendo 1990, PlayStation 1994, Nintendo 64 1996, Game Boy Color, Dreamcast i NAOMI 1998, Game Boy Advance 2001, Atomiswave 2003, Nintendo DS i PSP 2004, Nintendo 3DS 2011.

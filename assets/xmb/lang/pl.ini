# --- EmuSuNi 00.80: the DS's and the 3DS's screens, one set of settings (Screen Layout, Swap Screens, Small Screen Size and Position, Gap Between Screens)
Screen Layout = Układ ekranów
The top screen over the touch screen, as on the console. = Górny ekran nad dotykowym, jak w konsoli.
The two screens next to each other, the top screen on the left. = Oba ekrany obok siebie, górny po lewej.
Large Screen + Small = Duży ekran + mały
The top screen big, the touch screen small beside it or in a corner: Small Screen Size and Small Screen Position say how. = Górny ekran duży, a dotykowy mały obok niego lub w rogu: Rozmiar małego ekranu i Pozycja małego ekranu określają jak.
Only the top screen, as big as the TV allows. The touchpad still touches the touch screen, unseen. = Tylko górny ekran, tak duży, jak pozwala telewizor. Panel dotykowy nadal dotyka ekranu dotykowego, choć go nie widać.
Only the touch screen, as big as the TV allows. = Tylko ekran dotykowy, tak duży, jak pozwala telewizor.
How the two screens are shown. Swap Screens (or R3 in the game) trades their places. The DualShock 4's touchpad is always the touch screen, wherever it is. = Jak są pokazane oba ekrany. Zamień ekrany (lub R3 w grze) zamienia je miejscami. Panel dotykowy DualShock 4 to zawsze ekran dotykowy, gdziekolwiek jest.
The top screen first: above, on the left or big. = Najpierw górny ekran: u góry, po lewej lub duży.
The touch screen first: above, on the left or big (with one screen only, the other one is shown). = Najpierw ekran dotykowy: u góry, po lewej lub duży (przy jednym ekranie pokazywany jest ten drugi).
Trades the two screens' places. R3 swaps them in the game too, for as long as it runs. = Zamienia ekrany miejscami. R3 zamienia je też w grze, dopóki ona trwa.
Small Screen Size = Rozmiar małego ekranu
Half (1/2) = Połowa (1/2)

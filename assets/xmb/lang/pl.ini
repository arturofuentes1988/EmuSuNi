# --- 00.68: the Dreamcast's Quality levels
Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the Dreamcast at 1x), no upscaler and no filters. = Własna rozdzielczość każdej konsoli (N64, PlayStation, PSP, DS i Dreamcast w 1x), bez skalowania i bez filtrów.

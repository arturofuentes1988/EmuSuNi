# --- EmuSuNi 00.63: Controls from Settings, a game and the in-game menu; Fast Forward's button; Quality for every console
Each console's buttons on the DualShock 4 = Przyciski każdej konsoli na DualShock 4
Which DualShock 4 button does what, for this console's games or only this one: back in the game they apply. = Co robi każdy przycisk DualShock 4, dla gier tej konsoli lub tylko tej gry: zmiany działają po powrocie do gry.
Press a button... = Naciśnij przycisk...
Controls for this game only = Sterowanie tylko dla tej gry
This game uses this console's controls = Ta gra używa sterowania tej konsoli
Controls back to the default = Przywrócono domyślne sterowanie
Left / Right: which DualShock 4 controls move it. = Lewo / Prawo: które elementy DualShock 4 nim sterują.
No button pressed: nothing changed = Nie naciśnięto przycisku: nic nie zmieniono
CONTROLS - THIS GAME = STEROWANIE - TA GRA
CONTROLS - ALL GAMES = STEROWANIE - WSZYSTKIE GRY
Speed while the Fast Forward button is held. Each console has its own button: see it in Controls. = Szybkość, gdy trzymasz przycisk przyspieszenia. Każda konsola ma własny przycisk: sprawdź go w Sterowaniu.
Speed while {} is held (change the button in Controls). = Szybkość, gdy trzymasz {} (zmień przycisk w Sterowaniu).
the touchpad = panel dotykowy
How fast the game runs while the Fast Forward button is held. No button does it on this console yet: choose one in Controls. = Jak szybko działa gra, gdy trzymasz przycisk przyspieszenia. Na tej konsoli żaden przycisk jeszcze tego nie robi: wybierz go w Sterowaniu.
How fast the game runs while the Fast Forward button is held. No button does it in this game's own controls yet: choose one in Controls. = Jak szybko działa gra, gdy trzymasz przycisk przyspieszenia. We własnym sterowaniu tej gry żaden przycisk jeszcze tego nie robi: wybierz go w Sterowaniu.
Cross: press a new button. Left: none. Held, the game runs faster (how fast: Fast Forward in the game's settings). A button the console uses too does both. = Krzyżyk: naciśnij nowy przycisk. Lewo: brak. Przytrzymany przyspiesza grę (o ile: Przyspieszenie w ustawieniach gry). Przycisk używany też przez konsolę robi obie rzeczy.
Dreamcast: Standard quality only = Dreamcast: tylko jakość Standardowa
NAOMI: Standard quality only = NAOMI: tylko jakość Standardowa
Atomiswave: Standard quality only = Atomiswave: tylko jakość Standardowa
3DS: no GPU filters yet = 3DS: na razie bez filtrów GPU
Your own choices (they match none of the four levels). = Twoje własne wybory (nie pasują do żadnego z czterech poziomów).
Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the 3DS at 1x), no upscaler and no filters. = Własna rozdzielczość każdej konsoli (N64, PlayStation, PSP, DS i 3DS w 1x), bez skalowania i bez filtrów.
Smooth Edges; the N64, the PlayStation, the PSP and the 3DS at 2x. = Gładkie krawędzie; N64, PlayStation, PSP i 3DS w 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP and the 3DS at 3x. = Naturalne HD; N64 i PlayStation w 4x, PSP i 3DS w 3x.
Natural AI; the N64, the PlayStation and the PSP at 4x, the 3DS at 3x. = Naturalne AI; N64, PlayStation i PSP w 4x, 3DS w 3x.
The picture in one choice: Low is the console's own; each level above is sharper and more work for the PS4. Changing one of its settings makes it Custom. = Obraz jednym wyborem: Niska to własny obraz konsoli; każdy wyższy poziom jest ostrzejszy i bardziej obciąża PS4. Zmiana któregoś z ustawień przełącza na Własną.
The console's own resolution: its picture as it made it, made bigger for the TV, with no filters. = Własna rozdzielczość konsoli: jej obraz taki, jak go tworzyła, powiększony dla telewizora, bez filtrów.
Smooth Edges: the GPU smooths the jagged edges; the pixels stay as they are. = Gładkie krawędzie: GPU wygładza poszarpane krawędzie; piksele zostają bez zmian.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR). = Naturalne HD: gładkie krawędzie, a potem ostry obraz HD w rozdzielczości telewizora (AMD FSR).
Natural AI: Natural HD with an AI network (Anime4K) that cleans every edge; the textures stay. = Naturalne AI: Naturalne HD z siecią AI (Anime4K), która czyści każdą krawędź; tekstury zostają.
The console's own resolution: both screens as the DS made them (256x192), with no filters. = Własna rozdzielczość konsoli: oba ekrany tak, jak tworzyła je DS (256x192), bez filtrów.
Smooth Edges on both screens: the GPU smooths the jagged edges. = Gładkie krawędzie na obu ekranach: GPU wygładza poszarpane krawędzie.
Natural HD on both screens: smooth edges, then a sharp HD picture (AMD FSR). = Naturalne HD na obu ekranach: gładkie krawędzie, a potem ostry obraz HD (AMD FSR).
Natural AI on both screens: Natural HD with an AI network (Anime4K) that cleans every edge. = Naturalne AI na obu ekranach: Naturalne HD z siecią AI (Anime4K), która czyści każdą krawędź.
The console's own resolution, with no filters: the lightest. The size changes at the next start. = Własna rozdzielczość konsoli, bez filtrów: najlżej. Rozmiar zmienia się przy następnym uruchomieniu.
2x (480p) with Smooth Edges. The size changes at the next start. = 2x (480p) z Gładkimi krawędziami. Rozmiar zmienia się przy następnym uruchomieniu.
4x (960p) with Natural HD. The size changes at the next start. = 4x (960p) z Naturalnym HD. Rozmiar zmienia się przy następnym uruchomieniu.
4x (960p) with Natural AI, and smooth HD text and icons. The size changes at the next start. = 4x (960p) z Naturalnym AI oraz gładkim tekstem i ikonami HD. Rozmiar zmienia się przy następnym uruchomieniu.
The console's own resolution (1x), its own textures and colours, with no filters. = Własna rozdzielczość konsoli (1x), jej własne tekstury i kolory, bez filtrów.
2x (480p), smooth textures (xBR) and true colour, with Smooth Edges. = 2x (480p), gładkie tekstury (xBR) i pełny kolor, z Gładkimi krawędziami.
4x (960p), smooth textures, true colour and steady 3D (PGXP), with Natural HD. = 4x (960p), gładkie tekstury, pełny kolor i stabilne 3D (PGXP), z Naturalnym HD.
4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA) and Natural AI. = 4x (960p), gładkie tekstury, stabilne 3D, antyaliasing 4x (MSAA) i Naturalne AI.
The console's own resolution (480x272), with no filters. = Własna rozdzielczość konsoli (480x272), bez filtrów.
2x (960x544), sharper textures far away, with Smooth Edges. = 2x (960x544), ostrzejsze tekstury w oddali, z Gładkimi krawędziami.
3x (1440x816), the sharpest textures far away, with Natural HD. = 3x (1440x816), najostrzejsze tekstury w oddali, z Naturalnym HD.
4x (1920x1088, Full HD), the sharpest textures far away, made crisper (Natural HD). = 4x (1920x1088, Full HD), najostrzejsze tekstury w oddali, wyraźniejsze (Naturalne HD).
The console's own resolution (400x240 and 320x240): the lightest. The size changes at the next start. = Własna rozdzielczość konsoli (400x240 i 320x240): najlżej. Rozmiar zmienia się przy następnym uruchomieniu.
2x (800x480): sharper 3D, more work for the GPU. The size changes at the next start. = 2x (800x480): ostrzejsze 3D, więcej pracy dla GPU. Rozmiar zmienia się przy następnym uruchomieniu.
3x (1200x720): the sharpest, for the lighter games. The size changes at the next start. = 3x (1200x720): najostrzej, dla lżejszych gier. Rozmiar zmienia się przy następnym uruchomieniu.
3x, as High: the most the 3DS has for now (no GPU filters for it yet). The size changes at the next start. = 3x, jak Wysoka: najwięcej, co na razie ma 3DS (jeszcze bez filtrów GPU). Rozmiar zmienia się przy następnym uruchomieniu.

# --- EmuSuNi 00.26: the N64's picture
N64 Anti-Aliasing = Antyaliasing N64
On (the N64's) = Wł. (z N64)
Smooth 3D edges, as the N64's video chip made them. = Gładkie krawędzie 3D, jak robił je układ wideo N64.
Jagged 3D edges, a little sharper: the picture before the N64's filter. = Poszarpane krawędzie 3D, nieco ostrzejsze: obraz przed filtrem N64.

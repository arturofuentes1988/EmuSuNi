# --- EmuSuNi 00.21: the N64's speed
N64 Graphics Sync = Synchronizacja grafiki N64
Fast (asynchronous) = Szybka (asynchroniczna)
The GPU draws while the N64 runs: much smoother on the PS4. = GPU rysuje, gdy N64 działa dalej: dużo płynniej na PS4.
Accurate (synchronous) = Dokładna (synchroniczna)
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens). = N64 czeka na każdy obraz: wolniej. Dla nielicznych gier, których efekty odczytują ekran (zdjęcia z aparatu, niektóre ekrany pauzy).
Whether the N64 waits for the GPU's pictures (ParaLLEl-RDP's Synchronous RDP). = Czy N64 czeka na obrazy GPU (Synchronous RDP z ParaLLEl-RDP).
The N64's own picture: the smoothest. = Własny obraz N64: najpłynniej.
Twice the size: sharper 3D; heavy scenes can slow down. = Podwójny rozmiar: ostrzejsze 3D; ciężkie sceny mogą zwalniać.
Four times: the sharpest; too heavy for most games on the PS4. = Cztery razy: najostrzej; za ciężkie dla większości gier na PS4.
The size the GPU draws N64 games at (ParaLLEl-RDP). Native is the smoothest. = Rozmiar, w jakim GPU rysuje gry N64 (ParaLLEl-RDP). Natywna jest najpłynniejsza.
Quality = Jakość
Custom Quality = Własna

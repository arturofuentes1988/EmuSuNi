The texture detail of far surfaces above Native resolution. = Szczegółowość tekstur dalekich powierzchni powyżej rozdzielczości natywnej.
N64 Screen Effects = Efekty ekranu N64
Blurs, pause screens and photos made from the game's own picture, at the N64's size. = Rozmycia, ekrany pauzy i zdjęcia tworzone z obrazu samej gry, w rozmiarze N64.
Smooth (SSAA) = Gładkie (SSAA)
Those effects made from the sharp picture: smoother; a few games glitch. = Te efekty tworzone z ostrego obrazu: gładsze; kilka gier ma błędy.
Effects some games make from their own picture (pause backgrounds, motion blur), above Native resolution. = Efekty, które niektóre gry tworzą z własnego obrazu (tła pauzy, rozmycie ruchu), powyżej rozdzielczości natywnej.
Four times (about Full HD): the sharpest; heavy games can slow down. = Cztery razy (około Full HD): najostrzej; ciężkie gry mogą zwalniać.
Sharper: SNES and NES redrawn at 3x (xBRZ); the N64 at 2x. = Ostrzejsza: SNES i NES rysowane w 3x (xBRZ); N64 w 2x.
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 4x; heavy N64 games can slow down. = Najostrzejsza: SNES i NES w 6x (xBRZ), N64 w 4x; ciężkie gry N64 mogą zwalniać.
# --- EmuSuNi 00.27: Ultra and the GPU's filters
Ultra (maximum) = Ultra (maksymalna)
The best each console can do: SNES and NES redrawn by the GPU with xBRZ and an AI network (Anime4K); the N64 at 4x with HD 2D, sharpened. Heavy N64 games can slow down. = Najlepsze, co potrafi każda konsola: SNES i NES rysowane przez GPU z xBRZ i siecią AI (Anime4K); N64 w 4x z 2D w HD, wyostrzona. Ciężkie gry N64 mogą zwalniać.
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = Ustawia naraz obraz na dany poziom: rozdzielczość, skalowanie (CPU i GPU), rozmiar obrazu oraz rozmiar, synchronizację i 2D N64. Zmiana któregoś z nich przełącza na Własną.

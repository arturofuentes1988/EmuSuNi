Turns this game's cheat codes on and off. = Włącza i wyłącza kody tej gry.
Which DualShock 4 button does what, for all games or only this one. = Co robi każdy przycisk DualShock 4, dla wszystkich gier lub tylko dla tej.
The game's file, size, region and when you last played it. = Plik gry, rozmiar, region i data ostatniej gry.
This game starts by itself when EmuSuNi opens (hold L1 to get the menu). = Ta gra uruchamia się sama po otwarciu EmuSuNi (przytrzymaj L1, aby zobaczyć menu).
EmuSuNi opens on the menu again. = EmuSuNi znów otwiera się w menu.

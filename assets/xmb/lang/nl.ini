Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = Stelt het beeld in één keer in op een niveau: resolutie, opschalen (CPU en GPU), beeldgrootte en de grootte, synchronisatie en 2D van de N64. Wijzig je er een, dan wordt het Aangepast.

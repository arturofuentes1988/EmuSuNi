# --- EmuSuNi 00.40: the GPU Upscaler's steps (Smooth Edges, Natural HD, Natural AI)
Smooth Edges: the GPU smooths the jagged edges and leaves the pixels and textures as they are; the N64, the PlayStation and the PSP at 2x. = Gladde randen: de GPU maakt de gekartelde randen glad en laat de pixels en texturen zoals ze zijn; de N64, de PlayStation en de PSP op 2x.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR) that still looks natural; the N64 and the PlayStation at 4x, the PSP at 3x. Heavy N64 games can slow down. = Natuurlijk HD: gladde randen, daarna een scherp HD-beeld op de resolutie van de tv (AMD FSR) dat er nog natuurlijk uitziet; de N64 en de PlayStation op 4x, de PSP op 3x. Zware N64-spellen kunnen vertragen.
The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP in Full HD with anti-aliasing. Heavy N64 games can slow down. = Het beste wat elke console kan: Natuurlijke AI, een AI-netwerk (Anime4K) dat elke rand strak maakt en de texturen behoudt (geen wasachtig uiterlijk); de N64 op 4x met HD-2D; de PlayStation op 4x met zachte texturen, stabiele 3D en anti-aliasing; de PSP in Full HD met anti-aliasing. Zware N64-spellen kunnen vertragen.
Smooth Edges = Gladde randen
Only the jagged edges are smoothed (anti-aliasing: MMPX and SMAA); colours, textures and the pixels' shapes stay as they are. Light on the GPU. Quality Medium uses it. = Alleen de gekartelde randen worden gladgemaakt (anti-aliasing: MMPX en SMAA); kleuren, texturen en de vorm van de pixels blijven zoals ze zijn. Licht voor de GPU. Kwaliteit Gemiddeld gebruikt het.
Natural HD = Natuurlijk HD
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. Quality High uses it. = Gladde randen, daarna in HD getekend op de resolutie van de tv en verscherpt (AMD FSR): duidelijk scherper, nog steeds natuurlijk, nooit geschilderd. Kwaliteit Hoog gebruikt het.
Natural AI = Natuurlijke AI
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. Quality Ultra uses it. = De strakke randen van Natuurlijk HD met een AI-netwerk (Anime4K) door het beeld gemengd, zodat texturen en dithering blijven: het zachtste uiterlijk zonder wasachtig effect. Kwaliteit Ultra gebruikt het.
AI (Anime4K) = AI (Anime4K)
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest, most painted HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ, daarna maakt een neuraal netwerk (Anime4K) op volle kracht elke rand en curve strak: het zachtste, meest geschilderde HD-uiterlijk voor SNES, NES en de Game Boys. De N64 krijgt Zacht HD.
Draws the picture with the GPU's filters at the TV's resolution. Every filter but HD Sharpen starts from the console's own picture: Resolution and the Upscaling Filter are left out. = Tekent het beeld met de filters van de GPU op de resolutie van de tv. Elk filter behalve HD-verscherping gaat uit van het eigen beeld van de console: Resolutie en het Opschaalfilter worden overgeslagen.

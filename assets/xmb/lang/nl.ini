# --- EmuSuNi 00.70: the 3DS CPU Clock's texts (a lower clock seldom saves the PS4 any work)
The game sees a slower 3DS. Less work for the PS4 only in a game that keeps the processor busy without a break; most wait for their next picture and cost the same. = Het spel ziet een tragere 3DS. Alleen minder werk voor de PS4 in een spel dat de processor zonder pauze bezighoudt; de meeste wachten op hun volgende beeld en kosten evenveel.
The game sees a 3DS at half speed: a game that needs the speed slows down or stutters. = Het spel ziet een 3DS op halve snelheid: een spel dat de snelheid nodig heeft, vertraagt of hapert.
How fast the emulated 3DS's processor runs. Most games wait for their next picture, so a lower clock seldom saves the PS4 any work (none in the games tried); a game that needs the speed slows down or freezes. = Hoe snel de processor van de geëmuleerde 3DS draait. De meeste spellen wachten op hun volgende beeld, dus een lagere klok bespaart de PS4 zelden werk (niets in de geteste spellen); een spel dat de snelheid nodig heeft, vertraagt of loopt vast.

# --- EmuSuNi 00.71: the 3DS's Quality levels (3DS Resolution 1x to 4x on its pages, the GPU Upscaler's steps)
Each console's own resolution (the N64, the PlayStation, the PSP, the DS, the 3DS and the Dreamcast at 1x), no upscaler and no filters. = De eigen resolutie van elke console (de N64, de PlayStation, de PSP, de DS, de 3DS en de Dreamcast op 1x), geen opschaler en geen filters.
Smooth Edges; the N64, the PlayStation, the PSP, the 3DS and the Dreamcast at 2x. = Gladde randen; de N64, de PlayStation, de PSP, de 3DS en de Dreamcast op 2x.
Pixel Art HD (the 3D consoles: Smooth Edges); the N64 at 4x, the PlayStation, the PSP, the 3DS and the Dreamcast at 3x. = Pixel Art HD (de 3D-consoles: Gladde randen); de N64 op 4x, de PlayStation, de PSP, de 3DS en de Dreamcast op 3x.
AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation, the PSP and the 3DS at 4x, the Dreamcast at 3x with the sharpest textures. = AI (de 3D-consoles: verscherpt, Natuurlijk HD); de N64, de PlayStation, de PSP en de 3DS op 4x, de Dreamcast op 3x met de scherpste texturen.
Twice the size (800x480): sharper 3D. = Dubbele grootte (800x480): scherpere 3D.
Three times (1200x720): sharper 3D still. = Drie keer (1200x720): nog scherpere 3D.
Four times (1600x960, about Full HD): the sharpest 3D. = Vier keer (1600x960, ongeveer Full HD): de scherpste 3D.
The size the GPU draws 3DS games at: real HD 3D, not an enlarged picture. A bigger size is more work for the GPU only, but a game that reads its picture back (a few do, for effects) waits for it and can slow down. = De grootte waarop de GPU 3DS-spellen tekent: echte HD-3D, geen vergroot beeld. Groter is alleen meer werk voor de GPU, maar een spel dat zijn beeld terugleest (een paar doen dat, voor effecten) wacht erop en kan vertragen.
The console's own resolution (400x240 and 320x240), with no filters: the lightest. The size changes at the next start. = De eigen resolutie van de console (400x240 en 320x240), zonder filters: het lichtst. De grootte verandert bij de volgende start.
2x (800x480) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 2x (800x480) met Gladde randen. De grootte verandert bij de volgende start; een spel dat zijn beeld terugleest, kan vertragen.
3x (1200x720) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 3x (1200x720) met Gladde randen. De grootte verandert bij de volgende start; een spel dat zijn beeld terugleest, kan vertragen.
4x (1600x960), made crisper by AMD's sharpening (Natural HD). The size changes at the next start; a game that reads its picture back can slow down. = 4x (1600x960), scherper gemaakt door de verscherping van AMD (Natuurlijk HD). De grootte verandert bij de volgende start; een spel dat zijn beeld terugleest, kan vertragen.

# --- EmuSuNi 00.72: the N64 (Ogre Battle 64 plays with N64 Graphics Sync Accurate too)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA, Resident Evil 2 and Ogre Battle 64 play Accurate anyway (with Fast the first two stay on a black screen and Ogre Battle's backgrounds break). = De GPU tekent terwijl de N64 doorloopt: veel vloeiender op de PS4. Cruis'n USA, Resident Evil 2 en Ogre Battle 64 spelen hoe dan ook op Nauwkeurig (met Snel blijven de eerste twee op een zwart scherm en gaan de achtergronden van Ogre Battle stuk).


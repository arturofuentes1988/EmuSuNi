60 FPS = 60 FPS
The smoothest; heavy fights slow the game down. = Het vloeiendst; zware gevechten vertragen het spel.
30 FPS = 30 FPS
Half the work (PPSSPP's hack for weak hardware): a steady full speed. = Half zoveel werk (de hack van PPSSPP voor zwakke hardware): een stabiele volle snelheid.

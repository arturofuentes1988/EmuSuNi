# --- EmuSuNi 00.81: the 3DS's graphics errors (Accurate Shader Multiplication and 3DS Right Eye, per game)
Accurate Shader Multiplication = Exacte shadervermenigvuldiging
On in the games known to need it (the Pokémon games from X and Y to Ultra Sun and Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Off in the others. = Aan in de spellen waarvan bekend is dat ze het nodig hebben (de Pokémon-spellen van X en Y tot Ultra Sun en Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Uit in de andere.
Multiplies in the shaders exactly as the 3DS does: models, lights and effects drawn right. A little more work for the GPU. = Vermenigvuldigt in de shaders precies zoals de 3DS: modellen, lichten en effecten correct getekend. Iets meer werk voor de GPU.
The faster multiplication: most games look the same with it. = De snellere vermenigvuldiging: de meeste spellen zien er hetzelfde uit.
How the GPU's shaders multiply: exactly as the 3DS does, or faster. Without it a few games draw white, too bright or black models and effects. (Ocarina of Time 3D and the Mario & Luigi games always use it.) = Hoe de shaders van de GPU vermenigvuldigen: precies zoals de 3DS, of sneller. Zonder deze optie tekenen enkele spellen witte, te felle of zwarte modellen en effecten. (Ocarina of Time 3D en de Mario & Luigi-spellen gebruiken het altijd.)
3DS Right Eye = 3DS-rechteroog
Not drawn, but drawn in the games known to need it (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition). = Niet getekend, behalve in de spellen waarvan bekend is dat ze het nodig hebben (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition).
Not Drawn (faster) = Niet getekend (sneller)
The PS4 shows no 3D, so the right eye's picture is left out: less work in the games that draw both eyes. = De PS4 toont geen 3D, dus het beeld van het rechteroog wordt weggelaten: minder werk in de spellen die beide ogen tekenen.
Drawn = Getekend
As on the 3DS: for a game whose screen stays black, freezes on an effect or is out of place. Slower in the games that draw both eyes. = Zoals op de 3DS: voor een spel waarvan het scherm zwart blijft, vastloopt op een effect of verschoven is. Trager in de spellen die beide ogen tekenen.
3DS games draw a second picture for the 3D effect, the right eye's, which the PS4 never shows. Leaving it out is faster (Super Mario 3D Land then draws half as much), but a few games show a black, frozen or misplaced screen. = 3DS-spellen tekenen een tweede beeld voor het 3D-effect, dat van het rechteroog, dat de PS4 nooit toont. Het weglaten is sneller (Super Mario 3D Land tekent dan de helft), maar enkele spellen tonen een zwart, bevroren of verschoven scherm.


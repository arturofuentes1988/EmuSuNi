Fixed = Vast
Each N64 thread on a PS4 core of its own: the emulation on core 2, its graphics commands on core 3. = Elke N64-thread op een eigen PS4-kern: de emulatie op kern 2, de grafische opdrachten op kern 3.
PS4's Choice = PS4 kiest
The PS4 moves the threads between its cores, as before 00.27. = De PS4 verplaatst de threads tussen zijn kernen, zoals vóór 00.27.
Which PS4 cores run an N64 game's threads. Fixed gives the emulation and its graphics thread a core each, so they run at the same time. = Welke PS4-kernen de threads van een N64-spel draaien. Vast geeft de emulatie en de grafische thread elk een kern, zodat ze tegelijk draaien.
N64 Frame Pacing = N64-beeldritme
Even (V-Sync) = Gelijkmatig (V-Sync)
Each refresh shows the frame the game should be at when the TV shows it: PAL's 50 frames come out even on the TV's 60, and a heavy frame doesn't make the next refresh jump two frames. = Elke verversing toont het beeld waar het spel moet zijn als de tv het toont: de 50 beelden van PAL komen gelijkmatig uit op de 60 van de tv, en een zwaar beeld laat de volgende verversing niet twee beelden verspringen.

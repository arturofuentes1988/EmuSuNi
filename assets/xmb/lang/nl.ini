The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP at 4x. Heavy N64 games can slow down. = Het beste wat elke console kan: Natuurlijke AI, een AI-netwerk (Anime4K) dat elke rand strak maakt en de texturen behoudt (geen wasachtig uiterlijk); de N64 op 4x met HD-2D; de PlayStation op 4x met zachte texturen, stabiele 3D en anti-aliasing; de PSP op 4x. Zware N64-spellen kunnen vertragen.

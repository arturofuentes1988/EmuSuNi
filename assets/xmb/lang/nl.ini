# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = Stelt het beeld in één keer in op een niveau: resolutie, opschalen (CPU en GPU), beeldgrootte en de grootte, synchronisatie en 2D van de N64. Wijzig je er een, dan wordt het Aangepast. Een spel toont de wijziging meteen, maar de grootte en synchronisatie van de N64 veranderen bij de volgende spelstart. De Dreamcast speelt altijd op Laag (de PS4 kan nog niet meer).
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = Maakt de gekartelde randen van de 3D glad (multisampling, op de GPU). Wijzig je dit tijdens het spelen, dan wordt de 3D opnieuw opgezet: het kan een paar seconden haperen.

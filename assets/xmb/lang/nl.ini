Which files = Welke bestanden
RetroAchievements knows certain files of each game - most often the usual dumps of its American, European or Japanese version (No-Intro's for cartridges, Redump's for discs); not translations or hacks. The "RA" mark on a cover says the file is known; Triangle -> Achievements on a game without it shows the files it knows. = RetroAchievements kent bepaalde bestanden van elk spel - meestal de gebruikelijke dumps van de Amerikaanse, Europese of Japanse versie (die van No-Intro voor cartridges, die van Redump voor discs); geen vertalingen of hacks. De markering "RA" op een hoesje betekent dat het bestand bekend is; Driehoek -> Achievements bij een spel zonder markering toont de bestanden die het kent.

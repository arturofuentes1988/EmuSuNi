Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. = Gladde randen, daarna in HD getekend op de resolutie van de tv en verscherpt (AMD FSR): duidelijk scherper, nog steeds natuurlijk, nooit geschilderd.
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. = De strakke randen van Natuurlijk HD met een AI-netwerk (Anime4K) door het beeld gemengd, zodat texturen en dithering blijven: het zachtste uiterlijk zonder wasachtig effect.
Pixel art redrawn by the GPU at the TV's resolution: rounded, clean edges without blur. Quality High uses it; a 3D picture drawn by the GPU gets Smooth Edges. = Pixel art door de GPU opnieuw getekend op de resolutie van de tv: ronde, strakke randen zonder vervaging. Kwaliteit Hoog gebruikt het; een 3D-beeld dat de GPU tekent, krijgt Gladde randen.
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest HD look for pixel art. Quality Ultra uses it; a 3D picture drawn by the GPU gets Natural HD (the network would only make it smaller). = xBRZ, daarna maakt een neuraal netwerk (Anime4K) op volle kracht elke rand en curve strak: het zachtste HD-uiterlijk voor pixel art. Kwaliteit Ultra gebruikt het; een 3D-beeld dat de GPU tekent, krijgt Natuurlijk HD (het netwerk zou het alleen kleiner maken).
Pixel Art HD: the GPU redraws the pixels as clean HD shapes at the TV's resolution (xBRZ). = Pixel Art HD: de GPU tekent de pixels opnieuw als strakke HD-vormen op de resolutie van de tv (xBRZ).
AI: Pixel Art HD, then an AI network (Anime4K) smooths every edge and curve: the smoothest HD. = AI: Pixel Art HD, daarna maakt een AI-netwerk (Anime4K) elke rand en curve glad: de zachtste HD.
Pixel Art HD on both screens: redrawn as clean HD shapes at the TV's resolution (xBRZ). = Pixel Art HD op beide schermen: opnieuw getekend als strakke HD-vormen op de resolutie van de tv (xBRZ).
AI on both screens: Pixel Art HD, then an AI network (Anime4K) smooths every edge: the smoothest HD. = AI op beide schermen: Pixel Art HD, daarna maakt een AI-netwerk (Anime4K) elke rand glad: de zachtste HD.
4x (960p) with Smooth Edges. The size changes at the next start. = 4x (960p) met Gladde randen. De grootte verandert bij de volgende start.

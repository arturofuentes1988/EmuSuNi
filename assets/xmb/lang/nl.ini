3x (720p), smooth textures, true colour and steady 3D (PGXP), with Smooth Edges. = 3x (720p), zachte texturen, echte kleur en stabiele 3D (PGXP), met Gladde randen.
4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA), made crisper (Natural HD). = 4x (960p), zachte texturen, stabiele 3D, 4x anti-aliasing (MSAA), extra scherp gemaakt (Natuurlijk HD).
3x (1440x816), the sharpest textures far away, with Smooth Edges. = 3x (1440x816), de scherpste texturen in de verte, met Gladde randen.
2x (1280x960), textures 8x sharp far away, with Smooth Edges. The size changes at the next start. = 2x (1280x960), texturen in de verte 8x scherp, met Gladde randen. De grootte verandert bij de volgende start.
3x (1920x1440, made smaller for the TV), textures 8x sharp far away, with Smooth Edges. The size changes at the next start. = 3x (1920x1440, verkleind voor de tv), texturen in de verte 8x scherp, met Gladde randen. De grootte verandert bij de volgende start.

What is RetroAchievements? = Wat is RetroAchievements?
How to start (a free account, the login here), what achievements and points are, the consoles and the files it knows. = Hoe je begint (een gratis account, hier inloggen), wat achievements en punten zijn, de consoles en de bestanden die het kent.
What it is = Wat het is
RetroAchievements (retroachievements.org) adds achievements to classic games: goals inside each game - beat a boss, find a secret, finish a level fast - unlocked as you play, each with its points. It's free, made by its players. = RetroAchievements (retroachievements.org) voegt achievements toe aan klassieke spellen: doelen in elk spel - een eindbaas verslaan, een geheim vinden, een level snel uitspelen - die je ontgrendelt terwijl je speelt, elk met punten. Het is gratis en wordt gemaakt door de spelers zelf.
1. A free account = 1. Een gratis account
Make one at retroachievements.org, on a phone or a computer, and confirm the e-mail it sends you: until then it refuses the login. = Maak er een op retroachievements.org, met een telefoon of computer, en bevestig de e-mail die je krijgt: tot dan wordt het inloggen geweigerd.
2. Log in here = 2. Log hier in
Settings -> RetroAchievements -> Log In: the keyboard asks for your user name, then your password. EmuSuNi keeps only the key the site gives back (never the password) and logs in again by itself at each start. = Instellingen -> RetroAchievements -> Inloggen: het toetsenbord vraagt om je gebruikersnaam en daarna je wachtwoord. EmuSuNi bewaart alleen de sleutel die de site teruggeeft (nooit het wachtwoord) en logt bij elke start vanzelf opnieuw in.
3. Play = 3. Speel
A game with achievements says so when it starts; each unlock shows a picture. The in-game menu's Achievements lists them with your progress; My Achievements keeps what you unlocked; Triangle -> Achievements on a game shows them all. = Een spel met achievements meldt dat bij het starten; elke ontgrendeling toont een afbeelding. Achievements in het spelmenu toont ze met je voortgang; Mijn achievements bewaart wat je hebt ontgrendeld; Driehoek -> Achievements bij een spel toont ze allemaal.
Casual and points = Casual en punten
EmuSuNi plays in RetroAchievements' Casual mode: save states, cheats and any speed are allowed, and the points go to your account. (Its Hardcore mode waits until RetroAchievements approves EmuSuNi.) = EmuSuNi speelt in de Casual-modus van RetroAchievements: opgeslagen statussen, cheats en elke snelheid zijn toegestaan, en de punten gaan naar je account. (De Hardcore-modus wacht tot RetroAchievements EmuSuNi goedkeurt.)

# --- EmuSuNi 00.21: the N64's speed
N64 Graphics Sync = N64 grafik eşitleme
Fast (asynchronous) = Hızlı (eşzamansız)
The GPU draws while the N64 runs: much smoother on the PS4. = N64 çalışırken GPU çizer: PS4'te çok daha akıcı.
Accurate (synchronous) = Doğru (eşzamanlı)
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens). = N64 her görüntüyü bekler: daha yavaş. Efektleri ekranı geri okuyan az sayıdaki oyun için (kamera fotoğrafları, bazı duraklatma ekranları).
Whether the N64 waits for the GPU's pictures (ParaLLEl-RDP's Synchronous RDP). = N64'ün GPU'nun görüntülerini bekleyip beklemediği (ParaLLEl-RDP'nin Synchronous RDP'si).
The N64's own picture: the smoothest. = N64'ün kendi görüntüsü: en akıcısı.
Twice the size: sharper 3D; heavy scenes can slow down. = İki kat boyut: daha keskin 3D; ağır sahneler yavaşlayabilir.
Four times: the sharpest; too heavy for most games on the PS4. = Dört kat: en keskini; PS4'te çoğu oyun için fazla ağır.
The size the GPU draws N64 games at (ParaLLEl-RDP). Native is the smoothest. = GPU'nun N64 oyunlarını çizdiği boyut (ParaLLEl-RDP). Yerel en akıcısıdır.
Quality = Kalite
Custom Quality = Özel

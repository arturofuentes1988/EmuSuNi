# --- EmuSuNi (Super Nintendo): appended to es.ini (kept here as the source)
Emulation = Emülasyon
Auto (4:3) = Otomatik (4:3)
Pixel Perfect (8:7) = Piksel kusursuz (8:7)
The picture's shape on the TV. 4:3 is how the consoles looked on a TV. = Görüntünün TV'deki şekli. 4:3, konsolların TV'de göründüğü gibidir.
Fit to Screen = Ekrana sığdır
Integer Scale (sharpest) = Tam sayı ölçek (en keskin)
How big the picture is drawn. Integer Scale keeps every pixel the same size (no uneven rows). = Görüntünün ne kadar büyük çizileceği. Tam sayı ölçek her pikseli aynı boyutta tutar (eşit olmayan satır yok).
Zooms in a little to fill more of the TV (the edges are cut). = TV'yi daha çok doldurmak için biraz yakınlaştırır (kenarlar kesilir).
Crop Overscan = Overscan'i kırp
Hides the lines at the top and bottom that TVs hid (224 lines are shown). = TV'lerin gizlediği üst ve alt satırları gizler (224 satır gösterilir).
Auto (game speed) = Otomatik (oyun hızı)
Auto runs NTSC games at 60 and PAL games at 50 frames per second, as on the console. = Otomatik, konsoldaki gibi NTSC oyunları saniyede 60, PAL oyunları 50 karede çalıştırır.
Waits for the TV's refresh (no tearing). Off can lower the input delay a little. = TV'nin yenilenmesini bekler (yırtılma yok). Kapalı, giriş gecikmesini biraz azaltabilir.
Sharp keeps the pixels crisp; Smooth softens them. = Keskin pikselleri net tutar; Yumuşak onları yumuşatır.
NTSC Filter = NTSC filtresi
Composite = Kompozit
Monochrome = Tek renkli
The look of an old TV cable (blargg's NTSC filter). Costs CPU time. = Eski bir TV kablosunun görünümü (blargg'ın NTSC filtresi). CPU kullanır.
Scanlines = Tarama çizgileri
Light = Hafif
Medium = Orta
Strong = Güçlü
Dark lines between the picture's rows, like a CRT TV. = Görüntünün satırları arasında koyu çizgiler, CRT TV'deki gibi.
Hi-Res Blending = Yüksek çözünürlük karışımı
Merge = Birleştir
Blur = Bulanıklaştır
Blends the hi-res mode's columns (pseudo-transparency in Kirby's Dream Land 3, Jurassic Park). = Yüksek çözünürlük modunun sütunlarını karıştırır (Kirby's Dream Land 3, Jurassic Park'taki sahte saydamlık).
Reduce Sprite Flicker = Sprite titremesini azalt
Draws more sprites per line than the console could (less flicker). = Satır başına konsolun çizebildiğinden daha fazla sprite çizer (daha az titreme).
Transparency Effects = Saydamlık efektleri
Colour math: water, shadows, fades. Off only to diagnose glitches. = Renk karıştırma: su, gölgeler, geçişler. Yalnızca hataları incelemek için kapat.
Light Overclock = Hafif hız aşırtma
Max Overclock = Maksimum hız aşırtma
Overclocking the console's CPU removes slowdown in busy scenes (Gradius III, Super R-Type); a few games glitch. = Konsolun CPU'sunu hızlandırmak kalabalık sahnelerdeki yavaşlamaları giderir (Gradius III, Super R-Type); birkaç oyunda hata olur.
SuperFX Clock = SuperFX saati
Faster SuperFX chip: smoother Star Fox, Stunt Race FX, Yoshi's Island. = Daha hızlı SuperFX çipi: daha akıcı Star Fox, Stunt Race FX, Yoshi's Island.
Emulation Speed = Emülasyon hızı
The game's speed. 100% is the console's. = Oyunun hızı. 100% konsolun kendi hızıdır.
Fast Forward (R2) = Hızlı ileri (R2)
Speed while R2 is held. = R2 basılı tutulurken hız.
Frame Skip = Kare atlama
Skips drawing some frames when the PS4 can't keep up (the game keeps its speed). = PS4 yetişemediğinde bazı kareleri çizmeden atlar (oyun hızını korur).
Region = Bölge
Auto uses the game's own region. = Otomatik, oyunun kendi bölgesini kullanır.
Block Invalid VRAM Access = Geçersiz VRAM erişimini engelle
As the console does. A few hacks and translations need Off. = Konsolun yaptığı gibi. Birkaç hack ve çeviri için Kapalı gerekir.
Echo Buffer Hack = Yankı arabelleği hack'i
Fixes the sound in a few hacks (Super Mario World ROM hacks). = Bazı hack'lerde sesi düzeltir (Super Mario World ROM hack'leri).
Allow Opposing Directions = Zıt yönlere izin ver
Up+Down or Left+Right at once (some games glitch with it). = Aynı anda Yukarı+Aşağı veya Sol+Sağ (bazı oyunlarda hata olur).
Randomize Memory = Rastgele bellek
Starts with random RAM, as a real console. Some games need it. = Gerçek bir konsol gibi rastgele RAM ile başlar. Bazı oyunlar bunu ister.
The menus' language. = Menülerin dili.

Both held for a second; the game sees them meanwhile (on the DS and the 3DS, its L and R). It can clash with a game that holds both together. = İkisi bir saniye basılı tutulur; oyun bu sırada onları görür (DS ve 3DS'te kendi L ve R'si). İkisini birlikte basılı tutan bir oyunla çakışabilir.
Both held for a second; the game sees them meanwhile. It can clash with a game that holds both together (a racing game's L2 and R2), or with R2's Fast Forward. = İkisi bir saniye basılı tutulur; oyun bu sırada onları görür. İkisini birlikte basılı tutan bir oyunla (yarış oyununun L2 ve R2'si) ya da R2'deki Hızlı ileri ile çakışabilir.

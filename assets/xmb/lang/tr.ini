How sharp the textures of far, slanted surfaces stay (anisotropic filtering, on the GPU). It changes at the next game start. = Uzak, eğik yüzeylerin dokularının ne kadar keskin kaldığı (anizotropik filtreleme, GPU'da). Bir sonraki oyun başlangıcında değişir.

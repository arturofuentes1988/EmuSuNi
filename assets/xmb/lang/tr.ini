# --- EmuSuNi 00.81: the 3DS's graphics errors (Accurate Shader Multiplication and 3DS Right Eye, per game)
Accurate Shader Multiplication = Doğru gölgelendirici çarpımı
On in the games known to need it (the Pokémon games from X and Y to Ultra Sun and Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Off in the others. = Gerektiği bilinen oyunlarda açık (X ve Y'den Ultra Sun ve Ultra Moon'a kadar Pokémon oyunları, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), diğerlerinde kapalı.
Multiplies in the shaders exactly as the 3DS does: models, lights and effects drawn right. A little more work for the GPU. = Gölgelendiricilerde tam 3DS gibi çarpar: modeller, ışıklar ve efektler doğru çizilir. GPU için biraz daha fazla iş.
The faster multiplication: most games look the same with it. = Daha hızlı çarpım: çoğu oyun onunla aynı görünür.
How the GPU's shaders multiply: exactly as the 3DS does, or faster. Without it a few games draw white, too bright or black models and effects. (Ocarina of Time 3D and the Mario & Luigi games always use it.) = GPU gölgelendiricilerinin nasıl çarptığı: tam 3DS gibi ya da daha hızlı. Bu olmadan bazı oyunlar modelleri ve efektleri beyaz, fazla parlak ya da siyah çizer. (Ocarina of Time 3D ve Mario & Luigi oyunları her zaman bunu kullanır.)
3DS Right Eye = 3DS sağ göz
Not drawn, but drawn in the games known to need it (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition). = Çizilmez; yalnızca gerektiği bilinen oyunlarda çizilir (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition).
Not Drawn (faster) = Çizilmez (daha hızlı)
The PS4 shows no 3D, so the right eye's picture is left out: less work in the games that draw both eyes. = PS4 3D göstermez, bu yüzden sağ gözün görüntüsü atlanır: iki gözü de çizen oyunlarda daha az iş.
Drawn = Çizilir

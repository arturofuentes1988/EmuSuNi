As on a TV of the time: a little wider than the console's own pixels. = O dönemin TV'sindeki gibi: konsolun kendi piksellerinden biraz daha geniş.
Square pixels, exactly as the console draws them (a little narrower). = Kare pikseller, tam konsolun çizdiği gibi (biraz daha dar).
Stretched to a widescreen TV (everything looks wider). = Geniş ekran TV'ye uzatılır (her şey daha geniş görünür).
Fills the whole screen, whatever its shape. = Şekli ne olursa olsun tüm ekranı doldurur.
The console's own 256x224 picture, enlarged by the TV (the fastest). = Konsolun kendi 256x224 görüntüsü, TV tarafından büyütülür (en hızlısı).
Redrawn at 512x448 before it is fitted to the TV. = TV'ye sığdırılmadan önce 512x448'de yeniden çizilir.
Redrawn at 768x672: for 720p TVs. = 768x672'de yeniden çizilir: 720p TV'ler için.
Redrawn at 1024x896. = 1024x896'da yeniden çizilir.
Redrawn at 1280x1120: the closest to a 1080p (Full HD) TV. = 1280x1120'de yeniden çizilir: 1080p (Full HD) TV'ye en yakını.
Redrawn at 1536x1344, then made smaller for the TV (a little smoother). = 1536x1344'te yeniden çizilir, sonra TV için küçültülür (biraz daha yumuşak).
As big as the TV allows. = TV'nin izin verdiği kadar büyük.
The biggest whole multiple of the console's lines (4x on a 1080p TV): every pixel the same size, with a black border. = Konsol satırlarının en büyük tam katı (1080p TV'de 4x): her piksel aynı boyutta, siyah kenarlıkla.
Twice the console's size, small in the middle of the TV. = Konsol boyutunun iki katı, TV'nin ortasında küçük.
Three times the console's size. = Konsol boyutunun üç katı.
Four times the console's size. = Konsol boyutunun dört katı.
The whole picture. = Görüntünün tamamı.
A little bigger: the edges are cut. = Biraz daha büyük: kenarlar kesilir.
Bigger: more of the edges are cut. = Daha büyük: kenarlardan daha çok kesilir.
Much bigger: fills a widescreen TV more, the edges cut. = Çok daha büyük: geniş ekran TV'yi daha çok doldurur, kenarlar kesilir.
224 lines: the empty lines at the top and bottom are hidden. = 224 satır: üstteki ve alttaki boş satırlar gizlenir.
Every line (some games show a black stripe or glitches at the edges). = Tüm satırlar (bazı oyunlar kenarlarda siyah şerit ya da hatalar gösterir).
Hidden when the game doesn't draw on them. = Oyun onlara çizim yapmadığında gizlenir.
NTSC games at 60 and PAL games at 50 frames per second. = NTSC oyunlar saniyede 60, PAL oyunlar 50 kare.
Every game at 60 (PAL games run faster than on their console). = Tüm oyunlar 60'ta (PAL oyunlar konsollarındakinden hızlı çalışır).
Every game at 50 (NTSC games run slower). = Tüm oyunlar 50'de (NTSC oyunlar daha yavaş çalışır).
As fast as the PS4 can (up to 4x). = PS4'ün yapabildiği kadar hızlı (4x'e kadar).
Smooth movement, no tearing. = Akıcı hareket, yırtılma yok.
A little less input delay; the picture may tear. = Biraz daha az giriş gecikmesi; görüntü yırtılabilir.
Rounded edges and clean lines: the most HD look. = Yuvarlak kenarlar ve temiz çizgiler: en HD görünüm.
Softer edges, closer to the original pixels (up to 4x). = Daha yumuşak kenarlar, orijinal piksellere daha yakın (4x'e kadar).
Bigger square pixels: crisp and even, like the original. = Daha büyük kare pikseller: orijinali gibi net ve düzgün.
Every pixel crisp (at Native some pixels can look wider than others). = Her piksel net (Yerel'de bazı pikseller diğerlerinden geniş görünebilir).
Soft, blended pixels. = Yumuşak, karışmış pikseller.
A clean picture. = Temiz bir görüntü.
The yellow video cable: colours bleed, soft details. = Sarı video kablosu: renkler taşar, ayrıntılar yumuşar.
Sharper than composite, a little colour bleeding. = Kompozitten daha keskin, biraz renk taşması.
The best cable of the time: sharp, clean colours. = O dönemin en iyi kablosu: keskin, temiz renkler.
The aerial cable: the blurriest, with noise. = Anten kablosu: en bulanığı, parazitli.
A black and white TV. = Siyah beyaz bir TV.
No lines. = Çizgi yok.
Faint lines. = Soluk çizgiler.
Clear lines. = Belirgin çizgiler.
Dark lines, like an arcade monitor. = Koyu çizgiler, bir arcade monitörü gibi.
The hi-res mode's columns as they are. = Yüksek çözünürlük modunun sütunları olduğu gibi.
Pairs of columns averaged: the see-through effects look as on a TV. = Sütun çiftlerinin ortalaması alınır: saydamlık efektleri TV'deki gibi görünür.
The columns softened. = Sütunlar yumuşatılır.
As the console: sprites flicker when too many share a line. = Konsol gibi: bir satırda çok fazla sprite olunca titrerler.
More sprites per line than the console could: less flicker (a few games glitch). = Satır başına konsolun çizebildiğinden fazla sprite: daha az titreme (birkaç oyunda hata olur).
Water, shadows and fades as on the console. = Konsoldaki gibi su, gölgeler ve geçişler.
No colour math (to find graphic glitches). = Renk karıştırma yok (grafik hatalarını bulmak için).
The console's own speed. = Konsolun kendi hızı.
A little faster: less slowdown, safe in most games. = Biraz daha hızlı: daha az yavaşlama, çoğu oyunda güvenli.
Faster: removes most slowdown; some games glitch. = Daha hızlı: yavaşlamaların çoğunu giderir; bazı oyunlarda hata olur.
Much faster; more games glitch. = Çok daha hızlı; daha çok oyunda hata olur.
The chip's own speed. = Çipin kendi hızı.
A faster chip: smoother 3D. = Daha hızlı bir çip: daha akıcı 3D.
Twice as fast: much smoother 3D. = İki kat hızlı: çok daha akıcı 3D.
Three times as fast (some scenes may run too fast). = Üç kat hızlı (bazı sahneler fazla hızlı akabilir).
Four times as fast (some scenes may run too fast). = Dört kat hızlı (bazı sahneler fazla hızlı akabilir).
R2 does nothing in the game. = R2 oyunda hiçbir şey yapmaz.
Every frame drawn. = Her kare çizilir.
Skips drawing a frame only when the PS4 falls behind. = Yalnızca PS4 geride kaldığında bir kareyi atlar.
Draws every other frame. = İki kareden birini çizer.
Draws one frame in three. = Üç kareden birini çizer.
As the game's own cartridge. = Oyunun kendi kartuşu gibi.
As an American or Japanese console. = Amerikan ya da Japon konsolu gibi.
As a European console: the game and its music run slower. = Avrupa konsolu gibi: oyun ve müziği daha yavaş çalışır.
As the console. = Konsol gibi.
For hacks and translations that need it. = Bunu gerektiren hack'ler ve çeviriler için.
The console's own sound filter: warm, a little muffled. = Konsolun kendi ses filtresi: sıcak, biraz boğuk.
Crisper high notes. = Daha net tiz sesler.
The crispest and cleanest (more CPU time). = En net ve en temiz (daha çok CPU kullanır).
Simple, a little harsh. = Basit, biraz sert.
The raw samples: sharp and noisy. = Ham örnekler: keskin ve gürültülü.
The usual balance. = Olağan denge.
Less delay; may crackle when the PS4 is busy. = Daha az gecikme; PS4 meşgulken cızırdayabilir.
Smoother sound in heavy games, a little more delay. = Ağır oyunlarda daha akıcı ses, biraz daha fazla gecikme.
The smoothest sound, the most delay. = En akıcı ses, en çok gecikme.
Two players. = İki oyuncu.
Up to five players with more DualShock 4s. = Daha fazla DualShock 4 ile beş oyuncuya kadar.

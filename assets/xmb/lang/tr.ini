3x (1920x1440), the sharpest textures far away (16x). The size changes at the next start. = 3x (1920x1440), uzakta en keskin dokular (16x). Boyut bir sonraki açılışta değişir.
# --- 00.68: the N64 (Graphics Sync for Cruis'n USA and Resident Evil 2, Ultra's 2D Exact)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA and Resident Evil 2 play Accurate anyway (with Fast they stay on a black screen). = N64 çalışırken GPU çizer: PS4'te çok daha akıcı. Cruis'n USA ve Resident Evil 2 her durumda Doğru ile oynar (Hızlı ile siyah ekranda kalırlar).
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens), or a game that goes black with Fast. = N64 her görüntüyü bekler: daha yavaş. Efektleri ekranı geri okuyan az sayıdaki oyun (kamera fotoğrafları, bazı duraklatma ekranları) ya da Hızlı ile kararan bir oyun için.
Text, icons and 2D backgrounds at the N64 Resolution: smoother, but many games show lines or squares where their pieces meet (Zelda's pre-drawn rooms, ISS 64's intro). = N64 çözünürlüğünde yazılar, simgeler ve 2D arka planlar: daha yumuşak, ama birçok oyun parçaların birleştiği yerlerde çizgi ya da kareler gösterir (Zelda'nın önceden çizilmiş odaları, ISS 64'ün girişi).
4x (960p) with Natural AI. The size changes at the next start. = Doğal YZ ile 4x (960p). Boyut bir sonraki açılışta değişir.


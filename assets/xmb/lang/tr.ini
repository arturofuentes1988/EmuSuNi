Medium (balanced) = Orta (dengeli)
Sharper: SNES and NES redrawn at 3x (xBRZ); the N64 at its own size. = Daha keskin: SNES ve NES 3x'te yeniden çizilir (xBRZ); N64 kendi boyutunda.
High (sharpest) = Yüksek (en keskin)
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 2x; heavy N64 games can slow down. = En keskini: SNES ve NES 6x'te (xBRZ), N64 2x'te; ağır N64 oyunları yavaşlayabilir.
Sets the picture for a level at once: resolution, upscaling, picture size, and the N64's size and sync. Changing one of them makes it Custom. = Görüntüyü tek seferde bir seviyeye ayarlar: çözünürlük, büyütme, görüntü boyutu ve N64'ün boyutu ve eşitlemesi. Birini değiştirirsen Özel olur.

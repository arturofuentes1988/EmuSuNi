High (HD) = Yüksek (HD)
Pixel Art HD (the 3D consoles: Smooth Edges); the N64 at 4x, the PlayStation, the PSP and the Dreamcast at 3x. = Pixel Art HD (3D konsollar: Yumuşak kenarlar); N64 4x'te, PlayStation, PSP ve Dreamcast 3x'te.
AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation and the PSP at 4x, the Dreamcast at 3x with the sharpest textures. = YZ (3D konsollar: keskinleştirilmiş, Doğal HD); N64, PlayStation ve PSP 4x'te, Dreamcast 3x'te en keskin dokularla.
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. = Yumuşak kenarlar, ardından TV çözünürlüğünde HD çizilir ve keskinleştirilir (AMD FSR): belirgin şekilde daha keskin, yine doğal, asla boyanmış gibi değil.
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. = Doğal HD'nin temiz kenarları ve görüntüye karıştırılan bir yapay zekâ ağı (Anime4K); böylece dokular ve dither kalır: mumsu olmadan en yumuşak görünüm.
Pixel art redrawn by the GPU at the TV's resolution: rounded, clean edges without blur. Quality High uses it; a 3D picture drawn by the GPU gets Smooth Edges. = Piksel sanatı GPU tarafından TV çözünürlüğünde yeniden çizilir: bulanıklık olmadan yuvarlak, temiz kenarlar. Yüksek kalite bunu kullanır; GPU'nun çizdiği 3D görüntüye Yumuşak kenarlar uygulanır.
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest HD look for pixel art. Quality Ultra uses it; a 3D picture drawn by the GPU gets Natural HD (the network would only make it smaller). = xBRZ, ardından tam güçte bir sinir ağı (Anime4K) her kenarı ve eğriyi temizler: piksel sanatı için en yumuşak HD görünüm. Ultra kalite bunu kullanır; GPU'nun çizdiği 3D görüntüye Doğal HD uygulanır (ağ onu yalnızca küçültürdü).
Pixel Art HD: the GPU redraws the pixels as clean HD shapes at the TV's resolution (xBRZ). = Pixel Art HD: GPU pikselleri TV çözünürlüğünde temiz HD şekiller olarak yeniden çizer (xBRZ).

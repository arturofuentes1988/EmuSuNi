# --- EmuSuNi 00.26: the N64's picture
N64 Anti-Aliasing = N64 kenar yumuşatma
On (the N64's) = Açık (N64'ünki)
Smooth 3D edges, as the N64's video chip made them. = N64'ün video çipinin yaptığı gibi yumuşak 3D kenarlar.
Jagged 3D edges, a little sharper: the picture before the N64's filter. = Tırtıklı 3D kenarlar, biraz daha keskin: N64 filtresinden önceki görüntü.
The N64's own edge smoothing (its video chip). Costs almost nothing. = N64'ün kendi kenar yumuşatması (video çipi). Neredeyse hiç yük getirmez.
N64 Dither Filter = N64 dither filtresi
Smooth colours: the N64's filter hides the dots of its 16-bit colours. = Yumuşak renkler: N64'ün filtresi 16 bit renklerinin noktalarını gizler.
The dots stay: grainy skies, fog and shadows. = Noktalar kalır: grenli gökyüzü, sis ve gölgeler.
The N64 drew its 16-bit colours with a pattern of dots; its video chip blended them away. = N64, 16 bit renklerini bir nokta deseniyle çizerdi; video çipi bunları karıştırıp gizlerdi.
N64 2D Graphics = N64 2D grafikleri
Exact = Birebir
Text, icons and 2D backgrounds as the N64 drew them: blocky, without seams. = N64'ün çizdiği gibi yazılar, simgeler ve 2D arka planlar: köşeli, eksiz.
Smooth (HD) = Yumuşak (HD)
Text, icons and 2D backgrounds at the N64 Resolution: smoother; some games show thin lines between their pieces. = N64 çözünürlüğünde yazılar, simgeler ve 2D arka planlar: daha yumuşak; bazı oyunlar parçaları arasında ince çizgiler gösterir.

2x (480p), smooth textures (xBR) and true colour, with Smooth Edges. = 2x (480p), yumuşak dokular (xBR) ve gerçek renk, Yumuşak kenarlarla.
4x (960p), smooth textures, true colour and steady 3D (PGXP), with Natural HD. = 4x (960p), yumuşak dokular, gerçek renk ve kararlı 3D (PGXP), Doğal HD ile.
4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA) and Natural AI. = 4x (960p), yumuşak dokular, kararlı 3D, 4x kenar yumuşatma (MSAA) ve Doğal YZ.
The console's own resolution (480x272), with no filters. = Konsolun kendi çözünürlüğü (480x272), filtresiz.
2x (960x544), sharper textures far away, with Smooth Edges. = 2x (960x544), uzakta daha keskin dokular, Yumuşak kenarlarla.
3x (1440x816), the sharpest textures far away, with Natural HD. = 3x (1440x816), uzakta en keskin dokular, Doğal HD ile.
4x (1920x1088, Full HD), the sharpest textures far away, made crisper (Natural HD). = 4x (1920x1088, Full HD), uzakta en keskin dokular, daha net (Doğal HD).
The console's own resolution (400x240 and 320x240): the lightest. The size changes at the next start. = Konsolun kendi çözünürlüğü (400x240 ve 320x240): en hafifi. Boyut bir sonraki açılışta değişir.
2x (800x480): sharper 3D, more work for the GPU. The size changes at the next start. = 2x (800x480): daha keskin 3D, GPU için daha fazla iş. Boyut bir sonraki açılışta değişir.
3x (1200x720): the sharpest, for the lighter games. The size changes at the next start. = 3x (1200x720): en keskini, daha hafif oyunlar için. Boyut bir sonraki açılışta değişir.
3x, as High: the most the 3DS has for now (no GPU filters for it yet). The size changes at the next start. = 3x, Yüksek gibi: 3DS'te şimdilik en fazlası (henüz onun için GPU filtresi yok). Boyut bir sonraki açılışta değişir.

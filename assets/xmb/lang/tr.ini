Natural AI on both screens: Natural HD with an AI network (Anime4K) that cleans every edge. = İki ekranda da Doğal YZ: her kenarı temizleyen bir yapay zekâ ağıyla (Anime4K) Doğal HD.
The console's own resolution, with no filters: the lightest. The size changes at the next start. = Konsolun kendi çözünürlüğü, filtresiz: en hafifi. Boyut bir sonraki açılışta değişir.

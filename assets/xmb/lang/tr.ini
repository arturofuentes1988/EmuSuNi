# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = Görüntüyü tek seferde bir seviyeye ayarlar: çözünürlük, büyütme (CPU ve GPU), görüntü boyutu ve N64'ün boyutu, eşitlemesi ve 2D'si. Birini değiştirirsen Özel olur. Oyun değişikliği hemen gösterir, ama N64'ün boyutu ve eşitlemesi bir sonraki oyun başlangıcında değişir. Dreamcast her zaman Düşük'te oynar (PS4 henüz fazlasını kaldıramıyor).
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = 3D'nin tırtıklı kenarlarını yumuşatır (çoklu örnekleme, GPU'da). Oyun sırasında değiştirilirse 3D'si yeniden hazırlanır: birkaç saniye takılabilir.

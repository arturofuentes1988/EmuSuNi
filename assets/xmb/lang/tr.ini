# --- EmuSuNi 00.40: the GPU Upscaler's steps (Smooth Edges, Natural HD, Natural AI)
Smooth Edges: the GPU smooths the jagged edges and leaves the pixels and textures as they are; the N64, the PlayStation and the PSP at 2x. = Yumuşak kenarlar: GPU tırtıklı kenarları yumuşatır, pikselleri ve dokuları olduğu gibi bırakır; N64, PlayStation ve PSP 2x'te.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR) that still looks natural; the N64 and the PlayStation at 4x, the PSP at 3x. Heavy N64 games can slow down. = Doğal HD: yumuşak kenarlar, ardından TV çözünürlüğünde yine doğal görünen keskin bir HD görüntü (AMD FSR); N64 ve PlayStation 4x'te, PSP 3x'te. Ağır N64 oyunları yavaşlayabilir.
The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP in Full HD with anti-aliasing. Heavy N64 games can slow down. = Her konsolun yapabileceğinin en iyisi: Doğal YZ, her kenarı temizleyip dokuları koruyan (mumsu görünüm olmadan) bir yapay zekâ ağı (Anime4K); N64 4x'te, HD 2D ile; PlayStation 4x'te yumuşak dokular, kararlı 3D ve kenar yumuşatmayla; PSP Full HD'de, kenar yumuşatmayla. Ağır N64 oyunları yavaşlayabilir.
Smooth Edges = Yumuşak kenarlar
Only the jagged edges are smoothed (anti-aliasing: MMPX and SMAA); colours, textures and the pixels' shapes stay as they are. Light on the GPU. Quality Medium uses it. = Yalnızca tırtıklı kenarlar yumuşatılır (kenar yumuşatma: MMPX ve SMAA); renkler, dokular ve piksellerin şekli olduğu gibi kalır. GPU'yu az yorar. Orta kalite bunu kullanır.
Natural HD = Doğal HD
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. Quality High uses it. = Yumuşak kenarlar, ardından TV çözünürlüğünde HD çizilir ve keskinleştirilir (AMD FSR): belirgin şekilde daha keskin, yine doğal, asla boyanmış gibi değil. Yüksek kalite bunu kullanır.
Natural AI = Doğal YZ
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. Quality Ultra uses it. = Doğal HD'nin temiz kenarları ve görüntüye karıştırılan bir yapay zekâ ağı (Anime4K); böylece dokular ve dither kalır: mumsu olmadan en yumuşak görünüm. Ultra kalite bunu kullanır.
AI (Anime4K) = YZ (Anime4K)
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest, most painted HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ, ardından tam güçte bir sinir ağı (Anime4K) her kenarı ve eğriyi temizler: SNES, NES ve Game Boy'lar için en yumuşak, en boyanmış HD görünüm. N64 Yumuşak HD kullanır.
Draws the picture with the GPU's filters at the TV's resolution. Every filter but HD Sharpen starts from the console's own picture: Resolution and the Upscaling Filter are left out. = Görüntüyü GPU filtreleriyle TV'nin çözünürlüğünde çizer. HD keskinlik dışındaki tüm filtreler konsolun kendi görüntüsünden başlar: Çözünürlük ve Büyütme filtresi kullanılmaz.

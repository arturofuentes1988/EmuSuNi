# --- EmuSuNi 01.72: the PS Vita firmware's panel - what .PUP files are, where from, where to, each one's state
What Are .PUP Files? = .PUP dosyaları nedir?
A .PUP file is an official update of the PS Vita's system software, made by Sony. PS Vita games need three of them (firmware 3.74): the system, a preinstalled package and the fonts. = .PUP dosyası, PS Vita sistem yazılımının Sony tarafından yapılmış resmi bir güncellemesidir. PS Vita oyunlarının üç tanesine ihtiyacı vardır (donanım yazılımı 3.74): sistem, önceden yüklü bir paket ve yazı tipleri.
They are Sony's: EmuSuNi doesn't include them or download them, and the PS4 never connects to Sony. = Bunlar Sony'nindir: EmuSuNi bunları içermez veya indirmez ve PS4 asla Sony'ye bağlanmaz.
Download them on a computer, from PlayStation's official website: the PS Vita system software update. = Bunları bir bilgisayarda, PlayStation'ın resmi web sitesinden indirin: PS Vita sistem yazılımı güncellemesi.
Copy them, under any names, to Roms/psvita (or its firmware folder) on the USB drive, or to {} on the PS4. = Herhangi bir adla USB bellekte Roms/psvita'ya (veya içindeki firmware klasörüne) ya da PS4'te {} konumuna kopyalayın.
Then choose Copy the Firmware. The first PS Vita game installs them by itself, once: it takes a few minutes. = Ardından «Donanım yazılımını kopyala» seçeneğini seçin. İlk PS Vita oyunu bunları kendisi, bir kez yükler: birkaç dakika sürer.
Missing = Eksik
Not Sony's file = Sony'nin dosyası değil
Found, to copy = Bulundu, kopyalanacak
Takes Sony's three .PUP files from Roms/psvita, checks each one and keeps it for the first PS Vita game. = Sony'nin üç .PUP dosyasını Roms/psvita'dan alır, her birini denetler ve ilk PS Vita oyunu için saklar.
What the firmware's files are, where to get them and where to put them. = Donanım yazılımı dosyalarının ne olduğu, nereden alınacağı ve nereye konacağı.


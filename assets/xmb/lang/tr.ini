With achievements: {}. Not yet: Nintendo 3DS. = Başarımı olanlar: {}. Henüz yok: Nintendo 3DS.
Which files = Hangi dosyalar
RetroAchievements knows certain files of each game - most often the usual dumps of its American, European or Japanese version (No-Intro's for cartridges, Redump's for discs); not translations or hacks. The "RA" mark on a cover says the file is known; Triangle -> Achievements on a game without it shows the files it knows. = RetroAchievements her oyunun belirli dosyalarını tanır - çoğunlukla Amerikan, Avrupa ya da Japon sürümünün bilinen dökümlerini (kartuşlar için No-Intro'nunkileri, diskler için Redump'ınkileri); çevirileri ya da hack'leri değil. Bir kapaktaki "RA" işareti dosyanın bilindiğini gösterir; işareti olmayan bir oyunda Üçgen -> Başarımlar tanıdığı dosyaları gösterir.
Without a connection = Bağlantı olmadan

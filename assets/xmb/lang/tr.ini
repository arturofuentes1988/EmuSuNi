# --- EmuSuNi 00.70: the 3DS CPU Clock's texts (a lower clock seldom saves the PS4 any work)
The game sees a slower 3DS. Less work for the PS4 only in a game that keeps the processor busy without a break; most wait for their next picture and cost the same. = Oyun daha yavaş bir 3DS görür. PS4'ün işi yalnızca işlemciyi aralıksız meşgul eden bir oyunda azalır; çoğu oyun sonraki görüntüsünü bekler ve aynı yükü getirir.
The game sees a 3DS at half speed: a game that needs the speed slows down or stutters. = Oyun yarı hızda bir 3DS görür: hıza ihtiyaç duyan bir oyun yavaşlar ya da takılır.
How fast the emulated 3DS's processor runs. Most games wait for their next picture, so a lower clock seldom saves the PS4 any work (none in the games tried); a game that needs the speed slows down or freezes. = Emüle edilen 3DS işlemcisinin ne kadar hızlı çalıştığı. Çoğu oyun sonraki görüntüsünü beklediğinden düşük saat PS4'ün işini nadiren azaltır (denenen oyunlarda hiç azaltmadı); hıza ihtiyaç duyan bir oyun yavaşlar ya da donar.

# --- EmuSuNi 00.71: the 3DS's Quality levels (3DS Resolution 1x to 4x on its pages, the GPU Upscaler's steps)
Each console's own resolution (the N64, the PlayStation, the PSP, the DS, the 3DS and the Dreamcast at 1x), no upscaler and no filters. = Her konsolun kendi çözünürlüğü (N64, PlayStation, PSP, DS, 3DS ve Dreamcast 1x'te), büyütücü ve filtre yok.
Smooth Edges; the N64, the PlayStation, the PSP, the 3DS and the Dreamcast at 2x. = Yumuşak kenarlar; N64, PlayStation, PSP, 3DS ve Dreamcast 2x'te.
Pixel Art HD (the 3D consoles: Smooth Edges); the N64 at 4x, the PlayStation, the PSP, the 3DS and the Dreamcast at 3x. = Pixel Art HD (3D konsollar: Yumuşak kenarlar); N64 4x'te, PlayStation, PSP, 3DS ve Dreamcast 3x'te.
AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation, the PSP and the 3DS at 4x, the Dreamcast at 3x with the sharpest textures. = YZ (3D konsollar: keskinleştirilmiş, Doğal HD); N64, PlayStation, PSP ve 3DS 4x'te, Dreamcast 3x'te en keskin dokularla.
Twice the size (800x480): sharper 3D. = İki kat boyut (800x480): daha keskin 3D.
Three times (1200x720): sharper 3D still. = Üç kat (1200x720): daha da keskin 3D.
Four times (1600x960, about Full HD): the sharpest 3D. = Dört kat (1600x960, Full HD'ye yakın): en keskin 3D.
The size the GPU draws 3DS games at: real HD 3D, not an enlarged picture. A bigger size is more work for the GPU only, but a game that reads its picture back (a few do, for effects) waits for it and can slow down. = GPU'nun 3DS oyunlarını çizdiği boyut: büyütülmüş bir görüntü değil, gerçek HD 3D. Daha büyük boyut yalnızca GPU'ya daha fazla iş verir, ama görüntüsünü geri okuyan bir oyun (birkaçı efektler için bunu yapar) onu bekler ve yavaşlayabilir.
The console's own resolution (400x240 and 320x240), with no filters: the lightest. The size changes at the next start. = Konsolun kendi çözünürlüğü (400x240 ve 320x240), filtresiz: en hafifi. Boyut bir sonraki açılışta değişir.
2x (800x480) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = Yumuşak kenarlarla 2x (800x480). Boyut bir sonraki açılışta değişir; görüntüsünü geri okuyan bir oyun yavaşlayabilir.
3x (1200x720) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = Yumuşak kenarlarla 3x (1200x720). Boyut bir sonraki açılışta değişir; görüntüsünü geri okuyan bir oyun yavaşlayabilir.
4x (1600x960), made crisper by AMD's sharpening (Natural HD). The size changes at the next start; a game that reads its picture back can slow down. = 4x (1600x960), AMD'nin keskinleştirmesiyle daha net (Doğal HD). Boyut bir sonraki açılışta değişir; görüntüsünü geri okuyan bir oyun yavaşlayabilir.

# --- EmuSuNi 00.72: the N64 (Ogre Battle 64 plays with N64 Graphics Sync Accurate too)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA, Resident Evil 2 and Ogre Battle 64 play Accurate anyway (with Fast the first two stay on a black screen and Ogre Battle's backgrounds break). = N64 çalışırken GPU çizer: PS4'te çok daha akıcı. Cruis'n USA, Resident Evil 2 ve Ogre Battle 64 her durumda Doğru ile oynar (Hızlı ile ilk ikisi siyah ekranda kalır, Ogre Battle'ın arka planları bozulur).


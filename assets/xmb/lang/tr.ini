This is its code: write it in your report on GitHub (Issues) or Telegram, with what happened. = Kodu bu: onu, ne olduğunu da anlatarak GitHub (Issues) ya da Telegram'daki raporuna yaz.
Closes this. Settings -> Send Log sends a new one. = Bunu kapatır. Ayarlar -> Günlüğü gönder yeni bir tane gönderir.
Sends the log again. = Günlüğü yeniden gönderir.
EmuSuNi Closed = EmuSuNi kapandı
EmuSuNi closed by itself last time. = EmuSuNi geçen sefer kendiliğinden kapandı.
Send its log to its creator, to find why? It has what the app did, how it closed and its version. Your nickname and user names are taken out; the server keeps only the country, never your address, for 90 days. = Nedenini bulmak için günlüğü yapımcısına gönderilsin mi? İçinde uygulamanın ne yaptığı, nasıl kapandığı ve sürümü var. Takma adın ve kullanıcı adların çıkarılır; sunucu 90 gün boyunca yalnızca ülkeyi saklar, asla adresini değil.
Yes, Send It = Evet, gönder
Sends it now: you get a code to write in a report on GitHub or Telegram. = Şimdi gönderir: GitHub ya da Telegram'daki bir rapora yazman için bir kod alırsın.
Nothing is sent. Settings -> Send Log can send it later. = Hiçbir şey gönderilmez. Ayarlar -> Günlüğü gönder onu daha sonra gönderebilir.

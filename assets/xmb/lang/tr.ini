What is RetroAchievements? = RetroAchievements nedir?
How to start (a free account, the login here), what achievements and points are, the consoles and the files it knows. = Nasıl başlanır (ücretsiz bir hesap, buradan giriş), başarımlar ve puanlar nedir, tanıdığı konsollar ve dosyalar.
What it is = Nedir
RetroAchievements (retroachievements.org) adds achievements to classic games: goals inside each game - beat a boss, find a secret, finish a level fast - unlocked as you play, each with its points. It's free, made by its players. = RetroAchievements (retroachievements.org) klasik oyunlara başarımlar ekler: her oyunun içinde hedefler - bir boss'u yen, bir sır bul, bir bölümü hızlı bitir - oynadıkça açılır, her birinin kendi puanı vardır. Ücretsizdir, oyuncuları tarafından yapılır.
1. A free account = 1. Ücretsiz bir hesap
Make one at retroachievements.org, on a phone or a computer, and confirm the e-mail it sends you: until then it refuses the login. = retroachievements.org'da telefondan ya da bilgisayardan bir hesap aç ve sana gönderdiği e-postayı onayla: o zamana kadar girişi reddeder.
2. Log in here = 2. Buradan giriş yap
Settings -> RetroAchievements -> Log In: the keyboard asks for your user name, then your password. EmuSuNi keeps only the key the site gives back (never the password) and logs in again by itself at each start. = Ayarlar -> RetroAchievements -> Giriş yap: klavye önce kullanıcı adını, sonra şifreni ister. EmuSuNi yalnızca sitenin geri verdiği anahtarı saklar (şifreyi asla) ve her açılışta kendiliğinden yeniden giriş yapar.
3. Play = 3. Oyna
A game with achievements says so when it starts; each unlock shows a picture. The in-game menu's Achievements lists them with your progress; My Achievements keeps what you unlocked; Triangle -> Achievements on a game shows them all. = Başarımları olan bir oyun bunu başlarken söyler; açılan her başarım bir resim gösterir. Oyun içi menüdeki Başarımlar onları ilerlemenle listeler; Başarımlarım açtıklarını saklar; bir oyunda Üçgen -> Başarımlar hepsini gösterir.
Casual and points = Casual ve puanlar
EmuSuNi plays in RetroAchievements' Casual mode: save states, cheats and any speed are allowed, and the points go to your account. (Its Hardcore mode waits until RetroAchievements approves EmuSuNi.) = EmuSuNi, RetroAchievements'ın Casual modunda oynar: kayıtlı durumlar, hileler ve her hız serbesttir, puanlar hesabına gider. (Hardcore modu, RetroAchievements EmuSuNi'yi onaylayana kadar bekliyor.)

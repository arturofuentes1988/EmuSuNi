PS4's Choice = PS4 seçer
The PS4 moves the threads between its cores, as before 00.27. = PS4, 00.27 öncesindeki gibi iş parçacıklarını çekirdekleri arasında taşır.
Which PS4 cores run an N64 game's threads. Fixed gives the emulation and its graphics thread a core each, so they run at the same time. = Bir N64 oyununun iş parçacıklarını hangi PS4 çekirdeklerinin çalıştırdığı. Sabit, emülasyona ve grafik iş parçacığına birer çekirdek verir; böylece aynı anda çalışırlar.

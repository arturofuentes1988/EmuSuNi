# --- EmuSuNi 00.91: Send Log (the logs to EmuSuNi's server)
Send Log = Günlüğü gönder
Log Sent = Günlük gönderildi
Send = Gönder
Try Again = Yeniden dene
Nothing is sent. = Hiçbir şey gönderilmez.
EmuSuNi's log goes to its creator, to find what went wrong: what the app did this time and the time before (games started, settings, errors), how it closed (crash.log) and its version. = EmuSuNi'nin günlüğü, neyin ters gittiğini bulmak için yapımcısına gider: uygulamanın bu sefer ve bir önceki sefer ne yaptığı (açılan oyunlar, ayarlar, hatalar), nasıl kapandığı (crash.log) ve sürümü.
Not sent: your games, saves or other files. Your nickname and user names are taken out; the server keeps only the country, never your address, and deletes the log after 90 days. = Gönderilmez: oyunların, kayıtların ya da diğer dosyaların. Takma adın ve kullanıcı adların çıkarılır; sunucu yalnızca ülkeyi saklar, asla adresini değil, ve günlüğü 90 gün sonra siler.
You get a code: write it in your report on GitHub (Issues) or Telegram. = Bir kod alırsın: onu GitHub (Issues) ya da Telegram'daki raporuna yaz.

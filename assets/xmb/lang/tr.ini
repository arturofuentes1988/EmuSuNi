WiiLink WFC: another server, open source. = WiiLink WFC: başka bir sunucu, açık kaynak.
No network: a game's Nintendo WFC says it can't connect (error 52000). = Ağ yok: oyunun Nintendo WFC'si bağlanamadığını söyler (hata 52000).
The server a game's Nintendo Wi-Fi Connection uses to play online (Mario Kart DS, Pokémon...). Nothing is sent until you connect in the game. The server and the other players see your public IP, as with a real DS; the DS can't reach your home network. Friends registered on one server aren't on the other. = Bir oyunun Nintendo Wi-Fi Connection'ının çevrimiçi oynamak için kullandığı sunucu (Mario Kart DS, Pokémon...). Oyunda bağlanana kadar hiçbir şey gönderilmez. Sunucu ve diğer oyuncular, gerçek bir DS'te olduğu gibi genel IP'ni görür; DS ev ağına erişemez. Bir sunucuda kayıtlı arkadaşlar diğerinde yoktur.


# --- 00.68: the Dreamcast's Quality levels
Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the Dreamcast at 1x), no upscaler and no filters. = Her konsolun kendi çözünürlüğü (N64, PlayStation, PSP, DS ve Dreamcast 1x'te), büyütücü ve filtre yok.
Smooth Edges; the N64, the PlayStation, the PSP and the Dreamcast at 2x. = Yumuşak kenarlar; N64, PlayStation, PSP ve Dreamcast 2x'te.
Natural HD; the N64 and the PlayStation at 4x, the PSP and the Dreamcast at 3x. = Doğal HD; N64 ve PlayStation 4x'te, PSP ve Dreamcast 3x'te.

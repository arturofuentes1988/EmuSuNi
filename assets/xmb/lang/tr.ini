Redraws the game bigger with the Upscaling Filter (Graphics) before it is fitted to the TV: 3x for 720p, 5x for 1080p. Uses CPU time: lower it if a game slows down. = Oyunu TV'ye sığdırmadan önce Büyütme filtresiyle (Grafik) daha büyük yeniden çizer: 720p için 3x, 1080p için 5x. CPU kullanır: bir oyun yavaşlarsa düşür.
How Resolution redraws the pixels: xBRZ and HQx round the edges for an HD look; Sharp Pixels keeps them square. HQx goes up to 4x. = Çözünürlüğün pikselleri nasıl yeniden çizdiği: xBRZ ve HQx, HD görünüm için kenarları yuvarlar; Keskin pikseller onları kare tutar. HQx 4x'e kadar çıkar.
Sharp keeps the pixels crisp; Smooth softens them. Above Native resolution the picture is always smooth. = Keskin pikselleri net tutar; Yumuşak onları yumuşatır. Yerel çözünürlüğün üzerinde görüntü her zaman yumuşaktır.

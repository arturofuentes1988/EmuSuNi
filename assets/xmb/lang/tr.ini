As the N64 = N64'teki gibi
Far textures as blurry as on the N64: for the few games that swap textures with the distance. = Uzak dokular N64'teki kadar bulanık: dokuları uzaklığa göre değiştiren az sayıdaki oyun için.
The texture detail of far surfaces above Native resolution. = Yerel çözünürlüğün üzerinde uzak yüzeylerin doku ayrıntısı.
N64 Screen Effects = N64 ekran efektleri
Blurs, pause screens and photos made from the game's own picture, at the N64's size. = Oyunun kendi görüntüsünden yapılan bulanıklıklar, duraklatma ekranları ve fotoğraflar, N64 boyutunda.
Smooth (SSAA) = Yumuşak (SSAA)
Those effects made from the sharp picture: smoother; a few games glitch. = Bu efektler keskin görüntüden yapılır: daha yumuşak; birkaç oyunda hata olur.
Effects some games make from their own picture (pause backgrounds, motion blur), above Native resolution. = Bazı oyunların kendi görüntülerinden yaptığı efektler (duraklatma arka planları, hareket bulanıklığı), yerel çözünürlüğün üzerinde.
Four times (about Full HD): the sharpest; heavy games can slow down. = Dört kat (Full HD'ye yakın): en keskini; ağır oyunlar yavaşlayabilir.
Sharper: SNES and NES redrawn at 3x (xBRZ); the N64 at 2x. = Daha keskin: SNES ve NES 3x'te yeniden çizilir (xBRZ); N64 2x'te.
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 4x; heavy N64 games can slow down. = En keskini: SNES ve NES 6x'te (xBRZ), N64 4x'te; ağır N64 oyunları yavaşlayabilir.
# --- EmuSuNi 00.27: Ultra and the GPU's filters
Ultra (maximum) = Ultra (en yüksek)
The best each console can do: SNES and NES redrawn by the GPU with xBRZ and an AI network (Anime4K); the N64 at 4x with HD 2D, sharpened. Heavy N64 games can slow down. = Her konsolun yapabileceğinin en iyisi: SNES ve NES, GPU tarafından xBRZ ve bir yapay zekâ ağıyla (Anime4K) yeniden çizilir; N64 4x'te, HD 2D ile ve keskinleştirilmiş. Ağır N64 oyunları yavaşlayabilir.
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = Görüntüyü tek seferde bir seviyeye ayarlar: çözünürlük, büyütme (CPU ve GPU), görüntü boyutu ve N64'ün boyutu, eşitlemesi ve 2D'si. Birini değiştirirsen Özel olur.

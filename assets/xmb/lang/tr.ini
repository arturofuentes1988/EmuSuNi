The Dreamcast's own 640x480 picture: the lightest. = Dreamcast'in kendi 640x480 görüntüsü: en hafifi.
Twice the size (1280x960): sharper 3D. = İki kat boyut (1280x960): daha keskin 3D.
Three times (1920x1440), made smaller for a 1080p TV: the sharpest 3D, the smoothest edges. = Üç kat (1920x1440), 1080p TV için küçültülür: en keskin 3D, en yumuşak kenarlar.

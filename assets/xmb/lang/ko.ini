# --- EmuSuNi 00.89: macros (several buttons in one) and the statistics' notice
Several buttons in one (fighting games). Cross: press the macro's button, then hold together the buttons it presses and let them go. Left: none. Its button stops doing what it did. = 여러 버튼을 하나로(격투 게임). 엑스: 매크로 버튼을 누른 다음, 매크로가 누를 버튼들을 함께 누르고 있다가 떼세요. 왼쪽: 없음. 그 버튼의 원래 기능은 사라집니다.
Now hold together the buttons it presses, then let them go...  (5 s: cancel) = 이제 매크로가 누를 버튼들을 함께 누르고 있다가 떼세요...  (5초: 취소)
Hold its buttons... = 버튼을 누르고 있으세요...
EmuSuNi sends anonymous statistics: how many use it and from which countries, its version, the PS4's language, the console and the game played (a checksum or a disc's code, never a file's name). = EmuSuNi는 익명 통계를 보냅니다: 사용자 수와 국가, 버전, PS4 언어, 플레이하는 콘솔과 게임(체크섬 또는 디스크 코드이며 파일 이름은 보내지 않음).

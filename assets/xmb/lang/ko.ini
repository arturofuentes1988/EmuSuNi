Your own 1920x1080 PNG, see-through where the game goes: /data/EmuSuNi/bezels/gbc/ with the ROM's name (The Bezel Project's names), or bezels/gbc.png for every game. = 직접 만든 1920x1080 PNG, 게임이 나오는 곳은 투명하게: /data/EmuSuNi/bezels/gbc/에 ROM 이름으로(The Bezel Project의 이름), 또는 모든 게임용 bezels/gbc.png.
Your own 1920x1080 PNG, see-through where the game goes: /data/EmuSuNi/bezels/gba/ with the ROM's name (The Bezel Project's names), or bezels/gba.png for every game. = 직접 만든 1920x1080 PNG, 게임이 나오는 곳은 투명하게: /data/EmuSuNi/bezels/gba/에 ROM 이름으로(The Bezel Project의 이름), 또는 모든 게임용 bezels/gba.png.
Berry = 베리
The Game Boy Color in berry, with COLOR in its five colours. = 베리색 Game Boy Color, 다섯 가지 색의 COLOR 로고.
Teal = 청록

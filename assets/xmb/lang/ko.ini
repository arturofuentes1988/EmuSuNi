For the games with a tilt or turn sensor in the cartridge. = 카트리지에 기울기나 회전 센서가 있는 게임용입니다.
Sound Filter = 사운드 필터
The sound as the handheld made it. = 휴대기가 내던 그대로의 소리.
Soft = 부드럽게

AI on both screens: Pixel Art HD, then an AI network (Anime4K) smooths every edge: the smoothest HD. = 두 화면에 AI: 픽셀 아트 HD 다음에 AI 네트워크(Anime4K)가 모든 가장자리를 부드럽게 합니다: 가장 부드러운 HD.
4x (960p) with Smooth Edges. The size changes at the next start. = 4x(960p)에 가장자리 다듬기. 크기는 다음에 시작할 때 바뀝니다.
4x (960p), made crisper by AMD's sharpening (Natural HD). The size changes at the next start. = 4x(960p), AMD 샤프닝으로 더 또렷하게(자연스러운 HD). 크기는 다음에 시작할 때 바뀝니다.

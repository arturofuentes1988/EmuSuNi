Zooms in a little to fill more of the TV (the edges are cut). = 조금 확대해 TV를 더 채웁니다(가장자리가 잘립니다).
Crop Overscan = 오버스캔 자르기
Hides the lines at the top and bottom that TVs hid (224 lines are shown). = 옛 TV에서 가려지던 위아래 줄을 숨깁니다(224줄 표시).
Auto (game speed) = 자동 (게임 속도)
Auto runs NTSC games at 60 and PAL games at 50 frames per second, as on the console. = 자동은 실제 본체처럼 NTSC 게임을 초당 60프레임, PAL 게임을 초당 50프레임으로 실행합니다.
Waits for the TV's refresh (no tearing). Off can lower the input delay a little. = TV의 화면 갱신을 기다립니다(화면 찢어짐 없음). 끄면 입력 지연이 조금 줄 수 있습니다.
Sharp keeps the pixels crisp; Smooth softens them. = 선명하게는 픽셀을 또렷하게 유지하고, 부드럽게는 픽셀을 부드럽게 합니다.

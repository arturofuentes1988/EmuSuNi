# --- EmuSuNi 00.91: Send Log (the logs to EmuSuNi's server)
Send Log = 로그 보내기
Log Sent = 로그 보냄
Send = 보내기
Try Again = 다시 시도
Nothing is sent. = 보내지 않습니다.
EmuSuNi's log goes to its creator, to find what went wrong: what the app did this time and the time before (games started, settings, errors), how it closed (crash.log) and its version. = 문제를 찾기 위해 EmuSuNi 로그를 제작자에게 보냅니다: 이번과 지난번에 앱이 한 일(시작한 게임, 설정, 오류), 종료 방식(crash.log), 버전.
Not sent: your games, saves or other files. Your nickname and user names are taken out; the server keeps only the country, never your address, and deletes the log after 90 days. = 보내지 않는 것: 게임, 세이브, 기타 파일. 닉네임과 사용자 이름은 지웁니다. 서버는 국가만 보관하고 주소는 절대 보관하지 않으며, 90일 후 로그를 삭제합니다.
You get a code: write it in your report on GitHub (Issues) or Telegram. = 코드를 받습니다: GitHub(Issues)나 Telegram에 올리는 보고에 적어 주세요.
Sends the log now (a few seconds). = 지금 로그를 보냅니다(몇 초).
Sending the log to EmuSuNi's server... = EmuSuNi 서버로 로그를 보내는 중...
This is its code: write it in your report on GitHub (Issues) or Telegram, with what happened. = 로그 코드입니다: 무슨 일이 있었는지와 함께 GitHub(Issues)나 Telegram 보고에 적어 주세요.
Closes this. Settings -> Send Log sends a new one. = 이 창을 닫습니다. 설정 -> 로그 보내기로 새로 보낼 수 있습니다.
Sends the log again. = 로그를 다시 보냅니다.
EmuSuNi Closed = EmuSuNi 종료됨
EmuSuNi closed by itself last time. = 지난번에 EmuSuNi가 스스로 종료되었습니다.
Send its log to its creator, to find why? It has what the app did, how it closed and its version. Your nickname and user names are taken out; the server keeps only the country, never your address, for 90 days. = 원인을 찾기 위해 로그를 제작자에게 보낼까요? 앱이 한 일, 종료 방식, 버전이 들어 있습니다. 닉네임과 사용자 이름은 지웁니다. 서버는 국가만 90일간 보관하고 주소는 절대 보관하지 않습니다.
Yes, Send It = 예, 보내기
Sends it now: you get a code to write in a report on GitHub or Telegram. = 지금 보냅니다: GitHub나 Telegram 보고에 적을 코드를 받습니다.
Nothing is sent. Settings -> Send Log can send it later. = 아무것도 보내지 않습니다. 나중에 설정 -> 로그 보내기로 보낼 수 있습니다.
The server didn't prove it is EmuSuNi's: nothing was sent. = 서버가 EmuSuNi 서버임을 증명하지 못해 아무것도 보내지 않았습니다.
Many logs were sent from this connection today: try again tomorrow. = 오늘 이 연결에서 로그를 많이 보냈습니다: 내일 다시 시도하세요.
The log is too big to send. = 로그가 너무 커서 보낼 수 없습니다.
EmuSuNi's server is full right now: try again later. = 지금 EmuSuNi 서버가 가득 찼습니다: 나중에 다시 시도하세요.
EmuSuNi's server didn't take it. = EmuSuNi 서버가 받지 않았습니다.
EmuSuNi's server had a problem: try again later. = EmuSuNi 서버에 문제가 생겼습니다: 나중에 다시 시도하세요.
No internet connection: check the PS4's network. = 인터넷 연결 없음: PS4의 네트워크를 확인하세요.
EmuSuNi's server didn't answer: try again later. = EmuSuNi 서버가 응답하지 않았습니다: 나중에 다시 시도하세요.
EmuSuNi's server isn't known: check the PS4's internet connection. = EmuSuNi 서버를 찾을 수 없습니다: PS4의 인터넷 연결을 확인하세요.


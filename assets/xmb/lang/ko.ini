Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. = 가장자리 다듬기 후 TV 해상도의 HD로 그리고 샤프닝합니다(AMD FSR): 확실히 더 선명하면서도 자연스럽고, 그림처럼 뭉개지지 않습니다.

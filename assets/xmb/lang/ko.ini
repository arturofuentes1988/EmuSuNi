Redrawn at 1536x1344, then made smaller for the TV (a little smoother). = 1536x1344로 다시 그린 뒤 TV에 맞게 줄입니다(조금 더 부드러움).
As big as the TV allows. = TV가 허용하는 만큼 크게.
The biggest whole multiple of the console's lines (4x on a 1080p TV): every pixel the same size, with a black border. = 본체 줄 수의 가장 큰 정수배(1080p TV에서 4x): 모든 픽셀이 같은 크기이며 검은 테두리가 생깁니다.
Twice the console's size, small in the middle of the TV. = 본체 크기의 2배로, TV 가운데에 작게 나옵니다.
Three times the console's size. = 본체 크기의 3배.
Four times the console's size. = 본체 크기의 4배.
The whole picture. = 화면 전체.
A little bigger: the edges are cut. = 조금 크게: 가장자리가 잘립니다.
Bigger: more of the edges are cut. = 더 크게: 가장자리가 더 잘립니다.

# --- EmuSuNi 00.40: the GPU Upscaler's steps (Smooth Edges, Natural HD, Natural AI)
Smooth Edges: the GPU smooths the jagged edges and leaves the pixels and textures as they are; the N64, the PlayStation and the PSP at 2x. = 가장자리 다듬기: GPU가 계단 현상만 부드럽게 하고 픽셀과 텍스처는 그대로 둡니다. N64, PlayStation, PSP는 2x.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR) that still looks natural; the N64 and the PlayStation at 4x, the PSP at 3x. Heavy N64 games can slow down. = 자연스러운 HD: 가장자리를 다듬은 뒤 TV 해상도의 선명한 HD 화면(AMD FSR)으로, 여전히 자연스럽게 보입니다. N64와 PlayStation은 4x, PSP는 3x. 무거운 N64 게임은 느려질 수 있습니다.
The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP in Full HD with anti-aliasing. Heavy N64 games can slow down. = 각 콘솔의 최고 화질: 자연스러운 AI(AI 네트워크 Anime4K가 모든 가장자리를 다듬고 텍스처는 살려 밀랍 같은 느낌이 없음), N64는 4x에 HD 2D, PlayStation은 4x에 부드러운 텍스처, 안정된 3D, 안티앨리어싱, PSP는 Full HD에 안티앨리어싱. 무거운 N64 게임은 느려질 수 있습니다.
Smooth Edges = 가장자리 다듬기
Only the jagged edges are smoothed (anti-aliasing: MMPX and SMAA); colours, textures and the pixels' shapes stay as they are. Light on the GPU. Quality Medium uses it. = 계단 현상만 부드럽게 합니다(안티앨리어싱: MMPX와 SMAA). 색, 텍스처, 픽셀 모양은 그대로입니다. GPU 부담이 적습니다. 품질 '중간'에서 씁니다.
Natural HD = 자연스러운 HD
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. Quality High uses it. = 가장자리 다듬기 후 TV 해상도의 HD로 그리고 샤프닝합니다(AMD FSR): 확실히 더 선명하면서도 자연스럽고, 그림처럼 뭉개지지 않습니다. 품질 '높음'에서 씁니다.
Natural AI = 자연스러운 AI
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. Quality Ultra uses it. = 자연스러운 HD의 깔끔한 가장자리에 AI 네트워크(Anime4K)를 섞어 텍스처와 디더링이 남습니다: 밀랍 같은 느낌 없이 가장 부드러운 화면. 품질 '울트라'에서 씁니다.
AI (Anime4K) = AI (Anime4K)
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest, most painted HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ 다음에 최대 강도의 신경망(Anime4K)이 모든 가장자리와 곡선을 다듬습니다: SNES, NES, Game Boy에 가장 부드럽고 그림 같은 HD 느낌. N64는 부드러운 HD를 씁니다.
Draws the picture with the GPU's filters at the TV's resolution. Every filter but HD Sharpen starts from the console's own picture: Resolution and the Upscaling Filter are left out. = GPU 필터로 TV 해상도에 맞춰 화면을 그립니다. HD 샤프닝을 뺀 모든 필터는 콘솔 원래의 화면에서 시작하므로 해상도와 업스케일링 필터는 쓰지 않습니다.

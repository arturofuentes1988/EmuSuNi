The server a game's Nintendo Wi-Fi Connection uses to play online (Mario Kart DS, Pokémon...). Nothing is sent until you connect in the game. The server and the other players see your public IP, as with a real DS; the DS can't reach your home network. Friends registered on one server aren't on the other. = 게임의 Nintendo Wi-Fi Connection이 온라인 플레이에 쓰는 서버입니다(Mario Kart DS, Pokémon...). 게임에서 연결하기 전에는 아무것도 보내지 않습니다. 실제 DS처럼 서버와 다른 플레이어에게 내 공인 IP가 보이지만, DS는 집 네트워크에 접근할 수 없습니다. 한 서버에 등록한 친구는 다른 서버에 없습니다.


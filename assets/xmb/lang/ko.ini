Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the 3DS at 1x), no upscaler and no filters. = 각 콘솔 원래의 해상도(N64, PlayStation, PSP, DS, 3DS는 1x), 업스케일러와 필터 없음.
Smooth Edges; the N64, the PlayStation, the PSP and the 3DS at 2x. = 가장자리 다듬기. N64, PlayStation, PSP, 3DS는 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP and the 3DS at 3x. = 자연스러운 HD. N64와 PlayStation은 4x, PSP와 3DS는 3x.

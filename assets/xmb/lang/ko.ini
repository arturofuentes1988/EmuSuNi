# --- EmuSuNi 00.64: the 3DS at its own resolution, the touchpad as a trackpad
3DS: the console's own resolution only = 3DS: 콘솔 원래의 해상도만
Each console's own resolution (the N64, the PlayStation, the PSP and the DS at 1x), no upscaler and no filters. = 각 콘솔 원래의 해상도(N64, PlayStation, PSP, DS는 1x), 업스케일러와 필터 없음.
Smooth Edges; the N64, the PlayStation and the PSP at 2x. = 가장자리 다듬기. N64, PlayStation, PSP는 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP at 3x. = 자연스러운 HD. N64와 PlayStation은 4x, PSP는 3x.
Natural AI; the N64, the PlayStation and the PSP at 4x. = 자연스러운 AI. N64, PlayStation, PSP는 4x.
Trackpad = 트랙패드
Direct = 직접
As a laptop's trackpad: the finger moves the stylus from where it is (putting it down doesn't move it), a short tap touches the screen there. To drag: hold the touchpad's click and move, or tap and touch again at once and move. = 노트북 트랙패드처럼: 손가락으로 터치펜을 지금 위치에서 움직이고(손가락을 올려도 움직이지 않음), 짧게 두드리면 그 자리를 터치합니다. 끌려면 터치패드를 클릭한 채로 움직이거나, 두드린 뒤 바로 다시 대고 움직이세요.
The touchpad is the screen: the finger presses the stylus where it lands, as on the DS itself. = 터치패드가 곧 화면입니다: DS 실기처럼 손가락이 닿은 곳을 터치펜으로 누릅니다.
The touchpad is the screen: the finger presses the stylus where it lands, as on the 3DS itself. = 터치패드가 곧 화면입니다: 3DS 실기처럼 손가락이 닿은 곳을 터치펜으로 누릅니다.
How the DualShock 4's touchpad is the DS's touch screen. The stylus stays where it was left; the right stick moves it too; the Tap button is set in Controls. = DualShock 4의 터치패드를 DS 터치스크린으로 쓰는 방식입니다. 터치펜은 놓은 자리에 남고, 오른쪽 스틱으로도 움직이며, '화면 터치' 버튼은 조작에서 지정합니다.

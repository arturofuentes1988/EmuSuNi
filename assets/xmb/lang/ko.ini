Every game at 60 (PAL games run faster than on their console). = 모든 게임을 60으로(PAL 게임은 원래 본체보다 빠르게 실행됩니다).
Every game at 50 (NTSC games run slower). = 모든 게임을 50으로(NTSC 게임은 느리게 실행됩니다).
As fast as the PS4 can (up to 4x). = PS4가 낼 수 있는 최고 속도(최대 4x).
Smooth movement, no tearing. = 부드러운 움직임, 화면 찢어짐 없음.

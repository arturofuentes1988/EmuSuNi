What is RetroAchievements? = RetroAchievements란?
How to start (a free account, the login here), what achievements and points are, the consoles and the files it knows. = 시작하는 방법(무료 계정, 여기서 로그인), 업적과 포인트, 지원하는 콘솔과 파일을 알려 줍니다.
What it is = 소개
RetroAchievements (retroachievements.org) adds achievements to classic games: goals inside each game - beat a boss, find a secret, finish a level fast - unlocked as you play, each with its points. It's free, made by its players. = RetroAchievements(retroachievements.org)는 클래식 게임에 업적을 더합니다: 각 게임 안의 목표 - 보스 물리치기, 비밀 찾기, 스테이지 빨리 깨기 - 를 플레이하면서 달성하며, 업적마다 포인트가 있습니다. 무료이며 플레이어들이 만듭니다.
1. A free account = 1. 무료 계정
Make one at retroachievements.org, on a phone or a computer, and confirm the e-mail it sends you: until then it refuses the login. = 휴대폰이나 컴퓨터로 retroachievements.org에서 계정을 만들고, 사이트가 보내는 이메일을 확인하세요: 그 전에는 로그인이 거부됩니다.
2. Log in here = 2. 여기서 로그인
Settings -> RetroAchievements -> Log In: the keyboard asks for your user name, then your password. EmuSuNi keeps only the key the site gives back (never the password) and logs in again by itself at each start. = 설정 -> RetroAchievements -> 로그인: 키보드로 사용자 이름과 비밀번호를 차례로 입력합니다. EmuSuNi는 사이트가 돌려준 키만 보관하고(비밀번호는 보관하지 않음) 시작할 때마다 알아서 다시 로그인합니다.
3. Play = 3. 플레이
A game with achievements says so when it starts; each unlock shows a picture. The in-game menu's Achievements lists them with your progress; My Achievements keeps what you unlocked; Triangle -> Achievements on a game shows them all. = 업적이 있는 게임은 시작할 때 알려 주고, 업적을 달성할 때마다 이미지가 나옵니다. 게임 내 메뉴의 '업적'은 진행도와 함께 목록을 보여 주고, '내 업적'은 달성한 업적을 보관하며, 게임에서 세모 -> 업적을 고르면 모두 보여 줍니다.
Casual and points = 캐주얼과 포인트
EmuSuNi plays in RetroAchievements' Casual mode: save states, cheats and any speed are allowed, and the points go to your account. (Its Hardcore mode waits until RetroAchievements approves EmuSuNi.) = EmuSuNi는 RetroAchievements의 캐주얼 모드로 플레이합니다: 상태 저장, 치트, 속도 변경이 모두 허용되며 포인트는 계정에 쌓입니다. (하드코어 모드는 RetroAchievements가 EmuSuNi를 승인한 뒤에 지원합니다.)
The consoles = 콘솔
With achievements: {}. Not yet: Nintendo 3DS. = 업적 있음: {}. 아직 없음: Nintendo 3DS.
Which files = 지원 파일
RetroAchievements knows certain files of each game - most often the usual dumps of its American, European or Japanese version (No-Intro's for cartridges, Redump's for discs); not translations or hacks. The "RA" mark on a cover says the file is known; Triangle -> Achievements on a game without it shows the files it knows. = RetroAchievements는 각 게임의 특정 파일만 압니다 - 대부분 미국판, 유럽판, 일본판의 일반적인 덤프(카트리지는 No-Intro, 디스크는 Redump)이며, 번역판이나 핵은 아닙니다. 표지의 "RA" 표시는 그 파일을 안다는 뜻이고, 표시가 없는 게임에서 세모 -> 업적을 고르면 지원하는 파일을 보여 줍니다.
Without a connection = 연결이 없을 때
The game plays as always. Unlocks made offline wait and are sent when the connection comes back, while EmuSuNi stays open; My Achievements shows what this PS4 kept. = 게임은 평소처럼 작동합니다. 오프라인에서 달성한 업적은 대기했다가 연결이 돌아오면 보냅니다(EmuSuNi가 열려 있는 동안). '내 업적'에서 이 PS4에 보관된 기록을 볼 수 있습니다.
RetroAchievements: every achievement of the game, unlocked or not, with your progress; for a file it doesn't know, the files of the game it knows. = RetroAchievements: 게임의 모든 업적을 달성 여부, 진행도와 함께 보여 줍니다. 모르는 파일이면 그 게임의 지원 파일을 보여 줍니다.
Not logged in: its achievements show here once you log in (Settings -> RetroAchievements -> Log In) = 로그인 안 함: 로그인하면 여기에 업적이 나옵니다(설정 -> RetroAchievements -> 로그인)

Game Boy Colours = Game Boy 색상
As a Game Boy Color showed them: its own colours for Nintendo's games, green and blue for the others. = Game Boy Color가 보여 주던 대로: Nintendo 게임은 전용 색상, 다른 게임은 초록과 파랑.
Game Boy (green) = Game Boy (초록)
The first Game Boy's green screen. = 초대 Game Boy의 초록 화면.
The Pocket's grey and black screen. = Pocket의 회색과 검은색 화면.
Game Boy Light = Game Boy Light
The Light's blue-green backlight. = Light의 청록색 백라이트.
Grey = 회색
Four clean shades of grey. = 깔끔한 회색 네 단계.
Super Game Boy = Super Game Boy
As the Super Nintendo's Super Game Boy: the colours and the border the game made for it (Pokémon, Donkey Kong, Kirby...); a TV's picture, a little faster. = Super Nintendo의 Super Game Boy처럼: 게임이 전용으로 만든 색상과 테두리(Pokémon, Donkey Kong, Kirby...). TV 화면이며 조금 더 빠릅니다.
The colours of the Game Boy's games (not those made for the Game Boy Color). = Game Boy 게임의 색상입니다(Game Boy Color용 게임 제외).
Screen Colours = 화면 색상
Vivid (as made) = 생생하게 (원본)
The colours the game made, bright and strong. = 게임이 만든 그대로의 밝고 진한 색.
Handheld Screen = 휴대기 화면
As the handheld's screen showed them: softer, more natural colours. = 휴대기 화면에 보이던 대로: 더 부드럽고 자연스러운 색.
The games were made bright for the handheld's dark screen; Handheld Screen shows them as they looked on it. = 게임은 휴대기의 어두운 화면에 맞춰 밝게 만들어졌습니다. 휴대기 화면은 그 화면에서 보이던 대로 보여 줍니다.
LCD Ghosting = LCD 잔상
Every frame as it is: the sharpest. = 모든 프레임을 그대로: 가장 선명합니다.
Smart = 스마트
Only what flickers is blended: the see-through effects games made by flickering (F-Zero, Boktai, Wave Race) look as on the handheld. = 깜빡이는 부분만 섞습니다: 깜빡임으로 만든 반투명 효과(F-Zero, Boktai, Wave Race)가 휴대기에서처럼 보입니다.
Blend Frames = 프레임 섞기
Every frame blended with the one before. = 모든 프레임을 이전 프레임과 섞습니다.
Moving things leave a short trail, as on the slow screen of the handheld. = 휴대기의 느린 화면처럼 움직이는 것이 짧은 잔상을 남깁니다.
The handheld's screen kept a little of the frame before; some games count on it. = 휴대기 화면에는 이전 프레임이 조금 남았고, 이를 활용한 게임도 있습니다.
Boot Logo (BIOS) = 부팅 로고 (BIOS)

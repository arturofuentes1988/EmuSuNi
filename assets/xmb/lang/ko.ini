Then choose Copy the Firmware. The first PS Vita game installs them by itself, once: it takes a few minutes. = 그다음 펌웨어 복사를 선택하세요. 첫 PS Vita 게임이 한 번만 직접 설치합니다: 몇 분 걸립니다.

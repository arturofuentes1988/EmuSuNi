The usual balance. = 일반적인 균형.
Less delay; may crackle when the PS4 is busy. = 지연이 적지만 PS4가 바쁠 때 지직거릴 수 있습니다.
Smoother sound in heavy games, a little more delay. = 무거운 게임에서 소리가 부드럽고, 지연이 조금 늘어납니다.
The smoothest sound, the most delay. = 가장 부드러운 소리, 가장 큰 지연.
Two players. = 2인.
Up to five players with more DualShock 4s. = DualShock 4를 더 연결해 최대 5인.
Each start begins from the game's own start (or its battery save). = 매번 게임의 처음부터(또는 배터리 세이브부터) 시작합니다.
Quit Game keeps the moment you left; the next start goes on from there. = '게임 종료'가 그만둔 순간을 저장하고, 다음에 시작할 때 거기서부터 이어집니다.

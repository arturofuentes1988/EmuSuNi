# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = 화면 설정을 한 번에 단계별로 맞춥니다: 해상도, 업스케일링(CPU와 GPU), 화면 크기, N64의 크기, 동기화, 2D. 그중 하나를 바꾸면 사용자 지정이 됩니다. 게임에 바로 반영되지만, N64의 크기와 동기화는 다음에 게임을 시작할 때 바뀝니다. Dreamcast는 항상 낮음으로 실행됩니다(아직 PS4로는 더 할 수 없습니다).
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = 3D의 계단 현상을 부드럽게 합니다(GPU 멀티샘플링). 게임 중에 바꾸면 3D를 다시 준비하므로 몇 초간 끊길 수 있습니다.

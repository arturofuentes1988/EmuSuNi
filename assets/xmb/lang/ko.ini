# --- EmuSuNi 01.02: PSP online
PSP Online = PSP 온라인
No network: a game's network menu says it can't connect. = 네트워크 없음: 게임의 네트워크 메뉴가 연결할 수 없다고 표시합니다.
The PSP's Wi-Fi: the games' own servers where fans revived them (FIFA, MotorStorm, WipEout, SOCOM...) and ad hoc play through PSP Ad Hoc Server (Monster Hunter, Tekken 6, Dissidia...). = PSP의 Wi-Fi: 팬들이 되살린 게임 자체 서버(FIFA, MotorStorm, WipEout, SOCOM...)와 PSP 애드혹 서버를 통한 애드혹 플레이(Monster Hunter, Tekken 6, Dissidia...).
Online play for PSP games, from the game's own network menu or ad hoc mode. Nothing is sent until the game connects. The servers see your public IP, as with a real PSP; other players never do (ad hoc goes through the server's relay). Your name in the games is your online nickname (or EmuSuNi- and a code of this PS4's own). = PSP 게임의 온라인 플레이를 게임 자체의 네트워크 메뉴나 애드혹 모드에서 합니다. 게임이 연결하기 전에는 아무것도 보내지 않습니다. 실제 PSP처럼 서버에는 내 공인 IP가 보이지만, 다른 플레이어에게는 보이지 않습니다(애드혹은 서버의 중계를 거침). 게임 속 이름은 온라인 닉네임입니다(없으면 EmuSuNi-와 이 PS4 고유 코드).
PSP Ad Hoc Server = PSP 애드혹 서버
Socom (France) = Socom (프랑스)
The most players, any game. = 플레이어가 가장 많고, 모든 게임 지원.
Madness Gaming Network (USA) = Madness Gaming Network (미국)
Any game; many Monster Hunter players. = 모든 게임 지원. Monster Hunter 플레이어가 많습니다.
Psi-Hate (USA) = Psi-Hate (미국)
Any game. = 모든 게임 지원.
Relay Brasileiro (Brazil) = Relay Brasileiro (브라질)
Any game; the nearest to South America. = 모든 게임 지원. 남미에서 가장 가깝습니다.
Sprawl Relay (Brazil) = Sprawl Relay (브라질)
The server ad hoc games meet through, with PSP Online on. Players who want to play together must choose the same one. = PSP 온라인이 켜져 있을 때 애드혹 게임이 서로 만나는 서버입니다. 함께 플레이하려면 같은 서버를 골라야 합니다.


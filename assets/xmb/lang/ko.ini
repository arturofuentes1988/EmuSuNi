The N64 emulation stopped: this game did something the emulator can't do. For this game, try N64 CPU: Cached Interpreter, or N64 RSP: ParaLLEl (recompiler). = N64 에뮬레이션이 멈췄습니다: 이 게임이 에뮬레이터가 할 수 없는 동작을 했습니다. 이 게임에서는 N64 CPU: 캐시 인터프리터, 또는 N64 RSP: ParaLLEl (리컴파일러)을 시도해 보세요.


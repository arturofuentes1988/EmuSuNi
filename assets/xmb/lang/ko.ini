Softens the handhelds' sharp sound. = 휴대기의 날카로운 소리를 부드럽게 합니다.
# --- EmuSuNi 00.30: GoldenEye 007 smoother
N64 CPU Timing = N64 CPU 타이밍
Light for GoldenEye 007; Normal for the other games. = GoldenEye 007은 가볍게, 다른 게임은 보통.
Normal = 보통
The emulator's own timing: the most frames the game can draw. = 에뮬레이터 자체 타이밍: 게임이 그릴 수 있는 최대한의 프레임.
Light (as the N64) = 가볍게 (N64처럼)
The N64's processor a little slower against its clock: a game that drew few frames on the console draws about as few, and the PS4 has much less to do (GoldenEye: about a third less). The game keeps its speed; loading takes longer. = 클럭에 비해 N64 프로세서를 조금 느리게: 본체에서 프레임을 적게 그리던 게임은 비슷하게 적게 그리고, PS4의 부담이 크게 줄어듭니다(GoldenEye: 약 3분의 1 감소). 게임 속도는 유지되고 로딩은 길어집니다.
How much the N64's processor does between two pictures. Light keeps heavy games (GoldenEye 007) smooth on the PS4. = 두 화면 사이에 N64 프로세서가 하는 작업량입니다. 가볍게는 무거운 게임(GoldenEye 007)을 PS4에서 부드럽게 유지합니다.

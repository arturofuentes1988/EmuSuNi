# --- EmuSuNi 00.70: the 3DS CPU Clock's texts (a lower clock seldom saves the PS4 any work)
The game sees a slower 3DS. Less work for the PS4 only in a game that keeps the processor busy without a break; most wait for their next picture and cost the same. = 게임에는 더 느린 3DS로 보입니다. 프로세서를 쉬지 않고 쓰는 게임에서만 PS4 작업이 줄고, 대부분은 다음 화면을 기다리므로 부담이 같습니다.
The game sees a 3DS at half speed: a game that needs the speed slows down or stutters. = 게임에는 절반 속도의 3DS로 보입니다: 속도가 필요한 게임은 느려지거나 끊깁니다.
How fast the emulated 3DS's processor runs. Most games wait for their next picture, so a lower clock seldom saves the PS4 any work (none in the games tried); a game that needs the speed slows down or freezes. = 에뮬레이션하는 3DS 프로세서의 속도입니다. 대부분의 게임은 다음 화면을 기다리므로 클럭을 낮춰도 PS4 작업이 줄어드는 경우는 드뭅니다(시험한 게임에서는 없음). 속도가 필요한 게임은 느려지거나 멈춥니다.


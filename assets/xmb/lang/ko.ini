# --- 00.68: the Dreamcast's Quality levels
Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the Dreamcast at 1x), no upscaler and no filters. = 각 콘솔 원래의 해상도(N64, PlayStation, PSP, DS, Dreamcast는 1x), 업스케일러와 필터 없음.
Smooth Edges; the N64, the PlayStation, the PSP and the Dreamcast at 2x. = 가장자리 다듬기. N64, PlayStation, PSP, Dreamcast는 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP and the Dreamcast at 3x. = 자연스러운 HD. N64와 PlayStation은 4x, PSP와 Dreamcast는 3x.
Natural AI; the N64, the PlayStation and the PSP at 4x, the Dreamcast at 3x with the sharpest textures. = 자연스러운 AI. N64, PlayStation, PSP는 4x, Dreamcast는 3x에 가장 선명한 텍스처.
The Dreamcast's own 640x480 picture: the lightest. = Dreamcast 원래의 640x480 화면: 가장 가볍습니다.
Twice the size (1280x960): sharper 3D. = 2배 크기(1280x960): 3D가 더 선명합니다.
Three times (1920x1440), made smaller for a 1080p TV: the sharpest 3D, the smoothest edges. = 3배(1920x1440)를 1080p TV에 맞게 줄임: 가장 선명한 3D, 가장 부드러운 가장자리.
The size the GPU draws Dreamcast, NAOMI and Atomiswave games at: real HD 3D, not an enlarged picture. The size changes at the next start. = GPU가 Dreamcast, NAOMI, Atomiswave 게임을 그리는 크기입니다: 확대한 화면이 아닌 진짜 HD 3D. 크기는 다음에 시작할 때 바뀝니다.
How sharp the textures of far, slanted surfaces stay (anisotropic filtering, on the GPU). It changes at the next game start. = 멀고 비스듬한 표면의 텍스처가 얼마나 선명한지 정합니다(GPU 이방성 필터링). 다음에 게임을 시작할 때 바뀝니다.
The console's own resolution (640x480), textures 4x sharp far away: the lightest. The size changes at the next start. = 콘솔 원래의 해상도(640x480), 먼 텍스처 선명도 4x: 가장 가볍습니다. 크기는 다음에 시작할 때 바뀝니다.
2x (1280x960), textures 8x sharp far away. The size changes at the next start. = 2x(1280x960), 먼 텍스처 선명도 8x. 크기는 다음에 시작할 때 바뀝니다.
3x (1920x1440, made smaller for the TV), textures 8x sharp far away. The size changes at the next start. = 3x(1920x1440, TV에 맞게 줄임), 먼 텍스처 선명도 8x. 크기는 다음에 시작할 때 바뀝니다.
3x (1920x1440), the sharpest textures far away (16x). The size changes at the next start. = 3x(1920x1440), 가장 선명한 먼 텍스처(16x). 크기는 다음에 시작할 때 바뀝니다.
# --- 00.68: the N64 (Graphics Sync for Cruis'n USA and Resident Evil 2, Ultra's 2D Exact)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA and Resident Evil 2 play Accurate anyway (with Fast they stay on a black screen). = N64가 실행되는 동안 GPU가 그립니다: PS4에서 훨씬 부드럽습니다. Cruis'n USA와 Resident Evil 2는 항상 정확으로 실행됩니다(빠름에서는 검은 화면에 멈춥니다).
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens), or a game that goes black with Fast. = N64가 화면마다 기다립니다: 더 느립니다. 효과에서 화면을 다시 읽는 일부 게임(카메라 사진, 일부 일시 정지 화면)이나 빠름에서 화면이 검게 되는 게임용입니다.
Text, icons and 2D backgrounds at the N64 Resolution: smoother, but many games show lines or squares where their pieces meet (Zelda's pre-drawn rooms, ISS 64's intro). = N64 해상도로 그린 글자, 아이콘, 2D 배경: 더 부드럽지만 많은 게임에서 조각이 만나는 곳에 선이나 네모가 보입니다(Zelda의 미리 그린 방, ISS 64의 인트로).
4x (960p) with Natural AI. The size changes at the next start. = 4x(960p)에 자연스러운 AI. 크기는 다음에 시작할 때 바뀝니다.


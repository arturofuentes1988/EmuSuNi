# --- EmuSuNi 00.81: the 3DS's graphics errors (Accurate Shader Multiplication and 3DS Right Eye, per game)
Accurate Shader Multiplication = 정확한 셰이더 곱셈
On in the games known to need it (the Pokémon games from X and Y to Ultra Sun and Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Off in the others. = 필요하다고 알려진 게임(Pokémon X와 Y부터 Ultra Sun과 Ultra Moon까지, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate)에서는 켜기, 그 밖의 게임에서는 끄기.
Multiplies in the shaders exactly as the 3DS does: models, lights and effects drawn right. A little more work for the GPU. = 셰이더에서 3DS와 똑같이 곱셈합니다: 모델, 조명, 효과가 제대로 그려집니다. GPU 부담이 조금 늘어납니다.
The faster multiplication: most games look the same with it. = 더 빠른 곱셈: 대부분의 게임은 똑같이 보입니다.
How the GPU's shaders multiply: exactly as the 3DS does, or faster. Without it a few games draw white, too bright or black models and effects. (Ocarina of Time 3D and the Mario & Luigi games always use it.) = GPU 셰이더의 곱셈 방식: 3DS와 똑같이, 또는 더 빠르게. 이 설정이 꺼져 있으면 일부 게임에서 모델과 효과가 하얗게, 너무 밝게 또는 검게 그려집니다. (Ocarina of Time 3D와 Mario & Luigi 게임은 항상 사용합니다.)
3DS Right Eye = 3DS 오른쪽 눈
Not drawn, but drawn in the games known to need it (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition). = 그리지 않지만, 필요하다고 알려진 게임(Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition)에서는 그립니다.
Not Drawn (faster) = 그리지 않음 (빠름)
The PS4 shows no 3D, so the right eye's picture is left out: less work in the games that draw both eyes. = PS4는 3D를 표시하지 않으므로 오른쪽 눈 화면을 생략합니다: 양쪽 눈을 그리는 게임에서 부담이 줄어듭니다.
Drawn = 그림
As on the 3DS: for a game whose screen stays black, freezes on an effect or is out of place. Slower in the games that draw both eyes. = 3DS와 같음: 화면이 검게 남거나, 효과에서 멈추거나, 위치가 어긋나는 게임용입니다. 양쪽 눈을 그리는 게임에서는 느려집니다.
3DS games draw a second picture for the 3D effect, the right eye's, which the PS4 never shows. Leaving it out is faster (Super Mario 3D Land then draws half as much), but a few games show a black, frozen or misplaced screen. = 3DS 게임은 3D 효과를 위해 오른쪽 눈용 두 번째 화면을 그리지만, PS4에서는 표시되지 않습니다. 생략하면 더 빠르지만(Super Mario 3D Land는 절반만 그림), 일부 게임은 화면이 검게 되거나, 멈추거나, 어긋납니다.


4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA), made crisper (Natural HD). = 4x(960p), 부드러운 텍스처, 안정된 3D, 4x 안티앨리어싱(MSAA), 더 또렷하게(자연스러운 HD).

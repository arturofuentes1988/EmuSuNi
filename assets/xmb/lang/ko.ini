A black Game Boy Advance with silver lines. = 은색 선이 있는 검은색 Game Boy Advance.
Dark lines between the picture's rows, like a CRT TV; on the Game Boys, the grid between their screen's dots. = CRT TV처럼 화면의 줄 사이에 어두운 선을 넣습니다. Game Boy에서는 화면 점 사이의 격자입니다.
The picture's shape on the TV. 4:3 is how the consoles looked on a TV; the Game Boys keep their screen's own shape. = TV에 나오는 화면의 모양입니다. 4:3은 옛 TV에서 본체 화면이 보이던 비율이고, Game Boy는 원래 화면 모양을 유지합니다.
xBRZ, then a neural network (Anime4K) cleans every edge and curve: the smoothest HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ 다음에 신경망(Anime4K)이 모든 가장자리와 곡선을 다듬습니다: SNES, NES, Game Boy에 가장 부드러운 HD 느낌. N64는 부드러운 HD를 씁니다.

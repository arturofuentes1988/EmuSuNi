The picture in one choice: Low is the console's own; each level above is sharper and more work for the PS4. Changing one of its settings makes it Custom. = 화면을 한 번에 고릅니다: 낮음은 콘솔 원래의 화면이고, 단계가 높을수록 더 선명하지만 PS4 부담이 커집니다. 설정을 하나라도 바꾸면 사용자 지정이 됩니다.
The console's own resolution: its picture as it made it, made bigger for the TV, with no filters. = 콘솔 원래의 해상도: 콘솔이 만든 화면을 필터 없이 TV에 맞게 키웁니다.
Smooth Edges: the GPU smooths the jagged edges; the pixels stay as they are. = 가장자리 다듬기: GPU가 계단 현상을 부드럽게 하고, 픽셀은 그대로 둡니다.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR). = 자연스러운 HD: 가장자리를 다듬은 뒤 TV 해상도의 선명한 HD 화면(AMD FSR).
Natural AI: Natural HD with an AI network (Anime4K) that cleans every edge; the textures stay. = 자연스러운 AI: 자연스러운 HD에 모든 가장자리를 다듬는 AI 네트워크(Anime4K)를 더하고, 텍스처는 살립니다.
The console's own resolution: both screens as the DS made them (256x192), with no filters. = 콘솔 원래의 해상도: DS가 만든 그대로의 두 화면(256x192), 필터 없음.
Smooth Edges on both screens: the GPU smooths the jagged edges. = 두 화면에 가장자리 다듬기: GPU가 계단 현상을 부드럽게 합니다.
Natural HD on both screens: smooth edges, then a sharp HD picture (AMD FSR). = 두 화면에 자연스러운 HD: 가장자리를 다듬은 뒤 선명한 HD 화면(AMD FSR).
Natural AI on both screens: Natural HD with an AI network (Anime4K) that cleans every edge. = 두 화면에 자연스러운 AI: 자연스러운 HD에 모든 가장자리를 다듬는 AI 네트워크(Anime4K)를 더합니다.
The console's own resolution, with no filters: the lightest. The size changes at the next start. = 필터 없는 콘솔 원래의 해상도: 가장 가볍습니다. 크기는 다음에 시작할 때 바뀝니다.
2x (480p) with Smooth Edges. The size changes at the next start. = 2x(480p)에 가장자리 다듬기. 크기는 다음에 시작할 때 바뀝니다.
4x (960p) with Natural HD. The size changes at the next start. = 4x(960p)에 자연스러운 HD. 크기는 다음에 시작할 때 바뀝니다.
4x (960p) with Natural AI, and smooth HD text and icons. The size changes at the next start. = 4x(960p)에 자연스러운 AI, 부드러운 HD 글자와 아이콘. 크기는 다음에 시작할 때 바뀝니다.
The console's own resolution (1x), its own textures and colours, with no filters. = 콘솔 원래의 해상도(1x)와 원래의 텍스처와 색, 필터 없음.
2x (480p), smooth textures (xBR) and true colour, with Smooth Edges. = 2x(480p), 부드러운 텍스처(xBR), 트루 컬러, 가장자리 다듬기.
4x (960p), smooth textures, true colour and steady 3D (PGXP), with Natural HD. = 4x(960p), 부드러운 텍스처, 트루 컬러, 안정된 3D(PGXP), 자연스러운 HD.
4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA) and Natural AI. = 4x(960p), 부드러운 텍스처, 안정된 3D, 4x 안티앨리어싱(MSAA), 자연스러운 AI.
The console's own resolution (480x272), with no filters. = 콘솔 원래의 해상도(480x272), 필터 없음.
2x (960x544), sharper textures far away, with Smooth Edges. = 2x(960x544), 더 선명한 먼 텍스처, 가장자리 다듬기.
3x (1440x816), the sharpest textures far away, with Natural HD. = 3x(1440x816), 가장 선명한 먼 텍스처, 자연스러운 HD.
4x (1920x1088, Full HD), the sharpest textures far away, made crisper (Natural HD). = 4x(1920x1088, Full HD), 가장 선명한 먼 텍스처, 더 또렷하게(자연스러운 HD).
The console's own resolution (400x240 and 320x240): the lightest. The size changes at the next start. = 콘솔 원래의 해상도(400x240, 320x240): 가장 가볍습니다. 크기는 다음에 시작할 때 바뀝니다.
2x (800x480): sharper 3D, more work for the GPU. The size changes at the next start. = 2x(800x480): 3D가 더 선명하지만 GPU 작업이 늘어납니다. 크기는 다음에 시작할 때 바뀝니다.
3x (1200x720): the sharpest, for the lighter games. The size changes at the next start. = 3x(1200x720): 가장 선명하며 가벼운 게임용입니다. 크기는 다음에 시작할 때 바뀝니다.
3x, as High: the most the 3DS has for now (no GPU filters for it yet). The size changes at the next start. = 3x, 높음과 같음: 지금 3DS의 최대치입니다(아직 3DS용 GPU 필터 없음). 크기는 다음에 시작할 때 바뀝니다.

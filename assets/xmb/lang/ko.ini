Text, icons and 2D backgrounds as the N64 drew them: blocky, without seams. = N64가 그린 그대로의 글자, 아이콘, 2D 배경: 각지지만 이음매가 없습니다.
Smooth (HD) = 부드럽게 (HD)
Text, icons and 2D backgrounds at the N64 Resolution: smoother; some games show thin lines between their pieces. = N64 해상도로 그린 글자, 아이콘, 2D 배경: 더 부드럽지만 일부 게임은 조각 사이에 가는 선이 보입니다.
How the HUD, text and 2D pictures are drawn above Native resolution. = 원본보다 높은 해상도에서 HUD, 글자, 2D 이미지를 그리는 방식입니다.
N64 Distant Textures = N64 먼 텍스처
Sharp (HD) = 선명하게 (HD)
Far textures as sharp as the N64 Resolution allows. = 먼 텍스처를 N64 해상도가 허용하는 만큼 선명하게.
As the N64 = N64처럼
Far textures as blurry as on the N64: for the few games that swap textures with the distance. = 먼 텍스처를 N64처럼 흐릿하게: 거리에 따라 텍스처를 바꾸는 일부 게임용.
The texture detail of far surfaces above Native resolution. = 원본보다 높은 해상도에서 먼 표면의 텍스처 디테일입니다.
N64 Screen Effects = N64 화면 효과
Blurs, pause screens and photos made from the game's own picture, at the N64's size. = 게임 화면으로 만든 흐림, 일시 정지 화면, 사진을 N64 크기로 만듭니다.
Smooth (SSAA) = 부드럽게 (SSAA)
Those effects made from the sharp picture: smoother; a few games glitch. = 그 효과를 선명한 화면으로 만듭니다: 더 부드럽지만 일부 게임은 오류가 납니다.
Effects some games make from their own picture (pause backgrounds, motion blur), above Native resolution. = 원본보다 높은 해상도에서 일부 게임이 자기 화면으로 만드는 효과입니다(일시 정지 배경, 모션 블러).
Four times (about Full HD): the sharpest; heavy games can slow down. = 4배(Full HD 정도): 가장 선명하지만 무거운 게임은 느려질 수 있습니다.
Sharper: SNES and NES redrawn at 3x (xBRZ); the N64 at 2x. = 더 선명: SNES와 NES는 3x로 다시 그리고(xBRZ), N64는 2x.
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 4x; heavy N64 games can slow down. = 가장 선명: SNES와 NES는 6x(xBRZ), N64는 4x. 무거운 N64 게임은 느려질 수 있습니다.
# --- EmuSuNi 00.27: Ultra and the GPU's filters
Ultra (maximum) = 울트라 (최대)
The best each console can do: SNES and NES redrawn by the GPU with xBRZ and an AI network (Anime4K); the N64 at 4x with HD 2D, sharpened. Heavy N64 games can slow down. = 각 콘솔의 최고 화질: SNES와 NES는 GPU가 xBRZ와 AI 네트워크(Anime4K)로 다시 그리고, N64는 4x에 HD 2D와 샤프닝. 무거운 N64 게임은 느려질 수 있습니다.
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = 화면 설정을 한 번에 단계별로 맞춥니다: 해상도, 업스케일링(CPU와 GPU), 화면 크기, N64의 크기, 동기화, 2D. 그중 하나를 바꾸면 사용자 지정이 됩니다.
GPU Upscaler = GPU 업스케일러
The picture as Resolution and the Upscaling Filter make it. = 해상도와 업스케일링 필터가 만든 그대로의 화면.
Pixel Art HD (xBRZ) = 픽셀 아트 HD (xBRZ)
SNES and NES redrawn by the GPU at the TV's full resolution: rounded, clean edges without blur; frees the CPU. The N64 gets Smooth HD. = SNES와 NES를 GPU가 TV의 최대 해상도로 다시 그립니다: 흐림 없이 둥글고 깔끔한 가장자리, CPU 부담이 줄어듭니다. N64는 부드러운 HD를 씁니다.
AI (xBRZ + Anime4K) = AI (xBRZ + Anime4K)
xBRZ, then a neural network (Anime4K) cleans every edge and curve: the smoothest HD look for SNES and NES. The N64 gets Smooth HD. = xBRZ 다음에 신경망(Anime4K)이 모든 가장자리와 곡선을 다듬습니다: SNES와 NES에 가장 부드러운 HD 느낌. N64는 부드러운 HD를 씁니다.
Smooth HD (AMD FSR) = 부드러운 HD (AMD FSR)
AMD FidelityFX Super Resolution: smooth upscaling with sharp edges, made for 3D (the N64 at Native and 2x; at 4x it sharpens). = AMD FidelityFX Super Resolution: 가장자리가 선명한 부드러운 업스케일링으로 3D용입니다(N64 원본과 2x. 4x에서는 샤프닝만).
HD Sharpen (AMD RCAS) = HD 샤프닝 (AMD RCAS)
The picture as it is, made crisper by AMD's sharpening (RCAS): for the N64 at 4x and pictures already made bigger. = 화면을 그대로 AMD 샤프닝(RCAS)으로 더 또렷하게: 4x의 N64와 이미 확대된 화면용.
Draws the picture with the GPU's filters at the TV's resolution. Pixel Art HD, AI and Smooth HD start from the console's own picture: Resolution and the Upscaling Filter are left out. = GPU 필터로 TV 해상도에 맞춰 화면을 그립니다. 픽셀 아트 HD, AI, 부드러운 HD는 콘솔 원래의 화면에서 시작하므로 해상도와 업스케일링 필터는 쓰지 않습니다.
N64 CPU Cores = N64 CPU 코어
Fixed = 고정
Each N64 thread on a PS4 core of its own: the emulation on core 2, its graphics commands on core 3. = N64 스레드마다 PS4 코어를 하나씩: 에뮬레이션은 코어 2, 그래픽 명령은 코어 3.
PS4's Choice = PS4가 선택
The PS4 moves the threads between its cores, as before 00.27. = 00.27 이전처럼 PS4가 스레드를 코어 사이에서 옮깁니다.
Which PS4 cores run an N64 game's threads. Fixed gives the emulation and its graphics thread a core each, so they run at the same time. = N64 게임의 스레드를 실행할 PS4 코어입니다. 고정은 에뮬레이션과 그래픽 스레드에 코어를 하나씩 주어 동시에 실행되게 합니다.
N64 Frame Pacing = N64 프레임 페이싱
Even (V-Sync) = 균일 (V-Sync)
Each refresh shows the frame the game should be at when the TV shows it: PAL's 50 frames come out even on the TV's 60, and a heavy frame doesn't make the next refresh jump two frames. = 화면을 갱신할 때마다 TV에 표시되는 시점에 맞는 프레임을 보여 줍니다: PAL의 50프레임이 TV의 60에서 고르게 나오고, 무거운 프레임 뒤에도 다음 갱신에서 두 프레임을 건너뛰지 않습니다.
By the Clock = 시간 기준
By the time each pass of the emulator took, as 00.27: it catches up with two frames in one refresh. = 00.27처럼 에뮬레이터가 한 번 도는 데 걸린 시간 기준: 한 번의 갱신에 두 프레임으로 따라잡습니다.
How the N64's frames are spread over the TV's refreshes with V-Sync on. = V-Sync가 켜져 있을 때 N64 프레임을 TV 화면 갱신에 나누는 방식입니다.
# --- EmuSuNi 00.28: the N64's picture one frame later
N64 Picture Timing = N64 화면 타이밍
One Frame Later = 1프레임 뒤
The graphics thread makes each picture while the N64 runs on: at 4x up to 3 ms less per frame; the picture is shown one frame (17-20 ms) later. = N64가 계속 실행되는 동안 그래픽 스레드가 화면을 만듭니다: 4x에서 프레임당 최대 3 ms 단축, 화면은 1프레임(17-20 ms) 늦게 나옵니다.
At Once = 즉시
The N64 waits at every frame until its picture is made, as before. = 이전처럼 N64가 프레임마다 화면이 완성될 때까지 기다립니다.
When the N64's picture is made: by the graphics thread one frame later (faster), or at once. = N64 화면을 만드는 시점: 그래픽 스레드가 1프레임 뒤에(더 빠름) 또는 즉시.

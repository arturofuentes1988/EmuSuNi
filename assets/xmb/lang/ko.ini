# --- EmuSuNi 00.85: fixes (the in-game menu's buttons pressed without the hold, Menu Size)
The right stick pressed: the menu opens at once. A game that uses R3 doesn't get it any more; on the DS and the 3DS, R3 then opens the menu instead of swapping the screens. = 오른쪽 스틱을 누르면 메뉴가 바로 열립니다. R3를 쓰는 게임에는 더 이상 입력되지 않으며, DS와 3DS에서는 R3가 화면 바꾸기 대신 메뉴를 엽니다.
Both pressed together: the menu opens at once. One held and the other pressed later is the game's; a game that presses both at the same moment opens the menu. = 두 버튼을 함께 누르면 메뉴가 바로 열립니다. 하나를 누른 채 나중에 다른 하나를 누르면 게임 입력이 됩니다. 게임에서 두 버튼을 동시에 누르면 메뉴가 열립니다.
Both pressed together: the menu opens at once. One held and the other pressed later is the game's (a racing game's accelerator and brake); a game that presses both at the same moment opens the menu. = 두 버튼을 함께 누르면 메뉴가 바로 열립니다. 하나를 누른 채 나중에 다른 하나를 누르면 게임 입력이 됩니다(레이싱 게임의 액셀과 브레이크). 게임에서 두 버튼을 동시에 누르면 메뉴가 열립니다.
Menu Size = 메뉴 크기
The usual size. = 기본 크기.
A little smaller: a few more games in view. = 조금 작게: 게임이 몇 개 더 보입니다.
Smaller: more games in view. = 작게: 게임이 더 많이 보입니다.
The smallest: the most games in view (the Library's row: about 11 covers instead of 7). = 가장 작게: 게임이 가장 많이 보입니다(라이브러리 줄: 표지 7개 대신 약 11개).
How big the games are drawn in the menu (the XMB's list, the Library's covers): smaller shows more of them at once. = 메뉴에 게임을 그리는 크기입니다(XMB 목록, 라이브러리 표지): 작을수록 한 번에 더 많이 보입니다.
Smaller games in the menu: = 메뉴의 게임을 작게 그려
more of them on the screen at once, = 한 화면에 더 많이 보여 줍니다:
in the XMB's list and the = XMB 목록과
Library's row of covers. = 라이브러리 표지 줄.
It changes at once. = 바로 바뀝니다.
No picture = 이미지 없음


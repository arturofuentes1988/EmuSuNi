The console's own resolution (400x240 and 320x240), with no filters: the lightest. The size changes at the next start. = 필터 없는 콘솔 원래의 해상도(400x240, 320x240): 가장 가볍습니다. 크기는 다음에 시작할 때 바뀝니다.
2x (800x480) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 2x(800x480)에 가장자리 다듬기. 크기는 다음에 시작할 때 바뀌며, 화면을 다시 읽는 게임은 느려질 수 있습니다.

# --- EmuSuNi 00.70: the 3DS CPU Clock's texts (a lower clock seldom saves the PS4 any work)
The game sees a slower 3DS. Less work for the PS4 only in a game that keeps the processor busy without a break; most wait for their next picture and cost the same. = 游戏看到的是较慢的 3DS。只有在处理器一直满负荷的游戏中才会减轻 PS4 的工作量；大多数游戏会等待下一帧画面，负担不变。
The game sees a 3DS at half speed: a game that needs the speed slows down or stutters. = 游戏看到的是半速的 3DS：需要速度的游戏会变慢或卡顿。
How fast the emulated 3DS's processor runs. Most games wait for their next picture, so a lower clock seldom saves the PS4 any work (none in the games tried); a game that needs the speed slows down or freezes. = 模拟的 3DS 处理器的运行速度。大多数游戏会等待下一帧画面，因此降低频率很少能减轻 PS4 的工作量（测试过的游戏中都没有）；需要速度的游戏会变慢或卡死。

# --- EmuSuNi 00.71: the 3DS's Quality levels (3DS Resolution 1x to 4x on its pages, the GPU Upscaler's steps)
Each console's own resolution (the N64, the PlayStation, the PSP, the DS, the 3DS and the Dreamcast at 1x), no upscaler and no filters. = 各主机原本的分辨率（N64、PlayStation、PSP、DS、3DS 和 Dreamcast 为 1x），不放大，无滤镜。
Smooth Edges; the N64, the PlayStation, the PSP, the 3DS and the Dreamcast at 2x. = 平滑边缘；N64、PlayStation、PSP、3DS 和 Dreamcast 为 2x。
Pixel Art HD (the 3D consoles: Smooth Edges); the N64 at 4x, the PlayStation, the PSP, the 3DS and the Dreamcast at 3x. = 像素画 HD（3D 主机：平滑边缘）；N64 为 4x，PlayStation、PSP、3DS 和 Dreamcast 为 3x。
AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation, the PSP and the 3DS at 4x, the Dreamcast at 3x with the sharpest textures. = AI（3D 主机：锐化，自然 HD）；N64、PlayStation、PSP 和 3DS 为 4x，Dreamcast 为 3x 并使用最清晰的纹理。
Twice the size (800x480): sharper 3D. = 两倍尺寸（800x480）：3D 更清晰。
Three times (1200x720): sharper 3D still. = 三倍（1200x720）：3D 更加清晰。
Four times (1600x960, about Full HD): the sharpest 3D. = 四倍（1600x960，约 Full HD）：3D 最清晰。
The size the GPU draws 3DS games at: real HD 3D, not an enlarged picture. A bigger size is more work for the GPU only, but a game that reads its picture back (a few do, for effects) waits for it and can slow down. = GPU 绘制 3DS 游戏的尺寸：真正的 HD 3D，而不是放大的画面。尺寸越大只会增加 GPU 的工作量，但读回自身画面的游戏（少数游戏会这样做以实现效果）会等待画面，可能变慢。
The console's own resolution (400x240 and 320x240), with no filters: the lightest. The size changes at the next start. = 主机原本的分辨率（400x240 和 320x240），无滤镜：负担最轻。尺寸在下次启动时改变。
2x (800x480) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 2x（800x480），平滑边缘。尺寸在下次启动时改变；读回自身画面的游戏可能变慢。
3x (1200x720) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 3x（1200x720），平滑边缘。尺寸在下次启动时改变；读回自身画面的游戏可能变慢。
4x (1600x960), made crisper by AMD's sharpening (Natural HD). The size changes at the next start; a game that reads its picture back can slow down. = 4x（1600x960），用 AMD 的锐化使其更清晰（自然 HD）。尺寸在下次启动时改变；读回自身画面的游戏可能变慢。

# --- EmuSuNi 00.72: the N64 (Ogre Battle 64 plays with N64 Graphics Sync Accurate too)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA, Resident Evil 2 and Ogre Battle 64 play Accurate anyway (with Fast the first two stay on a black screen and Ogre Battle's backgrounds break). = GPU 在 N64 运行的同时绘制：在 PS4 上流畅很多。Cruis'n USA、Resident Evil 2 和 Ogre Battle 64 无论如何都以“准确”运行（使用“快速”时前两个会停在黑屏，Ogre Battle 的背景会出错）。


# --- EmuSuNi 00.81: the 3DS's graphics errors (Accurate Shader Multiplication and 3DS Right Eye, per game)
Accurate Shader Multiplication = 精确着色器乘法
On in the games known to need it (the Pokémon games from X and Y to Ultra Sun and Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Off in the others. = 在已知需要它的游戏中开启（Pokémon X / Y 到 Ultra Sun / Ultra Moon、Majora's Mask 3D、Metroid: Samus Returns、Castlevania: Mirror of Fate），其他游戏中关闭。
Multiplies in the shaders exactly as the 3DS does: models, lights and effects drawn right. A little more work for the GPU. = 在着色器中完全按 3DS 的方式做乘法：模型、光照和效果都能正确绘制。GPU 负担稍大。
The faster multiplication: most games look the same with it. = 更快的乘法：大多数游戏看起来没有区别。
How the GPU's shaders multiply: exactly as the 3DS does, or faster. Without it a few games draw white, too bright or black models and effects. (Ocarina of Time 3D and the Mario & Luigi games always use it.) = GPU 着色器的乘法方式：完全按 3DS 的方式，或更快的方式。关闭时，少数游戏的模型和效果会变成白色、过亮或黑色。（Ocarina of Time 3D 和 Mario & Luigi 系列始终使用它。）
3DS Right Eye = 3DS 右眼画面
Not drawn, but drawn in the games known to need it (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition). = 不绘制，但在已知需要的游戏中绘制（Majora's Mask 3D、Kingdom Hearts 3D、Pokémon Super Mystery Dungeon、Fire Emblem Warriors、Minecraft: New Nintendo 3DS Edition）。
Not Drawn (faster) = 不绘制（更快）
The PS4 shows no 3D, so the right eye's picture is left out: less work in the games that draw both eyes. = PS4 不显示 3D，因此省略右眼画面：在绘制双眼画面的游戏中减轻负担。
Drawn = 绘制
As on the 3DS: for a game whose screen stays black, freezes on an effect or is out of place. Slower in the games that draw both eyes. = 与 3DS 相同：用于一直黑屏、在某个效果处卡住或画面位置错乱的游戏。在绘制双眼画面的游戏中较慢。
3DS games draw a second picture for the 3D effect, the right eye's, which the PS4 never shows. Leaving it out is faster (Super Mario 3D Land then draws half as much), but a few games show a black, frozen or misplaced screen. = 3DS 游戏会为 3D 效果绘制第二个画面，即右眼画面，而 PS4 从不显示它。省略它更快（Super Mario 3D Land 的绘制量会减半），但少数游戏会出现黑屏、卡住或位置错乱的画面。


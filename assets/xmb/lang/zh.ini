Smooth colours: the N64's filter hides the dots of its 16-bit colours. = 平滑的颜色：N64 的滤镜会隐藏其 16 位色彩的点。
The dots stay: grainy skies, fog and shadows. = 保留这些点：天空、雾和阴影呈颗粒状。
The N64 drew its 16-bit colours with a pattern of dots; its video chip blended them away. = N64 用点状图案绘制 16 位色彩；其视频芯片会将这些点混合消除。
N64 2D Graphics = N64 2D 图形
Exact = 精确

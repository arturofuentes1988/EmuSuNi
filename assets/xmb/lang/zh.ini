# --- EmuSuNi 00.62: the Dreamcast's CPU clock and sound DSP, the 3DS experimental
Dreamcast CPU Clock = Dreamcast CPU 频率
100% (as the Dreamcast) = 100%（与 Dreamcast 相同）
The Dreamcast's own speed (200 MHz). = Dreamcast 本身的速度（200 MHz）。
The game sees a slower Dreamcast (180 MHz): less work for the PS4 where the game keeps up. = 游戏看到的是较慢的 Dreamcast（180 MHz）：在游戏跟得上的地方，PS4 的工作量更少。
160 MHz: less work still; more games slow down. = 160 MHz：工作量更少；更多游戏会变慢。
140 MHz: the lightest; the games that need the speed slow down. = 140 MHz：负担最轻；需要速度的游戏会变慢。
How fast the emulated Dreamcast's processor runs. Lower is lighter for the PS4, but some games then slow down. = 模拟的 Dreamcast 处理器的运行速度。越低 PS4 负担越轻，但部分游戏会因此变慢。
Dreamcast Sound DSP = Dreamcast 声音 DSP
The sound without the DSP's effects: lighter for the PS4. = 不带 DSP 效果的声音：PS4 负担更轻。
The Dreamcast's sound effects processor, as the games used it: more work for the PS4. = Dreamcast 的音效处理器，与游戏的用法相同：PS4 工作量更大。
The Dreamcast's sound effects processor (DSP). Some games' echo and reverb need it; Off is lighter for the PS4. = Dreamcast 的音效处理器（DSP）。部分游戏的回声和混响需要它；关闭可减轻 PS4 负担。
Nintendo 3DS: experimental = Nintendo 3DS：实验性
# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = 一次性将画面设为某个等级：分辨率、放大（CPU 和 GPU）、画面大小，以及 N64 的尺寸、同步和 2D。更改其中任何一项都会变为“自定义”。游戏中会立即显示变化，但 N64 的尺寸和同步要到下次启动游戏时才会改变。Dreamcast 始终以“低”运行（PS4 目前还无法更高）。
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = 平滑 3D 的锯齿边缘（多重采样，在 GPU 上）。在游戏运行时更改会重新设置 3D：可能会卡顿几秒钟。

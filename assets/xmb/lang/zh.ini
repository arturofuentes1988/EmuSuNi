# --- EmuSuNi 01.72: the PS Vita firmware's panel - what .PUP files are, where from, where to, each one's state
What Are .PUP Files? = 什么是 .PUP 文件？
A .PUP file is an official update of the PS Vita's system software, made by Sony. PS Vita games need three of them (firmware 3.74): the system, a preinstalled package and the fonts. = .PUP 文件是 Sony 制作的 PS Vita 系统软件官方更新。PS Vita 游戏需要其中三个（固件 3.74）：系统、预装包和字体。
They are Sony's: EmuSuNi doesn't include them or download them, and the PS4 never connects to Sony. = 它们属于 Sony：EmuSuNi 既不包含也不下载它们，PS4 也从不连接 Sony。
Download them on a computer, from PlayStation's official website: the PS Vita system software update. = 请在电脑上从 PlayStation 官方网站下载：PS Vita 系统软件更新。
Copy them, under any names, to Roms/psvita (or its firmware folder) on the USB drive, or to {} on the PS4. = 以任意文件名复制到 U 盘的 Roms/psvita（或其中的 firmware 文件夹），或复制到 PS4 的 {}。
Then choose Copy the Firmware. The first PS Vita game installs them by itself, once: it takes a few minutes. = 然后选择“复制固件”。第一个 PS Vita 游戏会自动安装一次，需要几分钟。
Missing = 缺少
Not Sony's file = 不是 Sony 的文件
Found, to copy = 已找到，待复制
Takes Sony's three .PUP files from Roms/psvita, checks each one and keeps it for the first PS Vita game. = 从 Roms/psvita 取得 Sony 的三个 .PUP 文件，逐个检查并保留给第一个 PS Vita 游戏。
What the firmware's files are, where to get them and where to put them. = 固件文件是什么、从哪里获取、放到哪里。


# --- EmuSuNi 00.26: the N64's picture
N64 Anti-Aliasing = N64 抗锯齿
On (the N64's) = 开（N64 自带）
Smooth 3D edges, as the N64's video chip made them. = 平滑的 3D 边缘，与 N64 视频芯片的效果相同。

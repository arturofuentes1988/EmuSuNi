# --- EmuSuNi 00.27: Ultra and the GPU's filters
Ultra (maximum) = 极高（最高）
The best each console can do: SNES and NES redrawn by the GPU with xBRZ and an AI network (Anime4K); the N64 at 4x with HD 2D, sharpened. Heavy N64 games can slow down. = 每台主机的最佳效果：SNES 和 NES 由 GPU 用 xBRZ 和 AI 网络（Anime4K）重新绘制；N64 为 4x，2D 为 HD 并经过锐化。负载重的 N64 游戏可能变慢。
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = 一次性将画面设为某个等级：分辨率、放大（CPU 和 GPU）、画面大小，以及 N64 的尺寸、同步和 2D。更改其中任何一项都会变为“自定义”。
GPU Upscaler = GPU 放大
The picture as Resolution and the Upscaling Filter make it. = 画面由“分辨率”和“放大滤镜”决定。
Pixel Art HD (xBRZ) = 像素画 HD（xBRZ）
SNES and NES redrawn by the GPU at the TV's full resolution: rounded, clean edges without blur; frees the CPU. The N64 gets Smooth HD. = SNES 和 NES 由 GPU 以电视的完整分辨率重新绘制：边缘圆滑干净，不模糊；减轻 CPU 负担。N64 使用平滑 HD。
AI (xBRZ + Anime4K) = AI（xBRZ + Anime4K）
xBRZ, then a neural network (Anime4K) cleans every edge and curve: the smoothest HD look for SNES and NES. The N64 gets Smooth HD. = 先用 xBRZ，再由神经网络（Anime4K）清理每条边缘和曲线：SNES 和 NES 最平滑的 HD 效果。N64 使用平滑 HD。
Smooth HD (AMD FSR) = 平滑 HD（AMD FSR）
AMD FidelityFX Super Resolution: smooth upscaling with sharp edges, made for 3D (the N64 at Native and 2x; at 4x it sharpens). = AMD FidelityFX Super Resolution：平滑放大且边缘锐利，专为 3D 设计（N64 为原生和 2x 时；4x 时仅锐化）。
HD Sharpen (AMD RCAS) = HD 锐化（AMD RCAS）
The picture as it is, made crisper by AMD's sharpening (RCAS): for the N64 at 4x and pictures already made bigger. = 画面保持原样，用 AMD 的锐化（RCAS）使其更清晰：用于 4x 的 N64 和已放大的画面。
Draws the picture with the GPU's filters at the TV's resolution. Pixel Art HD, AI and Smooth HD start from the console's own picture: Resolution and the Upscaling Filter are left out. = 用 GPU 滤镜以电视分辨率绘制画面。像素画 HD、AI 和平滑 HD 从主机原本的画面开始处理：不使用“分辨率”和“放大滤镜”。
N64 CPU Cores = N64 CPU 核心
Fixed = 固定
Each N64 thread on a PS4 core of its own: the emulation on core 2, its graphics commands on core 3. = 每个 N64 线程使用独立的 PS4 核心：模拟在核心 2，图形命令在核心 3。
PS4's Choice = 由 PS4 决定
The PS4 moves the threads between its cores, as before 00.27. = PS4 在其核心之间移动线程，与 00.27 之前相同。
Which PS4 cores run an N64 game's threads. Fixed gives the emulation and its graphics thread a core each, so they run at the same time. = 哪些 PS4 核心运行 N64 游戏的线程。固定：模拟和图形线程各用一个核心，以便同时运行。
N64 Frame Pacing = N64 帧节奏
Even (V-Sync) = 均匀（垂直同步）
Each refresh shows the frame the game should be at when the TV shows it: PAL's 50 frames come out even on the TV's 60, and a heavy frame doesn't make the next refresh jump two frames. = 每次刷新都显示电视显示时游戏应处的帧：PAL 的 50 帧在电视的 60 帧上也能均匀显示，负载重的帧也不会让下一次刷新跳过两帧。
By the Clock = 按时钟
By the time each pass of the emulator took, as 00.27: it catches up with two frames in one refresh. = 按模拟器每轮所用的时间，与 00.27 相同：会在一次刷新中用两帧追赶。
How the N64's frames are spread over the TV's refreshes with V-Sync on. = 开启垂直同步时 N64 的帧在电视刷新中的分配方式。
# --- EmuSuNi 00.28: the N64's picture one frame later
N64 Picture Timing = N64 画面时机
One Frame Later = 延后一帧
The graphics thread makes each picture while the N64 runs on: at 4x up to 3 ms less per frame; the picture is shown one frame (17-20 ms) later. = 图形线程在 N64 继续运行时生成每帧画面：4x 时每帧最多少用 3 ms；画面延后一帧（17-20 ms）显示。
At Once = 立即
The N64 waits at every frame until its picture is made, as before. = N64 在每帧都等待画面生成，与以前相同。
When the N64's picture is made: by the graphics thread one frame later (faster), or at once. = N64 画面的生成时机：由图形线程延后一帧生成（更快），或立即生成。

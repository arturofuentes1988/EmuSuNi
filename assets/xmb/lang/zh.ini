Fills the whole screen, whatever its shape. = 填满整个屏幕，无论屏幕是什么形状。
The console's own 256x224 picture, enlarged by the TV (the fastest). = 主机原本的 256x224 画面，由电视放大（最快）。
Redrawn at 512x448 before it is fitted to the TV. = 先以 512x448 重新绘制，再适配到电视。

# --- EmuSuNi 00.21: the N64's speed
N64 Graphics Sync = N64 图形同步
Fast (asynchronous) = 快速（异步）
The GPU draws while the N64 runs: much smoother on the PS4. = GPU 在 N64 运行的同时绘制：在 PS4 上流畅很多。
Accurate (synchronous) = 准确（同步）
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens). = N64 等待每帧画面：较慢。用于少数效果需要读回屏幕画面的游戏（相机照片、部分暂停画面）。
Whether the N64 waits for the GPU's pictures (ParaLLEl-RDP's Synchronous RDP). = N64 是否等待 GPU 的画面（ParaLLEl-RDP 的 Synchronous RDP）。
The N64's own picture: the smoothest. = N64 原本的画面：最流畅。
Twice the size: sharper 3D; heavy scenes can slow down. = 两倍尺寸：3D 更清晰；繁重的场景可能变慢。
Four times: the sharpest; too heavy for most games on the PS4. = 四倍：最清晰；对 PS4 上的大多数游戏来说负担过重。
The size the GPU draws N64 games at (ParaLLEl-RDP). Native is the smoothest. = GPU 绘制 N64 游戏的尺寸（ParaLLEl-RDP）。原生最流畅。

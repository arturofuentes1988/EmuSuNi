How the HUD, text and 2D pictures are drawn above Native resolution. = 高于原生分辨率时 HUD、文字和 2D 图像的绘制方式。
N64 Distant Textures = N64 远处纹理
Sharp (HD) = 锐利（HD）
Far textures as sharp as the N64 Resolution allows. = 远处纹理达到 N64 分辨率允许的最清晰程度。
As the N64 = 与 N64 相同
Far textures as blurry as on the N64: for the few games that swap textures with the distance. = 远处纹理与 N64 上一样模糊：用于少数根据距离切换纹理的游戏。
The texture detail of far surfaces above Native resolution. = 高于原生分辨率时远处表面的纹理细节。

AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation and the PSP at 4x, the Dreamcast at 3x with the sharpest textures. = AI（3D 主机：锐化，自然 HD）；N64、PlayStation 和 PSP 为 4x，Dreamcast 为 3x 并使用最清晰的纹理。
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. = 先平滑边缘，再以电视分辨率绘制为 HD 并锐化（AMD FSR）：明显更清晰，依然自然，不会像油画。
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. = 在自然 HD 的干净边缘基础上，将 AI 网络（Anime4K）的结果混入画面，从而保留纹理和抖动：最平滑且没有蜡像感。
Pixel art redrawn by the GPU at the TV's resolution: rounded, clean edges without blur. Quality High uses it; a 3D picture drawn by the GPU gets Smooth Edges. = 由 GPU 以电视分辨率重新绘制像素画：边缘圆滑干净，不模糊。画质“高”使用此项；由 GPU 绘制的 3D 画面使用平滑边缘。
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest HD look for pixel art. Quality Ultra uses it; a 3D picture drawn by the GPU gets Natural HD (the network would only make it smaller). = 先用 xBRZ，再由全强度的神经网络（Anime4K）清理每条边缘和曲线：像素画最平滑的 HD 效果。画质“极高”使用此项；由 GPU 绘制的 3D 画面使用自然 HD（神经网络只会让它变小）。
Pixel Art HD: the GPU redraws the pixels as clean HD shapes at the TV's resolution (xBRZ). = 像素画 HD：GPU 以电视分辨率将像素重新绘制为干净的 HD 形状（xBRZ）。
AI: Pixel Art HD, then an AI network (Anime4K) smooths every edge and curve: the smoothest HD. = AI：先像素画 HD，再由 AI 网络（Anime4K）平滑每条边缘和曲线：最平滑的 HD。
Pixel Art HD on both screens: redrawn as clean HD shapes at the TV's resolution (xBRZ). = 两个屏幕都使用像素画 HD：以电视分辨率重新绘制为干净的 HD 形状（xBRZ）。
AI on both screens: Pixel Art HD, then an AI network (Anime4K) smooths every edge: the smoothest HD. = 两个屏幕都使用 AI：先像素画 HD，再由 AI 网络（Anime4K）平滑每条边缘：最平滑的 HD。
4x (960p) with Smooth Edges. The size changes at the next start. = 4x（960p），平滑边缘。尺寸在下次启动时改变。
4x (960p), made crisper by AMD's sharpening (Natural HD). The size changes at the next start. = 4x（960p），用 AMD 的锐化使其更清晰（自然 HD）。尺寸在下次启动时改变。
3x (720p), smooth textures, true colour and steady 3D (PGXP), with Smooth Edges. = 3x（720p），平滑纹理、真彩色和稳定 3D（PGXP），平滑边缘。
4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA), made crisper (Natural HD). = 4x（960p），平滑纹理、稳定 3D、4x 抗锯齿（MSAA），更加锐利（自然 HD）。
3x (1440x816), the sharpest textures far away, with Smooth Edges. = 3x（1440x816），远处纹理最清晰，平滑边缘。
2x (1280x960), textures 8x sharp far away, with Smooth Edges. The size changes at the next start. = 2x（1280x960），远处纹理 8x 清晰，平滑边缘。尺寸在下次启动时改变。
3x (1920x1440, made smaller for the TV), textures 8x sharp far away, with Smooth Edges. The size changes at the next start. = 3x（1920x1440，为电视缩小），远处纹理 8x 清晰，平滑边缘。尺寸在下次启动时改变。
3x (1920x1440), the sharpest textures far away (16x), made crisper (Natural HD). The size changes at the next start. = 3x（1920x1440），远处纹理最清晰（16x），更加锐利（自然 HD）。尺寸在下次启动时改变。


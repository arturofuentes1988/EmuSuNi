Natural HD = HD natural
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. Quality High uses it. = Suavizado de bordes, y luego dibujado en HD a la resolución de la TV y con más nitidez (AMD FSR): claramente más nítido, natural, nunca pintado. Lo usa la calidad Alta.
Natural AI = IA natural
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. Quality Ultra uses it. = Los bordes limpios del HD natural con una red de IA (Anime4K) mezclada en la imagen, así se conservan las texturas y las tramas: el aspecto más suave sin verse de cera. Lo usa la calidad Ultra.
AI (Anime4K) = IA (Anime4K)
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest, most painted HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ y luego una red neuronal (Anime4K) a toda potencia limpia cada borde y curva: el aspecto HD más suave y más pintado para SNES, NES y las Game Boy. La N64 usa HD suave.
Draws the picture with the GPU's filters at the TV's resolution. Every filter but HD Sharpen starts from the console's own picture: Resolution and the Upscaling Filter are left out. = Dibuja la imagen con los filtros de la GPU a la resolución de la TV. Todos los filtros menos Nitidez HD parten de la imagen propia de la consola: Resolución y el Filtro de escalado no se usan.

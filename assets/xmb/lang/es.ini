Redrawn at 1536x1344, then made smaller for the TV (a little smoother). = Redibujada a 1536x1344 y luego reducida para la TV (un poco más suave).
As big as the TV allows. = Tan grande como permite la TV.
The biggest whole multiple of the console's lines (4x on a 1080p TV): every pixel the same size, with a black border. = El mayor múltiplo entero de las líneas de la consola (4x en una TV de 1080p): todos los píxeles del mismo tamaño, con un borde negro.

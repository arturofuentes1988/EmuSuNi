As on a TV of the time: a little wider than the console's own pixels. = Como en una TV de la época: un poco más ancha que los píxeles de la consola.
Square pixels, exactly as the console draws them (a little narrower). = Píxeles cuadrados, tal como los dibuja la consola (un poco más estrecha).
Stretched to a widescreen TV (everything looks wider). = Estirada a una TV panorámica (todo se ve más ancho).
Fills the whole screen, whatever its shape. = Llena toda la pantalla, sea cual sea su forma.
The console's own 256x224 picture, enlarged by the TV (the fastest). = La imagen propia de la consola, 256x224, agrandada por la TV (lo más rápido).
Redrawn at 512x448 before it is fitted to the TV. = Redibujada a 512x448 antes de ajustarla a la TV.
Redrawn at 768x672: for 720p TVs. = Redibujada a 768x672: para TV de 720p.
Redrawn at 1024x896. = Redibujada a 1024x896.

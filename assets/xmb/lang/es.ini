The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP in Full HD with anti-aliasing. Heavy N64 games can slow down. = Lo mejor que puede cada consola: IA natural, una red de IA (Anime4K) que limpia cada borde y conserva las texturas (sin aspecto de cera); la N64 a 4x con 2D en HD; la PlayStation a 4x con texturas suaves, 3D estable y antialiasing; la PSP en Full HD con antialiasing. Los juegos pesados de N64 pueden ir lentos.
Smooth Edges = Suavizado de bordes

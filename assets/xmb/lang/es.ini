Cross: press a new button. Left: none. Held, the game runs faster (how fast: Fast Forward in the game's settings). A button the console uses too does both. = Cruz: pulsa un botón nuevo. Izquierda: ninguno. Mantenido, el juego va más rápido (cuánto: Avance rápido en los ajustes del juego). Un botón que también usa la consola hace las dos cosas.

At Once = Al momento
The N64 waits at every frame until its picture is made, as before. = La N64 espera en cada fotograma a que su imagen esté hecha, como antes.
When the N64's picture is made: by the graphics thread one frame later (faster), or at once. = Cuándo se hace la imagen de la N64: por el hilo gráfico un fotograma después (más rápido) o al momento.

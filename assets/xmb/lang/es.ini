Controls back to the default = Controles por defecto de nuevo
Left / Right: which DualShock 4 controls move it. = Izquierda / Derecha: qué controles del DualShock 4 lo mueven.
No button pressed: nothing changed = No se pulsó ningún botón: no cambió nada
CONTROLS - THIS GAME = CONTROLES - ESTE JUEGO
CONTROLS - ALL GAMES = CONTROLES - TODOS LOS JUEGOS
Speed while the Fast Forward button is held. Each console has its own button: see it in Controls. = Velocidad mientras mantienes el botón de avance rápido. Cada consola tiene el suyo: míralo en Controles.

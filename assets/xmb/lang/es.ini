Rounded edges and clean lines: the most HD look. = Bordes redondeados y líneas limpias: el aspecto más HD.
Softer edges, closer to the original pixels (up to 4x). = Bordes más suaves, más cerca de los píxeles originales (hasta 4x).
Bigger square pixels: crisp and even, like the original. = Píxeles cuadrados más grandes: nítidos y parejos, como el original.

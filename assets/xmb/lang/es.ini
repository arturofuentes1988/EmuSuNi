Your own choices (they match none of the four levels). = Tus propios ajustes (no coinciden con ninguno de los cuatro niveles).
Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the 3DS at 1x), no upscaler and no filters. = La resolución propia de cada consola (la N64, la PlayStation, la PSP, la DS y la 3DS a 1x), sin escalado ni filtros.
Smooth Edges; the N64, the PlayStation, the PSP and the 3DS at 2x. = Suavizado de bordes; la N64, la PlayStation, la PSP y la 3DS a 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP and the 3DS at 3x. = HD natural; la N64 y la PlayStation a 4x, la PSP y la 3DS a 3x.
Natural AI; the N64, the PlayStation and the PSP at 4x, the 3DS at 3x. = IA natural; la N64, la PlayStation y la PSP a 4x, la 3DS a 3x.
The picture in one choice: Low is the console's own; each level above is sharper and more work for the PS4. Changing one of its settings makes it Custom. = La imagen en una sola opción: Baja es la de la propia consola; cada nivel por encima es más nítido y exige más a la PS4. Cambiar uno de sus ajustes la deja en Personalizada.
The console's own resolution: its picture as it made it, made bigger for the TV, with no filters. = La resolución propia de la consola: su imagen tal como la hacía, agrandada para la TV, sin filtros.
Smooth Edges: the GPU smooths the jagged edges; the pixels stay as they are. = Suavizado de bordes: la GPU suaviza los bordes dentados; los píxeles se quedan como son.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR). = HD natural: bordes suaves y luego una imagen HD nítida a la resolución de la TV (AMD FSR).
Natural AI: Natural HD with an AI network (Anime4K) that cleans every edge; the textures stay. = IA natural: HD natural con una red de IA (Anime4K) que limpia cada borde; las texturas se mantienen.
The console's own resolution: both screens as the DS made them (256x192), with no filters. = La resolución propia de la consola: las dos pantallas tal como las hacía la DS (256x192), sin filtros.
Smooth Edges on both screens: the GPU smooths the jagged edges. = Suavizado de bordes en las dos pantallas: la GPU suaviza los bordes dentados.
Natural HD on both screens: smooth edges, then a sharp HD picture (AMD FSR). = HD natural en las dos pantallas: bordes suaves y luego una imagen HD nítida (AMD FSR).
Natural AI on both screens: Natural HD with an AI network (Anime4K) that cleans every edge. = IA natural en las dos pantallas: HD natural con una red de IA (Anime4K) que limpia cada borde.
The console's own resolution, with no filters: the lightest. The size changes at the next start. = La resolución propia de la consola, sin filtros: lo más ligero. El tamaño cambia al iniciar el próximo juego.
2x (480p) with Smooth Edges. The size changes at the next start. = 2x (480p) con Suavizado de bordes. El tamaño cambia al iniciar el próximo juego.
4x (960p) with Natural HD. The size changes at the next start. = 4x (960p) con HD natural. El tamaño cambia al iniciar el próximo juego.
4x (960p) with Natural AI, and smooth HD text and icons. The size changes at the next start. = 4x (960p) con IA natural, y texto e iconos en HD suave. El tamaño cambia al iniciar el próximo juego.
The console's own resolution (1x), its own textures and colours, with no filters. = La resolución propia de la consola (1x), sus propias texturas y colores, sin filtros.
2x (480p), smooth textures (xBR) and true colour, with Smooth Edges. = 2x (480p), texturas suaves (xBR) y color real, con Suavizado de bordes.
4x (960p), smooth textures, true colour and steady 3D (PGXP), with Natural HD. = 4x (960p), texturas suaves, color real y 3D estable (PGXP), con HD natural.
4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA) and Natural AI. = 4x (960p), texturas suaves, 3D estable, antialiasing 4x (MSAA) e IA natural.
The console's own resolution (480x272), with no filters. = La resolución propia de la consola (480x272), sin filtros.
2x (960x544), sharper textures far away, with Smooth Edges. = 2x (960x544), texturas más nítidas a lo lejos, con Suavizado de bordes.
3x (1440x816), the sharpest textures far away, with Natural HD. = 3x (1440x816), las texturas más nítidas a lo lejos, con HD natural.
4x (1920x1088, Full HD), the sharpest textures far away, made crisper (Natural HD). = 4x (1920x1088, Full HD), las texturas más nítidas a lo lejos, con más definición (HD natural).
The console's own resolution (400x240 and 320x240): the lightest. The size changes at the next start. = La resolución propia de la consola (400x240 y 320x240): lo más ligero. El tamaño cambia al iniciar el próximo juego.
2x (800x480): sharper 3D, more work for the GPU. The size changes at the next start. = 2x (800x480): 3D más nítido, más trabajo para la GPU. El tamaño cambia al iniciar el próximo juego.
3x (1200x720): the sharpest, for the lighter games. The size changes at the next start. = 3x (1200x720): lo más nítido, para los juegos más ligeros. El tamaño cambia al iniciar el próximo juego.
3x, as High: the most the 3DS has for now (no GPU filters for it yet). The size changes at the next start. = 3x, como Alta: lo máximo que tiene la 3DS por ahora (aún sin filtros de GPU para ella). El tamaño cambia al iniciar el próximo juego.

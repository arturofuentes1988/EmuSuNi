# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = Ajusta de una vez la imagen a un nivel: resolución, escalado (CPU y GPU), tamaño de imagen, y el tamaño, la sincronía y el 2D de la N64. Si cambias alguno de ellos, pasa a Personalizada. El juego muestra el cambio al momento, pero el tamaño y la sincronía de la N64 cambian al iniciar el próximo juego. La Dreamcast siempre juega en Baja (la PS4 aún no da para más).
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = Suaviza los bordes dentados del 3D (multimuestreo, en la GPU). Si lo cambias durante la partida, su 3D se prepara de nuevo: puede ir a tirones unos segundos.

# --- EmuSuNi 00.21: the N64's speed
N64 Graphics Sync = Sincronía de gráficos N64
Fast (asynchronous) = Rápida (asíncrona)
The GPU draws while the N64 runs: much smoother on the PS4. = La GPU dibuja mientras la N64 sigue: mucho más fluido en la PS4.
Accurate (synchronous) = Exacta (síncrona)
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens). = La N64 espera cada imagen: más lento. Para los pocos juegos cuyos efectos leen la pantalla (fotos de cámara, algunas pantallas de pausa).
Whether the N64 waits for the GPU's pictures (ParaLLEl-RDP's Synchronous RDP). = Si la N64 espera las imágenes de la GPU (Synchronous RDP de ParaLLEl-RDP).
The N64's own picture: the smoothest. = La imagen propia de la N64: lo más fluido.
Twice the size: sharper 3D; heavy scenes can slow down. = El doble de tamaño: 3D más nítido; las escenas pesadas pueden ir lentas.
Four times: the sharpest; too heavy for most games on the PS4. = Cuatro veces: lo más nítido; demasiado pesado para la mayoría de juegos en la PS4.
The size the GPU draws N64 games at (ParaLLEl-RDP). Native is the smoothest. = El tamaño al que la GPU dibuja los juegos de N64 (ParaLLEl-RDP). Nativa es lo más fluido.
Quality = Calidad
Custom Quality = Personalizada
Your own choices (they match none of the three levels). = Tus propios ajustes (no coinciden con ninguno de los tres niveles).
Low (fastest) = Baja (la más rápida)
The fastest: the consoles' own pictures, fit to the screen; the N64 at its own size. = Lo más rápido: la imagen propia de cada consola, ajustada a la pantalla; la N64 a su tamaño.
Medium (balanced) = Media (equilibrada)
Sharper: SNES and NES redrawn at 3x (xBRZ); the N64 at its own size. = Más nítida: SNES y NES redibujados a 3x (xBRZ); la N64 a su tamaño.
High (sharpest) = Alta (la más nítida)
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 2x; heavy N64 games can slow down. = Lo más nítido: SNES y NES a 6x (xBRZ) y la N64 a 2x; los juegos pesados de N64 pueden ir lentos.
Sets the picture for a level at once: resolution, upscaling, picture size, and the N64's size and sync. Changing one of them makes it Custom. = Ajusta de una vez la imagen a un nivel: resolución, escalado, tamaño de imagen, y el tamaño y la sincronía de la N64. Si cambias alguno de ellos, pasa a Personalizada.

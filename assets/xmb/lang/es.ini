# --- EmuSuNi 00.26: the N64's picture
N64 Anti-Aliasing = Suavizado de bordes de N64
On (the N64's) = Activado (el de la N64)
Smooth 3D edges, as the N64's video chip made them. = Bordes 3D suaves, como los hacía el chip de vídeo de la N64.
Jagged 3D edges, a little sharper: the picture before the N64's filter. = Bordes 3D dentados, algo más nítidos: la imagen antes del filtro de la N64.
The N64's own edge smoothing (its video chip). Costs almost nothing. = El suavizado de bordes propio de la N64 (su chip de vídeo). Casi no cuesta nada.
N64 Dither Filter = Filtro de tramado de N64
Smooth colours: the N64's filter hides the dots of its 16-bit colours. = Colores suaves: el filtro de la N64 oculta los puntos de sus colores de 16 bits.
The dots stay: grainy skies, fog and shadows. = Los puntos se quedan: cielos, niebla y sombras granulados.
The N64 drew its 16-bit colours with a pattern of dots; its video chip blended them away. = La N64 dibujaba sus colores de 16 bits con un patrón de puntos; su chip de vídeo los difuminaba.
N64 2D Graphics = Gráficos 2D de N64
Exact = Exactos
Text, icons and 2D backgrounds as the N64 drew them: blocky, without seams. = Textos, iconos y fondos 2D como los dibujaba la N64: pixelados, sin cortes.
Smooth (HD) = Suaves (HD)
Text, icons and 2D backgrounds at the N64 Resolution: smoother; some games show thin lines between their pieces. = Textos, iconos y fondos 2D a la Resolución de N64: más suaves; algunos juegos muestran líneas finas entre sus piezas.
How the HUD, text and 2D pictures are drawn above Native resolution. = Cómo se dibujan el marcador, los textos y las imágenes 2D por encima de la resolución nativa.
N64 Distant Textures = Texturas lejanas de N64
Sharp (HD) = Nítidas (HD)
Far textures as sharp as the N64 Resolution allows. = Texturas lejanas tan nítidas como permita la Resolución de N64.
As the N64 = Como en la N64
Far textures as blurry as on the N64: for the few games that swap textures with the distance. = Texturas lejanas tan borrosas como en la N64: para los pocos juegos que cambian texturas según la distancia.
The texture detail of far surfaces above Native resolution. = El detalle de textura de las superficies lejanas por encima de la resolución nativa.
N64 Screen Effects = Efectos de pantalla de N64
Blurs, pause screens and photos made from the game's own picture, at the N64's size. = Desenfoques, pantallas de pausa y fotos hechas con la propia imagen del juego, al tamaño de la N64.
Smooth (SSAA) = Suaves (SSAA)
Those effects made from the sharp picture: smoother; a few games glitch. = Esos efectos hechos con la imagen nítida: más suaves; algunos juegos fallan.
Effects some games make from their own picture (pause backgrounds, motion blur), above Native resolution. = Efectos que algunos juegos hacen con su propia imagen (fondos de pausa, estela de movimiento), por encima de la resolución nativa.
Four times (about Full HD): the sharpest; heavy games can slow down. = Cuatro veces (casi Full HD): lo más nítido; los juegos pesados pueden ir lentos.
Sharper: SNES and NES redrawn at 3x (xBRZ); the N64 at 2x. = Más nítida: SNES y NES redibujados a 3x (xBRZ); la N64 a 2x.
The sharpest: SNES and NES at 6x (xBRZ), the N64 at 4x; heavy N64 games can slow down. = Lo más nítido: SNES y NES a 6x (xBRZ) y la N64 a 4x; los juegos pesados de N64 pueden ir lentos.
# --- EmuSuNi 00.27: Ultra and the GPU's filters
Ultra (maximum) = Ultra (máxima)
The best each console can do: SNES and NES redrawn by the GPU with xBRZ and an AI network (Anime4K); the N64 at 4x with HD 2D, sharpened. Heavy N64 games can slow down. = Lo mejor que puede cada consola: SNES y NES redibujados por la GPU con xBRZ y una red de IA (Anime4K); la N64 a 4x con 2D en HD y más nitidez. Los juegos pesados de N64 pueden ir lentos.
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = Ajusta de una vez la imagen a un nivel: resolución, escalado (CPU y GPU), tamaño de imagen, y el tamaño, la sincronía y el 2D de la N64. Si cambias alguno de ellos, pasa a Personalizada.
GPU Upscaler = Escalado por GPU
The picture as Resolution and the Upscaling Filter make it. = La imagen tal como la hacen la Resolución y el Filtro de escalado.
Pixel Art HD (xBRZ) = Pixel Art HD (xBRZ)
SNES and NES redrawn by the GPU at the TV's full resolution: rounded, clean edges without blur; frees the CPU. The N64 gets Smooth HD. = SNES y NES redibujados por la GPU a la resolución completa de la TV: bordes redondeados y limpios, sin desenfoque; libera la CPU. La N64 usa HD suave.
AI (xBRZ + Anime4K) = IA (xBRZ + Anime4K)
xBRZ, then a neural network (Anime4K) cleans every edge and curve: the smoothest HD look for SNES and NES. The N64 gets Smooth HD. = xBRZ y después una red neuronal (Anime4K) limpia cada borde y cada curva: el aspecto HD más suave para SNES y NES. La N64 usa HD suave.
Smooth HD (AMD FSR) = HD suave (AMD FSR)
AMD FidelityFX Super Resolution: smooth upscaling with sharp edges, made for 3D (the N64 at Native and 2x; at 4x it sharpens). = AMD FidelityFX Super Resolution: escalado suave con bordes nítidos, hecho para 3D (la N64 en Nativa y 2x; a 4x solo da nitidez).
HD Sharpen (AMD RCAS) = Nitidez HD (AMD RCAS)
The picture as it is, made crisper by AMD's sharpening (RCAS): for the N64 at 4x and pictures already made bigger. = La imagen tal cual, más nítida con el realce de AMD (RCAS): para la N64 a 4x y para imágenes ya agrandadas.
Draws the picture with the GPU's filters at the TV's resolution. Pixel Art HD, AI and Smooth HD start from the console's own picture: Resolution and the Upscaling Filter are left out. = Dibuja la imagen con los filtros de la GPU a la resolución de la TV. Pixel Art HD, IA y HD suave parten de la imagen original de la consola: la Resolución y el Filtro de escalado no se usan.
N64 CPU Cores = Núcleos de CPU de N64
Fixed = Fijos
Each N64 thread on a PS4 core of its own: the emulation on core 2, its graphics commands on core 3. = Cada hilo de la N64 en su propio núcleo de la PS4: la emulación en el 2 y sus órdenes gráficas en el 3.
PS4's Choice = Los elige la PS4
The PS4 moves the threads between its cores, as before 00.27. = La PS4 mueve los hilos entre sus núcleos, como antes de la 00.27.
Which PS4 cores run an N64 game's threads. Fixed gives the emulation and its graphics thread a core each, so they run at the same time. = Qué núcleos de la PS4 ejecutan los hilos de un juego de N64. Fijos da un núcleo a la emulación y otro a su hilo gráfico, para que trabajen a la vez.
N64 Frame Pacing = Ritmo de fotogramas de N64
Even (V-Sync) = Uniforme (V-Sync)
Each refresh shows the frame the game should be at when the TV shows it: PAL's 50 frames come out even on the TV's 60, and a heavy frame doesn't make the next refresh jump two frames. = Cada refresco muestra el fotograma en el que debe estar el juego cuando la TV lo enseña: los 50 fotogramas del PAL salen uniformes en los 60 de la TV, y un fotograma pesado no hace saltar dos fotogramas en el refresco siguiente.
By the Clock = Por el reloj
By the time each pass of the emulator took, as 00.27: it catches up with two frames in one refresh. = Según el tiempo que tardó cada vuelta del emulador, como la 00.27: recupera con dos fotogramas en un refresco.
How the N64's frames are spread over the TV's refreshes with V-Sync on. = Cómo se reparten los fotogramas de la N64 entre los refrescos de la TV con V-Sync activado.
# --- EmuSuNi 00.28: the N64's picture one frame later
N64 Picture Timing = Momento de la imagen de N64
One Frame Later = Un fotograma después

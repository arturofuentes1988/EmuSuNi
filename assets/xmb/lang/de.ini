# --- EmuSuNi 00.40: the GPU Upscaler's steps (Smooth Edges, Natural HD, Natural AI)
Smooth Edges: the GPU smooths the jagged edges and leaves the pixels and textures as they are; the N64, the PlayStation and the PSP at 2x. = Glatte Kanten: Die GPU glättet die gezackten Kanten und lässt Pixel und Texturen, wie sie sind; der N64, die PlayStation und die PSP in 2x.
Natural HD: smooth edges, then a sharp HD picture at the TV's resolution (AMD FSR) that still looks natural; the N64 and the PlayStation at 4x, the PSP at 3x. Heavy N64 games can slow down. = Natürliches HD: glatte Kanten, dann ein scharfes HD-Bild in der Auflösung des Fernsehers (AMD FSR), das natürlich bleibt; der N64 und die PlayStation in 4x, die PSP in 3x. Aufwendige N64-Spiele können langsamer werden.
The best each console can do: Natural AI, an AI network (Anime4K) that cleans every edge and keeps the textures (no waxy look); the N64 at 4x with HD 2D; the PlayStation at 4x with smooth textures, steady 3D and anti-aliasing; the PSP in Full HD with anti-aliasing. Heavy N64 games can slow down. = Das Beste, was jede Konsole kann: Natürliche KI, ein KI-Netz (Anime4K), das jede Kante säubert und die Texturen behält (kein Wachs-Look); der N64 in 4x mit HD-2D; die PlayStation in 4x mit weichen Texturen, stabilem 3D und Kantenglättung; die PSP in Full HD mit Kantenglättung. Aufwendige N64-Spiele können langsamer werden.
Smooth Edges = Glatte Kanten
Only the jagged edges are smoothed (anti-aliasing: MMPX and SMAA); colours, textures and the pixels' shapes stay as they are. Light on the GPU. Quality Medium uses it. = Nur die gezackten Kanten werden geglättet (Kantenglättung: MMPX und SMAA); Farben, Texturen und die Form der Pixel bleiben, wie sie sind. Leicht für die GPU. Die Qualität Mittel nutzt es.
Natural HD = Natürliches HD
Smooth Edges, then drawn in HD at the TV's resolution and sharpened (AMD FSR): clearly sharper, still natural, never painted. Quality High uses it. = Glatte Kanten, dann in HD in der Auflösung des Fernsehers gezeichnet und nachgeschärft (AMD FSR): deutlich schärfer, trotzdem natürlich, nie gemalt. Die Qualität Hoch nutzt es.
Natural AI = Natürliche KI
Natural HD's clean edges with an AI network (Anime4K) mixed into the picture, so textures and dithering stay: the smoothest look without the waxy one. Quality Ultra uses it. = Die sauberen Kanten von Natürliches HD mit einem ins Bild gemischten KI-Netz (Anime4K), sodass Texturen und Dithering bleiben: der weichste Look ohne Wachs-Effekt. Die Qualität Ultra nutzt es.
AI (Anime4K) = KI (Anime4K)
xBRZ, then a neural network (Anime4K) at full strength cleans every edge and curve: the smoothest, most painted HD look for SNES, NES and the Game Boys. The N64 gets Smooth HD. = xBRZ, dann säubert ein neuronales Netz (Anime4K) mit voller Stärke jede Kante und Kurve: der weichste, am stärksten gemalte HD-Look für SNES, NES und die Game Boys. Der N64 bekommt Weiches HD.
Draws the picture with the GPU's filters at the TV's resolution. Every filter but HD Sharpen starts from the console's own picture: Resolution and the Upscaling Filter are left out. = Zeichnet das Bild mit den Filtern der GPU in der Auflösung des Fernsehers. Alle Filter außer HD-Schärfe gehen vom eigenen Bild der Konsole aus: Auflösung und Skalierungsfilter werden nicht genutzt.

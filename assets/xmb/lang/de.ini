# --- EmuSuNi 00.70: the 3DS CPU Clock's texts (a lower clock seldom saves the PS4 any work)
The game sees a slower 3DS. Less work for the PS4 only in a game that keeps the processor busy without a break; most wait for their next picture and cost the same. = Das Spiel sieht einen langsameren 3DS. Weniger Arbeit für die PS4 nur in einem Spiel, das den Prozessor pausenlos beschäftigt; die meisten warten auf ihr nächstes Bild und kosten gleich viel.
The game sees a 3DS at half speed: a game that needs the speed slows down or stutters. = Das Spiel sieht einen 3DS mit halber Geschwindigkeit: Ein Spiel, das das Tempo braucht, wird langsam oder ruckelt.
How fast the emulated 3DS's processor runs. Most games wait for their next picture, so a lower clock seldom saves the PS4 any work (none in the games tried); a game that needs the speed slows down or freezes. = Wie schnell der Prozessor des emulierten 3DS läuft. Die meisten Spiele warten auf ihr nächstes Bild, daher spart ein niedrigerer Takt der PS4 selten Arbeit (in den getesteten Spielen gar keine); ein Spiel, das das Tempo braucht, wird langsam oder friert ein.


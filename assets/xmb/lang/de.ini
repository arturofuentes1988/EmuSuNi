4x (960p), smooth textures, steady 3D, 4x anti-aliasing (MSAA), made crisper (Natural HD). = 4x (960p), weiche Texturen, stabiles 3D, 4x Kantenglättung (MSAA), klarer gemacht (Natürliches HD).
3x (1440x816), the sharpest textures far away, with Smooth Edges. = 3x (1440x816), die schärfsten Texturen in der Ferne, mit Glatte Kanten.
2x (1280x960), textures 8x sharp far away, with Smooth Edges. The size changes at the next start. = 2x (1280x960), ferne Texturen 8x scharf, mit Glatte Kanten. Die Größe ändert sich beim nächsten Start.

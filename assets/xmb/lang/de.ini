HD Sharpen (AMD RCAS) = HD-Schärfe (AMD RCAS)
The picture as it is, made crisper by AMD's sharpening (RCAS): for the N64 at 4x and pictures already made bigger. = Das Bild, wie es ist, klarer durch AMDs Nachschärfen (RCAS): für den N64 in 4x und bereits vergrößerte Bilder.

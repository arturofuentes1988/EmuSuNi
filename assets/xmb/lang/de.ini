# --- 00.68: the Dreamcast's Quality levels
Each console's own resolution (the N64, the PlayStation, the PSP, the DS and the Dreamcast at 1x), no upscaler and no filters. = Die eigene Auflösung jeder Konsole (N64, PlayStation, PSP, DS und Dreamcast in 1x), ohne Skalierung und ohne Filter.
Smooth Edges; the N64, the PlayStation, the PSP and the Dreamcast at 2x. = Glatte Kanten; N64, PlayStation, PSP und Dreamcast in 2x.
Natural HD; the N64 and the PlayStation at 4x, the PSP and the Dreamcast at 3x. = Natürliches HD; N64 und PlayStation in 4x, PSP und Dreamcast in 3x.
Natural AI; the N64, the PlayStation and the PSP at 4x, the Dreamcast at 3x with the sharpest textures. = Natürliche KI; N64, PlayStation und PSP in 4x, Dreamcast in 3x mit den schärfsten Texturen.
The Dreamcast's own 640x480 picture: the lightest. = Das eigene 640x480-Bild der Dreamcast: am leichtesten.
Twice the size (1280x960): sharper 3D. = Doppelte Größe (1280x960): schärferes 3D.
Three times (1920x1440), made smaller for a 1080p TV: the sharpest 3D, the smoothest edges. = Dreifach (1920x1440), für einen 1080p-Fernseher verkleinert: das schärfste 3D, die glattesten Kanten.
The size the GPU draws Dreamcast, NAOMI and Atomiswave games at: real HD 3D, not an enlarged picture. The size changes at the next start. = Die Größe, in der die GPU Spiele für Dreamcast, NAOMI und Atomiswave zeichnet: echtes HD-3D, kein vergrößertes Bild. Die Größe ändert sich beim nächsten Start.
How sharp the textures of far, slanted surfaces stay (anisotropic filtering, on the GPU). It changes at the next game start. = Wie scharf die Texturen ferner, schräger Flächen bleiben (anisotrope Filterung, auf der GPU). Ändert sich beim nächsten Spielstart.
The console's own resolution (640x480), textures 4x sharp far away: the lightest. The size changes at the next start. = Die eigene Auflösung der Konsole (640x480), ferne Texturen 4x scharf: am leichtesten. Die Größe ändert sich beim nächsten Start.
2x (1280x960), textures 8x sharp far away. The size changes at the next start. = 2x (1280x960), ferne Texturen 8x scharf. Die Größe ändert sich beim nächsten Start.
3x (1920x1440, made smaller for the TV), textures 8x sharp far away. The size changes at the next start. = 3x (1920x1440, für den Fernseher verkleinert), ferne Texturen 8x scharf. Die Größe ändert sich beim nächsten Start.
3x (1920x1440), the sharpest textures far away (16x). The size changes at the next start. = 3x (1920x1440), die schärfsten Texturen in der Ferne (16x). Die Größe ändert sich beim nächsten Start.
# --- 00.68: the N64 (Graphics Sync for Cruis'n USA and Resident Evil 2, Ultra's 2D Exact)
The GPU draws while the N64 runs: much smoother on the PS4. Cruis'n USA and Resident Evil 2 play Accurate anyway (with Fast they stay on a black screen). = Die GPU zeichnet, während der N64 weiterläuft: viel flüssiger auf der PS4. Cruis'n USA und Resident Evil 2 laufen trotzdem mit Genau (mit Schnell bleibt der Bildschirm schwarz).
The N64 waits for each picture: slower. For the few games whose effects read the screen back (camera photos, some pause screens), or a game that goes black with Fast. = Der N64 wartet auf jedes Bild: langsamer. Für die wenigen Spiele, deren Effekte den Bildschirm zurücklesen (Kamerafotos, manche Pausenbildschirme), oder ein Spiel, das mit Schnell schwarz bleibt.
Text, icons and 2D backgrounds at the N64 Resolution: smoother, but many games show lines or squares where their pieces meet (Zelda's pre-drawn rooms, ISS 64's intro). = Text, Symbole und 2D-Hintergründe in der N64-Auflösung: weicher, aber viele Spiele zeigen Linien oder Quadrate, wo ihre Teile aufeinandertreffen (die vorgezeichneten Räume in Zelda, das Intro von ISS 64).
4x (960p) with Natural AI. The size changes at the next start. = 4x (960p) mit Natürliche KI. Die Größe ändert sich beim nächsten Start.


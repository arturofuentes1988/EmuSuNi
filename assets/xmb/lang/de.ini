Each console's own resolution (the N64, the PlayStation, the PSP, the DS, the 3DS and the Dreamcast at 1x), no upscaler and no filters. = Die eigene Auflösung jeder Konsole (N64, PlayStation, PSP, DS, 3DS und Dreamcast in 1x), ohne Skalierung und ohne Filter.
Smooth Edges; the N64, the PlayStation, the PSP, the 3DS and the Dreamcast at 2x. = Glatte Kanten; N64, PlayStation, PSP, 3DS und Dreamcast in 2x.
Pixel Art HD (the 3D consoles: Smooth Edges); the N64 at 4x, the PlayStation, the PSP, the 3DS and the Dreamcast at 3x. = Pixel Art HD (die 3D-Konsolen: Glatte Kanten); N64 in 4x, PlayStation, PSP, 3DS und Dreamcast in 3x.
AI (the 3D consoles: sharpened, Natural HD); the N64, the PlayStation, the PSP and the 3DS at 4x, the Dreamcast at 3x with the sharpest textures. = KI (die 3D-Konsolen: nachgeschärft, Natürliches HD); N64, PlayStation, PSP und 3DS in 4x, Dreamcast in 3x mit den schärfsten Texturen.
Twice the size (800x480): sharper 3D. = Doppelte Größe (800x480): schärferes 3D.
Three times (1200x720): sharper 3D still. = Dreifach (1200x720): noch schärferes 3D.
Four times (1600x960, about Full HD): the sharpest 3D. = Vierfach (1600x960, etwa Full HD): das schärfste 3D.
The size the GPU draws 3DS games at: real HD 3D, not an enlarged picture. A bigger size is more work for the GPU only, but a game that reads its picture back (a few do, for effects) waits for it and can slow down. = Die Größe, in der die GPU 3DS-Spiele zeichnet: echtes HD-3D, kein vergrößertes Bild. Größer heißt nur mehr Arbeit für die GPU, aber ein Spiel, das sein Bild zurückliest (einige tun das für Effekte), wartet darauf und kann langsamer werden.
The console's own resolution (400x240 and 320x240), with no filters: the lightest. The size changes at the next start. = Die eigene Auflösung der Konsole (400x240 und 320x240), ohne Filter: am leichtesten. Die Größe ändert sich beim nächsten Start.
2x (800x480) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 2x (800x480) mit Glatte Kanten. Die Größe ändert sich beim nächsten Start; ein Spiel, das sein Bild zurückliest, kann langsamer werden.
3x (1200x720) with Smooth Edges. The size changes at the next start; a game that reads its picture back can slow down. = 3x (1200x720) mit Glatte Kanten. Die Größe ändert sich beim nächsten Start; ein Spiel, das sein Bild zurückliest, kann langsamer werden.
4x (1600x960), made crisper by AMD's sharpening (Natural HD). The size changes at the next start; a game that reads its picture back can slow down. = 4x (1600x960), klarer durch AMDs Nachschärfen (Natürliches HD). Die Größe ändert sich beim nächsten Start; ein Spiel, das sein Bild zurückliest, kann langsamer werden.


Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. = Stellt das Bild auf einmal auf eine Stufe: Auflösung, Skalierung (CPU und GPU), Bildgröße sowie Größe, Sync und 2D des N64. Änderst du etwas davon, wird es Benutzerdefiniert.

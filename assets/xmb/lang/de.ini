Both pressed together: the menu opens at once. One held and the other pressed later is the game's; a game that presses both at the same moment opens the menu. = Beide zusammen gedrückt: Das Menü öffnet sich sofort. Hältst du eine und drückst die andere später, gehört das dem Spiel; ein Spiel, in dem beide im selben Moment gedrückt werden, öffnet das Menü.
Both pressed together: the menu opens at once. One held and the other pressed later is the game's (a racing game's accelerator and brake); a game that presses both at the same moment opens the menu. = Beide zusammen gedrückt: Das Menü öffnet sich sofort. Hältst du eine und drückst die andere später, gehört das dem Spiel (Gas und Bremse in einem Rennspiel); ein Spiel, in dem beide im selben Moment gedrückt werden, öffnet das Menü.

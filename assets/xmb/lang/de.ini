# --- EmuSuNi 00.62: the PSP's quality while playing
Sets the picture for a level at once: resolution, upscaling (CPU and GPU), picture size, and the N64's size, sync and 2D. Changing one of them makes it Custom. A game shows the change at once, but the N64's size and sync change the next time a game starts. The Dreamcast always plays at Low (the PS4 can't do more yet). = Stellt das Bild auf einmal auf eine Stufe: Auflösung, Skalierung (CPU und GPU), Bildgröße sowie Größe, Sync und 2D des N64. Änderst du etwas davon, wird es Benutzerdefiniert. Ein Spiel zeigt die Änderung sofort, aber Größe und Sync des N64 ändern sich erst beim nächsten Spielstart. Die Dreamcast läuft immer mit Niedrig (mehr schafft die PS4 noch nicht).
Smooths the jagged edges of the 3D (multisampling, on the GPU). Changed while a game runs, its 3D is set up again: it can stutter for a few seconds. = Glättet die gezackten Kanten des 3D (Multisampling, auf der GPU). Wird es im laufenden Spiel geändert, wird das 3D neu eingerichtet: Es kann einige Sekunden ruckeln.

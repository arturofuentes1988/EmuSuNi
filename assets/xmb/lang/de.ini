# --- EmuSuNi 00.81: the 3DS's graphics errors (Accurate Shader Multiplication and 3DS Right Eye, per game)
Accurate Shader Multiplication = Genaue Shader-Multiplikation
On in the games known to need it (the Pokémon games from X and Y to Ultra Sun and Ultra Moon, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Off in the others. = An in den Spielen, die es bekanntermaßen brauchen (die Pokémon-Spiele von X und Y bis Ultrasonne und Ultramond, Majora's Mask 3D, Metroid: Samus Returns, Castlevania: Mirror of Fate), Aus in den anderen.
Multiplies in the shaders exactly as the 3DS does: models, lights and effects drawn right. A little more work for the GPU. = Multipliziert in den Shadern genau wie der 3DS: Modelle, Lichter und Effekte richtig gezeichnet. Etwas mehr Arbeit für die GPU.
The faster multiplication: most games look the same with it. = Die schnellere Multiplikation: Die meisten Spiele sehen damit gleich aus.
How the GPU's shaders multiply: exactly as the 3DS does, or faster. Without it a few games draw white, too bright or black models and effects. (Ocarina of Time 3D and the Mario & Luigi games always use it.) = Wie die Shader der GPU multiplizieren: genau wie der 3DS oder schneller. Ohne sie zeichnen einige Spiele weiße, zu helle oder schwarze Modelle und Effekte. (Ocarina of Time 3D und die Mario & Luigi-Spiele nutzen sie immer.)
3DS Right Eye = Rechtes Auge des 3DS
Not drawn, but drawn in the games known to need it (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition). = Nicht gezeichnet, außer in den Spielen, die es bekanntermaßen brauchen (Majora's Mask 3D, Kingdom Hearts 3D, Pokémon Super Mystery Dungeon, Fire Emblem Warriors, Minecraft: New Nintendo 3DS Edition).
Not Drawn (faster) = Nicht gezeichnet (schneller)
The PS4 shows no 3D, so the right eye's picture is left out: less work in the games that draw both eyes. = Die PS4 zeigt kein 3D, daher wird das Bild des rechten Auges weggelassen: weniger Arbeit in Spielen, die beide Augen zeichnen.
Drawn = Gezeichnet
As on the 3DS: for a game whose screen stays black, freezes on an effect or is out of place. Slower in the games that draw both eyes. = Wie auf dem 3DS: für ein Spiel, dessen Bild schwarz bleibt, bei einem Effekt einfriert oder verrutscht ist. Langsamer in Spielen, die beide Augen zeichnen.
3DS games draw a second picture for the 3D effect, the right eye's, which the PS4 never shows. Leaving it out is faster (Super Mario 3D Land then draws half as much), but a few games show a black, frozen or misplaced screen. = 3DS-Spiele zeichnen ein zweites Bild für den 3D-Effekt, das des rechten Auges, das die PS4 nie zeigt. Es wegzulassen ist schneller (Super Mario 3D Land zeichnet dann halb so viel), aber einige Spiele zeigen dann ein schwarzes, eingefrorenes oder verrutschtes Bild.

